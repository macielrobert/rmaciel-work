    // vertical: the single row, centered in the canvas
    const cy = canvasCssH / 2;
    gridTopCss = cy - cellPx / 2;        // top cell edge — the window margins
                                         // against THIS
    const cx0 = marginPxCss + cellPx / 2;   // always left-aligned

    for (let i = 0; i < N; i++) {
      const ic = icons[i];
      ic.baseCx = cx0 + i * (cellPx + gapPx);   // CONTENT space — no scroll in it
      ic.pxCy = cy;
      ic.cy = 1 - cy / canvasCssH * 2;
    }
    normaliseScroll();                   // a resize changes the cycle; keep the
                                         // offset inside one turn of the new one
    applyScroll();                       // fills wrapCx / pxCx / cx from baseCx
    canvas.classList.toggle('scroll-row', rowScrolls);
    keysEl.classList.toggle('scroll-row', rowScrolls && !!gl);
  }

  // Bring icon i fully inside the viewport, one margin clear of the edge. Both
  // the keyboard and the URL land here: an icon you cannot see is not selected
  // as far as the eye is concerned, and arrowing off the visible end has to
  // take the row with it.
  function ensureVisible(i, instant) {
    if (!rowScrolls || i === null || i === undefined || !icons[i]) return;
    const half = cellPxCss / 2, pad = marginPxCss + ROW_SNAP_INSET;
    const x = icons[i].pxCx;             // where that icon is on screen NOW —
                                         // the nearest copy, so the row always
                                         // takes the short way round
    // ...and clear of the dissolve at whichever edge it is coming in from, the
    // same distance the category jump parks at. An icon brought on screen to be
    // looked at is no more use half dissolved than one jumped to.
    let d = 0;
    if (x - half - pad < 0)               d = x - half - pad;
    else if (x + half + pad > canvasCssW) d = x + half + pad - canvasCssW;
    if (!d) return;
    rowScrollTo(scrollX + d, instant);
  }

  // Move the row to a target, on the snap spring unless told to be instant.
  // Targets are ABSOLUTE and unwrapped: the spring needs somewhere to travel
  // to, so the wrapping is left to applyScroll and normaliseScroll.
  function rowScrollTo(t, instant) {
    if (Math.abs(t - scrollX) < 0.5) return;
    scrollV = 0;
    if (instant || bootRoute) { rowTarget = null; scrollX = t; normaliseScroll(); applyScroll(); }
    else rowTarget = t;                  // springs in stepRowScroll
  }

  // A FOOTER SECTION IS AN ADDRESS ON THE RING: put that section's first icon
  // against the left margin plus ROW_SNAP_INSET, which is what gets it out of
  // the dissolve. On a ring there are infinitely many scroll values that do it, one per turn, so the jump is measured FROM WHERE YOU ARE and
  // takes the nearest — never more than half a turn, forward or back, whichever
  // is shorter. That is also what makes this work on a screen WIDER than the
  // row, where the old clamped version could only ever reach the last section.
  function scrollToSection(n, instant) {
    const ic = icons[SECTION_OFFSET[n]];
    if (!rowScrolls || !ic || !rowCycle) return;
    const want = ic.baseCx - cellPxCss / 2 - marginPxCss - ROW_SNAP_INSET;
    let d = want - scrollX;
    d -= Math.round(d / rowCycle) * rowCycle;   // into [-cycle/2, +cycle/2]
    rowScrollTo(scrollX + d, instant);
  }

  // The glide, integrated once per frame from frame(). It rides the rAF loop
  // the icons already run on — a scroll animation with its own loop would be a
  // second clock, and the two would drift.
  function stepRowScroll(dt) {
    if (field || !rowScrolls || dragId !== null) return;   // the field lays out
                                         // its own cells; a finger owns the row
    if (rowTarget !== null) {
      // THE JUMP, ON THE REASSIGNED BOUNCE. Same spring that used to catch the
      // row at the ends, now driving the only moves the row makes by itself: a
      // footer category jump, and scroll-into-view. Just above critical, so it
      // arrives once and stops.
      scrollV += (rowTarget - scrollX) * ROW_SNAP_K * dt;
      scrollV *= Math.exp(-ROW_SNAP_DAMP * dt);
      scrollX += scrollV * dt;
      if (Math.abs(rowTarget - scrollX) < 0.5 && Math.abs(scrollV) < ROW_STOP_V) {
        scrollX = rowTarget; rowTarget = null; scrollV = 0; normaliseScroll();
      }
      applyScroll();
      return;
    }
    if (scrollV === 0) return;
    // THE COAST RUNS ON FOREVER — there is no end to be caught at, so the only
    // thing that stops it is friction.
    scrollX += scrollV * dt;
    scrollV *= Math.exp(-ROW_FRICTION * dt);    // exponential, not linear: a
                                                // hard flick runs long and a
                                                // nudge stops soon
    if (Math.abs(scrollV) < ROW_STOP_V) { scrollV = 0; normaliseScroll(); }
    applyScroll();
    bandCheck();
  }

  // ------------------------------------------- keyboard / screen-reader grid
  // The DOM twin of the icon grid. The canvas DRAWS the icons; these spans ARE
  // the icons as far as the keyboard and a screen reader are concerned. All
  // geometry comes from relayout()'s output — the same numbers the pointer
  // hit-test uses — so the two paths cannot disagree about where an icon is.
  //
  // ROVING TABINDEX: the grid is ONE tab stop, not thirteen. Exactly one span
  // holds tabindex 0; the arrows move it. Tab enters the grid there and the
  // next Tab leaves for the footer, so the menu never becomes a tab trap.
  //
  // FOCUS IS NOT SELECTION. Arrowing moves focus only; Enter or Space commits.
  // If focus selected, crossing the grid would churn the whole thing once per
  // keypress and open thirteen windows on the way past.
  const keysEl = document.getElementById('nl-keys');
  let keyEls = [];
  let focusIdx = 0;

  // build the layer — every project, once. It is rebuilt only on the way out
  // of the field, which is the one thing that empties it.
  function buildKeys() {
    keysEl.textContent = '';
    // EVERY section, in section order — the same flat list the icons are, so
    // span i is icon i is LIST[i]. Built once now; nothing rebuilds it.
    const ents = DATA.sections.reduce((a, s) => a.concat(s.entries), []);
    focusIdx = 0;
    keyEls = ents.map((en, i) => {
      const s = document.createElement('span');
      s.setAttribute('data-key', '');
      s.setAttribute('role', 'option');
      s.setAttribute('aria-selected', 'false');
      s.setAttribute('aria-label', en.hd);   // an EMPTY span — the label is the
                                             // whole content, so nothing draws
      // ...unless there is no shader, in which case this layer IS the menu and
      // the title has to be readable. Same element, same handlers, same state:
      // only whether it draws changes.
      if (!gl) s.textContent = en.hd;
      s.tabIndex = i === 0 ? 0 : -1;
      s.addEventListener('keydown', (ev) => onKeyNav(ev, i));
      // harmless with a shader (the layer is pointer-events: none there, so it
      // never fires); the only way to select without one
      s.addEventListener('click', () => {
        if (gridInert() || fixture === 'contact') return;        // same locks
        setSelected(selected === i ? null : i);
      });
      keysEl.appendChild(s);
      return s;
    });
    updateKeys();
  }

  // lay every span onto its icon's resting cell box. Called from resize() just
  // after relayout(), so the targets follow the grid through every reflow,
  // rotation, and section change without a second source of geometry.
  function placeKeys() {
    if (!gl) return;                 // flowed as a text list; CSS owns it
    if (!keyEls.length || !canvasCssW) return;
    const sRect = stageEl.getBoundingClientRect();
    const cRect = canvas.getBoundingClientRect();
    keysEl.style.left   = (cRect.left - sRect.left).toFixed(1) + 'px';
    keysEl.style.top    = (cRect.top  - sRect.top ).toFixed(1) + 'px';
    keysEl.style.width  = canvasCssW.toFixed(1) + 'px';
    keysEl.style.height = canvasCssH.toFixed(1) + 'px';
    const half = cellPxCss / 2;
    for (let i = 0; i < keyEls.length && i < icons.length; i++) {
      const s = keyEls[i], ic = icons[i];
      // baseCx, NOT pxCx: the spans sit at content coordinates and the scroll
      // is one transform on the container (see applyScroll). Writing the
      // scrolled position here would apply the offset twice.
      s.style.left   = (ic.baseCx - half).toFixed(1) + 'px';
      s.style.top    = (ic.pxCy - half).toFixed(1) + 'px';
      s.style.width  = cellPxCss.toFixed(1) + 'px';
      s.style.height = cellPxCss.toFixed(1) + 'px';
    }
  }

  // aria-selected mirrors the FROZEN icon, so a screen reader hears the same
  // thing the eye sees: exactly one item selected, or none while a fixture
  // holds the window. The roving tabindex follows the selection too — tabbing
  // back into the grid lands on whatever is currently open, not on item one.
  function updateKeys() {
    const sel = (fixture === null) ? selected : null;
    if (sel !== null) focusIdx = sel;
    const r = bandRange(), lo = r[0], hi = r[1];
    for (let i = 0; i < keyEls.length; i++) {
      keyEls[i].setAttribute('aria-selected', i === sel ? 'true' : 'false');
      keyEls[i].tabIndex = (i === focusIdx) ? 0 : -1;
      // the band, said in type — the fallback's version of the accent-grey art
      keyEls[i].classList.toggle('dim', i < lo || i >= hi);
    }
  }

  // THE TAB STOP FOLLOWS A CHOSEN BAND. A footer link or a '#design' link
  // parks that section's first icon at the left margin, so Tab enters the row
  // there too — not on the first BUILD icon, which the ring has carried
  // somewhere else entirely. Only when a band is CHOSEN, never on every
  // commit: closing a project inside DESIGN still hands Tab back to that
  // project, as it does under ALL. Call before updateKeys(), which writes it.
  function bandStop(n) {
    if (keyEls[SECTION_OFFSET[n]]) focusIdx = SECTION_OFFSET[n];
  }

  function moveFocus(i) {
    if (i < 0 || i >= keyEls.length) return;
    focusIdx = i;
    for (let k = 0; k < keyEls.length; k++) keyEls[k].tabIndex = (k === i) ? 0 : -1;
    // preventScroll is LOAD-BEARING now that the row can scroll: the spans run
    // past the canvas, and the browser's own scroll-focus-into-view would
    // scroll the nearest scrollable ancestor — #nl-grid, which is
    // overflow:hidden, so the offset is silent and nothing ever puts it back.
    // The row is scrolled deliberately instead, on the line below.
    keyEls[i].focus({ preventScroll: true });
    ensureVisible(i);
  }

  // TAB ARRIVES WITHOUT moveFocus: the browser focuses the tab stop itself,
  // wherever the ring has carried it — often off screen, where the clip hides
  // the focus mark. Bring it on screen the same way the arrows do. A second
  // call from moveFocus above finds the same distance and sets the same target.
  keysEl.addEventListener('focusin', (ev) => ensureVisible(keyEls.indexOf(ev.target)));

  function onKeyNav(ev, i) {
    // the grid is inert while it REARRANGES and under the CONTACT LOCK,
    // exactly as the pointer path is — the keyboard gets no privilege the
    // pointer lacks, so a stray Enter can no more discard a draft, or commit
    // an icon that is still travelling, than a stray tap can. Focus may still
    // MOVE while inert; it changes nothing.
    const inert = gridInert() || (fixture === 'contact');
    let d = null;
    switch (ev.key) {
      // Left/Right step the list LINEARLY, so they still work at >=950px where
      // the grid is a single row; Up/Down jump by the current column count.
      case 'ArrowRight': d = i + 1;      break;
      case 'ArrowLeft':  d = i - 1;      break;
      case 'ArrowDown':  d = i + COLS;   break;
      case 'ArrowUp':    d = i - COLS;   break;
      case 'Home':       d = 0;          break;
      case 'End':        d = keyEls.length - 1; break;
      case 'Enter':
      case ' ':
        ev.preventDefault();
        if (inert) return;
        // mirrors the pointer exactly: committing the ALREADY-frozen icon is
        // the exit, the same gesture as tapping the coherent thing
        setSelected(selected === i ? null : i);
        return;
      default: return;                   // every other key belongs to the page
    }
    ev.preventDefault();                  // arrows would otherwise scroll
    // CLAMPED, not wrapped. The filmstrip wraps because it is a line; this is
    // a grid, and running off its end would land somewhere unrelated.
    moveFocus(Math.max(0, Math.min(keyEls.length - 1, d)));
  }

  // The grid half is sized by the grid itself: the cell pitch is a FIXED
  // constant (CELL_PX — icons never change size on rotation OR resize), the
  // available width decides how many columns fit, and the half — and with it
  // the seam — is exactly canvas + footer reserve. Contact takes the rest.
  // Wide enough for every icon in one row (~950px at 15 icons) reads as a
  // menu bar at the foot of the page.
  function resize(force) {
    // the on-screen keyboard collapses 100dvh — re-deriving the grid from that
    // transient viewport makes the page thrash mid-typing. FORCE overrides it
    // for changes that MUST re-lay-out regardless: a section commit swaps in an
    // icon set that has never been positioned, and skipping relayout would
    // leave every icon of the new section stacked at the origin.
    if (kbFrozen && !force) return;

    // THE FIELD SIZES ITSELF FROM THE SCREEN, not from the icon count, so it
    // takes the whole of resize() rather than a branch inside it. Leaving the
    // field if the window drops below the minimum keeps the mode honest: it
    // is offered only where it works, so it should not survive there either.
    if (field) {
      if (rootEl.getBoundingClientRect().width < FIELD_MIN_W) { exitField(); return; }
      buildFieldPreservingResolved();
      fieldResize(false);        // follow the window, do not animate after it
      return;
    }

    // FLAT ROW OR WHEEL, asked again at every width (see wantWheel()), before
    // anything below reads FOOTER_RESERVE. When it flips, updateNav() brings
    // the newly shown rendering into line with the band.
    if (setWheel(wantWheel())) updateNav();

    const nlRect = rootEl.getBoundingClientRect();
    const availW = Math.max(80, nlRect.width);

    // FIXED pitch (the taskbar rule): cell size never follows the viewport.
    // Available width decides how much of the row is VISIBLE, never how big
    // the icons in it are.
    const m = MARGIN_RATIO;
    const basePitch = ROW_PITCH_PX;

    // NO SHADER: there is no canvas to size and no grid to lay out — the key
    // layer flows itself as a wrapped list. Everything else still holds.
    //
    // THE SEAM FOLLOWS THE MENU, exactly as it does with a shader, where the
    // grid half is precisely canvas + footer reserve. Sizing this half to a
    // flat 50% instead — which is what the first version of this branch did —
    // throws that rule away: the titles float in half a screen of nothing and
    // the window is squeezed into the other half for no reason. The menu is
    // made of type here rather than pixels; it gets measured the same way.
    if (!gl) {
      COLS = 1;                          // arrow Up/Down step one in a list
      marginPxCss = basePitch * m;
      rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');   // set
                                         // BEFORE measuring: the list's padding
                                         // derives from it and affects wrapping

      // the wrapped list's natural height IS the measurement. +2 covers the
      // seam's own 1px border so the last row never clips into a scrollbar.
      const listH = Math.ceil(keysEl.scrollHeight) + 2;
      const maxH  = nlRect.height * GRID_MAX_FRAC - FOOTER_RESERVE;   // the same
                                         // last-resort cap the canvas obeys
      const gh    = Math.max(24, maxH > 24 ? Math.min(listH, maxH) : listH);
      gridEl.style.height = (gh + FOOTER_RESERVE).toFixed(1) + 'px';

      // window bottom lands one margin above the seam — the fallback's
      // equivalent of "one margin above the resting grid's top cell edge"
      const wb = Math.min(gh + FOOTER_RESERVE + marginPxCss,
                          nlRect.height - marginPxCss - 60);   // keep >=60px of window
      rootEl.style.setProperty('--nl-win-bottom', Math.max(0, wb).toFixed(1) + 'px');
      const wh = nlRect.height - marginPxCss - Math.max(0, wb);
      rootEl.style.setProperty('--car-h', Math.max(48, wh * 0.25).toFixed(1) + 'px');
      if (typeof updateMore === 'function') updateMore();
      fitThumbs(winEntries[winActive]);   // --car-h just moved, so the thumbs did
      return;
    }

    const N = icons.length || 1;
    COLS = N;                            // one row — the keyboard's Up/Down step

    // ONE ENDLESS ROW at a FIXED pitch. The canvas is always the FULL width and
    // is always a VIEWPORT onto a row that runs past both edges. It used to hug
    // the row and centre it whenever the row happened to fit, and that case is
    // gone with the ring: a row that continues past the right edge cannot stop
    // short of it, or the space beyond would be a gap in something endless.
    let cw = availW;
    let ch = ROW_CANVAS_H;

    // cap the grid half at GRID_MAX_FRAC of the page so the contact half
    // always keeps working room. One row needs a viewport under ~210px tall
    // before this bites at all. Height only: the width is the viewport now, and
    // narrowing a viewport does not buy back any height.
    const maxCh = nlRect.height * GRID_MAX_FRAC - FOOTER_RESERVE;
    if (maxCh > 0 && ch > maxCh) ch = maxCh;

    // the SEAM follows the grid: half height = canvas + footer reserve
    gridEl.style.height = (ch + FOOTER_RESERVE).toFixed(1) + 'px';

    const dpr = Math.min(Math.max(window.devicePixelRatio || 1, RENDER_SCALE_MIN), RENDER_SCALE_MAX);
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width  = Math.max(1, Math.round(cw * dpr));
    canvas.height = Math.max(1, Math.round(ch * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);

    // the backing store was just reallocated — repaint it in the theme
    // background NOW, not at the next frame(), so a resize can never flash
    // an uninitialised buffer
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    canvasCssW = cw; canvasCssH = ch;
    relayout();
    placeKeys();                         // targets follow the grid, one source
    ensureVisible(selected, true);       // a rotation must not leave the open
                                         // project scrolled off the row. No
                                         // animation: the layout already moved

    // ---- window geometry: one margin, derived from the grid pitch.
    // top / left / right = --nl-m from the screen edges; bottom lands the
    // window --nl-m above the RESTING grid's top cell edge (which the warp
    // never moves). Recomputed here because the pitch, the seam, and the
    // canvas position all change on resize.
    const nlRect2 = rootEl.getBoundingClientRect();   // re-read: grid height was just set
    const cRect  = canvas.getBoundingClientRect();
    const gridTopLocal = (cRect.top - nlRect2.top) + gridTopCss;   // in #noiselab space
    let winBottom = nlRect2.height - gridTopLocal + marginPxCss;
    winBottom = Math.min(winBottom, nlRect2.height - marginPxCss - 60);  // keep ≥60px of window
    rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');
    rootEl.style.setProperty('--nl-win-bottom', Math.max(0, winBottom).toFixed(1) + 'px');

    // carousel height: ~25% of the window's actual height, floored so short
    // screens keep a visible strip
    const winH = nlRect2.height - marginPxCss - Math.max(0, winBottom);
    rootEl.style.setProperty('--car-h', Math.max(48, winH * 0.25).toFixed(1) + 'px');

    // the window just changed width: copy re-wraps, so whether it overflows
    // the clamp may have flipped
    if (typeof updateMore === 'function') updateMore();
    /* AND THE THUMBS JUST CHANGED SIZE. --car-h is a fraction of the window,
       so every resize and every rotation moves them; a portrait phone crossing
       480px swaps the grid's column rule outright. Unguarded on purpose:
       resize() is only ever reached from boot() below the point winEntries is
       built, and from listeners wired later still, so there is no order in
       which this can run first. fitThumbs() is a no-op unless a box has
       actually crossed onto a higher rung, which is the common case. */
    fitThumbs(winEntries[winActive]);
  }

  // ----------------------------------------------------- selection + morph
  const smooth = x => x * x * (3 - 2 * x);
  const mixv = (a, b, e) => a + (b - a) * e;

  // selection model:
  //   selected === null -> all icons calm (breathing), contact shows the ABOUT
  //   selected === i      -> icon i FREEZES (static); every other icon is driven
  //                          noisy, and the contact WINDOW opens
  // REST:   tap an icon to activate it; a tap in empty space changes nothing.
  // ACTIVE: the grid IS the navigation —
  //         tap a DIFFERENT icon  -> switch to it directly (no rest stop);
  //         tap the FROZEN icon   -> exit to rest (dissolve the coherent thing);
  //         tap a gap / margin    -> exit to rest.
  //         (the contact half is NOT an exit — misclick protection around
  //         the window and its controls)
  // CONTACT LOCK: while the contact FORM is active, the grid is inert and
  //         Escape is ignored — the × is the ONLY exit, so a stray tap can
  //         never throw away a half-written message.
  // Hit-testing tests each icon's RESTING cell box (pxCx/pxCy), which the warp
  // never moves, so targets stay pinned even while the art churns.
  // THREE state values now, composing cleanly:
  //   activeSection  which footer label is lit (BUILD/DESIGN/ART) — derived
  //                  from the selection; the grid holds every section at once
  //   selected       which project is frozen, as a FLAT index across all
  //                  sections, or null
  //   fixture        'about' | 'contact' | null — a footer entry holding the
  //                  window with NO grid icon behind it
  // The coherence grammar is unchanged, just extended: exactly one thing is
  // still at any moment. With a fixture open that thing is the FOOTER LABEL
  // (ink against the grey row) and the whole grid churns — you have stepped
  // out of the work, so nothing in the work is coherent.
  let selected = null;
  let fixture  = null;
  // WHICH WORK, when the selected icon holds more than one. `selected` still
  // names the ICON — nothing about the grid, the band or the row changes — and
  // this names the entry inside it.
  //
  // SELF-CLEARING, which is why it is not reset in the eight places that move
  // the selection: subEntry() only honours it while the selection is still the
  // lead of the same group, so any other selection makes it inert on its own.
  // A flag that has to be cleared by hand in eight places gets missed in one.
  let subActive = null;
  function subEntry() {
    if (subActive === null || selected === null) return null;
    const en = LIST[subActive], lead = LIST[selected];
    if (!en || !lead || !en.group || en.group !== lead.group) { subActive = null; return null; }
    return en;
  }

  // [lo, hi) of the banded section — the whole row when the band is ALL.
  function bandRange() {
    const sec = activeSection === null ? null : DATA.sections[activeSection];
    if (!sec) return [0, icons.length];
    const lo = SECTION_OFFSET[activeSection];
    return [lo, lo + sec.entries.length];
  }

  function applySelection() {
    const fx = fixture !== null;
    const r = bandRange(), lo = r[0], hi = r[1];
    for (let i = 0; i < icons.length; i++) {
      icons[i].target      = fx ? 1 : (selected === null ? 0 : (i === selected ? 0 : 1));
      icons[i].stillTarget = (!fx && selected !== null && i === selected) ? 1 : 0;
      // COLOUR IS THE THIRD AXIS: churn says what is chosen, colour says what
      // section you are in. An icon outside the band still churns like the
      // rest — it is demoted, not switched off.
      //
      // No exemption for the selected icon, and none needed: commit() clears
      // the band before this runs if the selection landed outside it, so a
      // chosen thing can never be drawn in the resting colour.
      icons[i].dimTarget   = (i >= lo && i < hi) ? 0 : 1;
    }
  }

  // Set the band without touching anything else — the row does not move and
  // the window does not close. Used by the scroll-away fallback, which happens
  // TO you rather than being asked for, and so must not disturb anything else.
  function setBand(n, replace) {
    if (activeSection === n) return;
    activeSection = n;
    applySelection();
    updateNav();
    updateKeys();
    syncRoute(!!replace);
  }

  // ALL: back to the state the page loads in — every icon ink, the window
  // empty. It is the fourth footer link and it lands at rest like the other
  // three, closing whatever the window holds, project or fixture alike.
  // Leaving fixtures open was the bug: with ABOUT up, ALL did nothing at all,
  // because the band was already null and clearing a null band is a no-op.
  //
  // THE ONE THING IT DOES NOT DO IS MOVE THE ROW. BUILD / DESIGN / ART are
  // places in the row and jump to them; ALL is a way of LOOKING at the row, so
  // you keep the position you had and the whole thing lights up around it.
  //
  // No contact-lock exemption, and deliberately: the lock exists so a STRAY
  // tap cannot discard a half-written message, and a footer label is an aimed
  // one. BUILD / DESIGN / ART have always dismissed the form the same way.
  function showAll() {
    if (field) return;            // the field has no band and no window
    if (activeSection === null && selected === null && fixture === null) return;
    const prev = winTarget();
    selected = null; fixture = null; activeSection = null;
    commit(prev);
  }

  // where the window should be pointing, as a FLAT winEntries index (or null
  // for rest). One function so grid selections and footer fixtures share the
  // same open / switch / close machinery.
  function winTarget() {
    if (fixture === 'about')   return ABOUT_INDEX;
    if (fixture === 'contact') return FORM_INDEX;
    if (selected !== null) {
      // the flat icon index IS the flat window index — unless this icon holds
      // a group, where the window may be showing one of the other works
      return subEntry() ? subActive : selected;
    }
    return null;
  }

  // flat icon index -> the section it belongs to. `selected` is flat now, so
  // activeSection is DERIVED from it rather than being a mode you switch into;
  // the footer, the URL, and the title all read it through here.
  function sectionOf(flat) {
    let s = 0;
    for (let i = 1; i < SECTION_OFFSET.length; i++) if (flat >= SECTION_OFFSET[i]) s = i;
    return s;
  }

  // apply whatever state was just set: grid noise, footer marks, and the
  // window (open from rest / switch entry / close), on the existing clocks.
  function commit(prevTarget) {
    // PICKING FROM OUTSIDE THE BAND CLEARS IT. Reaching past the accent grey
    // for something is a statement that the band is no longer what you are
    // looking for, so the row lights back up whole and the footer returns to
    // ALL. The alternative — keeping the band and exempting the one icon from
    // it — left the footer naming a section that had nothing to do with what
    // was open.
    //
    // HERE, not in setSelected(): commit() is the funnel every selection
    // passes through, so the pointer, the keyboard and a deep link all get the
    // same answer without three copies of it.
    if (selected !== null && activeSection !== null) {
      const b = bandRange();
      if (selected < b[0] || selected >= b[1]) activeSection = null;
    }
    applySelection();
    updateNav();
    updateKeys();
    ensureVisible(selected);             // opening a project off the visible
                                         // end of the row brings it into view
                                         // (a deep link does this too)
    const t = winTarget();
    if (t === null)             { contactSet(false); syncRoute(false); return; }
    if (prevTarget === null)    { setWinContent(t); contactSet(true); }  // rest -> open
    else if (t !== prevTarget)  { contactSwap(t); }                      // open -> open
    syncRoute(false);
  }

  // selecting an icon drives the noise: the picked icon freezes static, every
  // other icon activates, and the window opens. Selecting while
  // ALREADY open is a SWITCH: the old icon melts back into the churn (slow
  // clock) while the new one snaps still, and the window re-churns to the new
  // entry via contactSwap. Deselecting (next = null) returns everything to rest.
  function setSelected(next) {
    const prev = winTarget();
    selected = next;
    subActive = null;             // an icon always opens on its FIRST work; the
                                  // sibling row is how you reach the others
    fixture  = null;              // a grid selection always leaves a fixture
    // The band is commit()'s to decide: picking INSIDE it leaves it alone,
    // picking outside it clears it to ALL. Either way the URL names the
    // project's own section, which routeString reads off the selection rather
    // than off the band.
    commit(prev);
  }

  // footer ABOUT / CONTACT: take the window with no grid icon behind them.
  // Tapping the lit one again returns to rest, so each is its own toggle.
  function openFixture(which) {
    const prev = winTarget();
    if (fixture === which) { selected = null; fixture = null; }
    else                   { selected = null; fixture = which; }
    commit(prev);
  }

  // ---- grid reorganisation (position). See NOTES-GRID-MOTION.md.
  // moveActive is true from the moment a move is armed until the LAST icon has
  // settled, which is what gridInert below reads.
  let moveActive = false;

  // Zero the displacement on every menu icon. Cheap and total: an icon left
  // part-way through a move by a path that does not re-arm it would draw
  // permanently off its cell, and clearing the whole set makes that
  // unreachable rather than merely unlikely.
  function cancelGridMotion() {
    for (const ic of allIcons) { ic.move = 0; ic.moveTarget = 0; ic.moveDelay = 0; }
    moveActive = false;
  }

  // Arm the displacement for the CURRENT set. Outgoing: drive to full
  // displacement on the fast clock, arriving exactly as the icon set is
  // exchanged. Incoming: the new set ARRIVES displaced and converges on the
  // slow clock, mirroring how mix already arrives at 1 and eases to 0.
  //
  // STAGGER IS ON THE RETURN ONLY. The way out is ON_TIME (0.12s) and has no
  // room to spread; the way back is OFF_TIME (0.80s) and does. So the set
  // leaves together and settles raggedly, which is the same asymmetry the
  // rest of the file already commits to.
  //
  // WHAT THE ARRANGEMENT IS is NOT designed here. Radial-with-jitter is a
  // placeholder chosen so the mechanism is legible while being watched — the
  // set opens apart and converges, rather than jittering in place. Step 4 in
  // the note is the actual design problem and is deliberately still open.
  //
  // NOTHING ARMS THIS ANY MORE. Its one caller was the section swap, and the
  // menu no longer swaps sets — every section is in one row and the footer
  // scrolls to it. Kept rather than deleted because NOTES-GRID-MOTION.md is an
  // open design branch and this is its steps 1-3; delete both together if that
  // branch is abandoned.
  function armGridMotion(incoming) {
    // OFF BY DEFAULT (see GRID_MOTION). NO SHADER: no icon is drawn at all —
    // #nl-keys IS the menu — so there is nothing to move. REDUCED MOTION:
    // collapse to the instant swap, exactly as the text churn already does.
    // All three ZERO the offsets rather than merely returning, so a set left
    // displaced can never stay that way — and because moveActive is only ever
    // armed below, none of them can leave the grid inert either.
    if (!GRID_MOTION || !gl || reduceMotion) { cancelGridMotion(); return; }
    moveActive = true;
    for (const ic of icons) {
      const a = Math.atan2(ic.pxCy - canvasCssH * 0.5, ic.pxCx - canvasCssW * 0.5)
              + (Math.random() - 0.5) * MOVE_JITTER;
      ic.mvx = Math.cos(a); ic.mvy = Math.sin(a);
      if (incoming) { ic.move = 1; ic.moveTarget = 0; ic.moveDelay = Math.random() * MOVE_STAGGER; }
      else          { ic.moveTarget = 1; ic.moveDelay = 0; }
    }
  }

  // THE GRID IS INERT WHILE IT IS MOVING. While icons travel, the hit test and
  // #nl-keys still read relayout()'s RESTING boxes, so a tap would land on the
  // project that will END UP there, not the one under the finger.
  //
  // This is the deliberate answer to hazard 1 in the note. The alternative —
  // a hit target that chases the drawn position — makes the pointer path and
  // the DOM twin disagree about where an icon is, which is the one thing the
  // twin exists to prevent. Locking is honest and nothing can disagree.
  //
  // Nothing arms the motion today (see armGridMotion), so this is false in
  // practice; the footer was never covered by it either way.
  function gridInert() { return moveActive; }

  // ============================================================== the field
  // A MODE, not a state of the menu. While it is up there is no menu, no
  // seam, no selection and no window — which is why two AGENTS.md rules stop
  // applying here (documented in NOTES-ICON-FIELD.md): "the seam follows the
  // menu" has no seam to follow, and "exactly one thing is coherent" inverts,
  // because the field ACCUMULATES coherence as you resolve shape after shape.
  // That inversion is the point of the piece, not a violation of the grammar.
  //
  // The taskbar rule is NOT suspended: cells are the same fixed 50px as menu
  // icons and only the count changes.
  let field = false;            // is the field up?
  let fieldCells = [];          // its cells — built once, on first entry
  let shapeTex = [];            // baked geometric forms, the resolve targets
  let fieldSwap = null;         // pending entry, seconds remaining
  let savedIcons = null;        // the menu set to come back to

  const fieldBtn = document.getElementById('nl-field');

  // The field is offered only where it can actually be had: a real pointer, a
  // wide screen, a shader, and no stated preference against motion. A
  // reduced-motion version of a motion piece is worse than its absence, so it
  // is withheld rather than degraded — the button simply is not there.
  function fieldAvailable() {
    return !!gl && !reduceMotion && shapeTex.length > 0 &&
           rootEl.getBoundingClientRect().width >= FIELD_MIN_W;
  }
  function updateFieldBtn() {
    rootEl.classList.toggle('can-field', fieldAvailable() || field);
    if (!fieldBtn) return;
    fieldBtn.setAttribute('aria-label', field ? 'Leave the field' : 'Enter the field');
    fieldBtn.setAttribute('aria-pressed', field ? 'true' : 'false');
  }

  // COLS and ROWS both from the viewport at the menu's fixed pitch — Robert's
  // rule, and the exact formula resize() already uses for COLS, applied to the
  // other axis as well. Returns the cell counts and the canvas that holds them.
  function fieldMetrics() {
    const r = rootEl.getBoundingClientRect();
    const g = GAP_RATIO, m = MARGIN_RATIO, pitch = CELL_PX / (1 - g);
    const n = (px) => Math.max(1, Math.floor(px / pitch - 2 * m + g + 1e-6));
    // ROWS COME OFF THE HEIGHT MINUS THE FOOTER RESERVE, not the raw viewport.
    // The footer strip is not available real estate — the canvas is anchored
    // above it, so deriving rows from the full height overfills by about half
    // a row and the top one gets clipped off the screen.
    const cols = n(r.width), rows = n(r.height - FOOTER_RESERVE);
    return { cols, rows, pitch,
             cw: pitch * (cols - g + 2 * m),
             ch: pitch * (rows - g + 2 * m),
             vh: r.height };
  }

  // Build (or rebuild) the cell set for the current viewport. Each cell is
  // DERIVED FROM an icon — it churns that icon's texture, unrecognisably —
  // and carries a different geometric form as what it resolves INTO. That is
  // the description exactly: shapes that no longer represent what they came
  // from.
  let fieldCols = 0, fieldRows = 0;
  let fieldOrder = [];          // resolved cells, oldest first — the budget queue
  let fieldNeedle = -1;         // the calm cell
  let fieldFound = false;
  let fieldRevealT = 0;         // seconds left of the whole-field reveal

  function buildField(keepNeedleAt) {
    const met = fieldMetrics(), N = met.cols * met.rows;
    const src = allIcons;                // one flat menu set to derive from
    fieldCols = met.cols; fieldRows = met.rows;
    fieldOrder = [];
    fieldCells = [];
    for (let i = 0; i < N; i++) {
      const from = src[i % src.length];
      fieldCells.push({
        tex: from ? from.tex : null,
        baseTex: from ? from.tex : null,   // what it churns as, to return to
        // RANDOM, not `i % forms`. Modulo assignment tiles: at the reveal the
        // whole field came out as regular diagonal stripes, which reads as
        // wallpaper and throws away the one moment the array is legible.
        // Scattered, each cell looks like it had its own answer.
        // The LAST form is held back for the needle — see below.
        shapeTex: shapeTex[Math.floor(Math.random() * Math.max(1, shapeTex.length - 1))],
        sx: Math.random() * 127, sy: Math.random() * 127,
        mix: 1, target: 1,              // arrives churning and STAYS churning
        still: 0, stillTarget: 0,       // until a click resolves it
        phase: Math.random() * 100,
        cx: 0, cy: 0, pxCx: 0, pxCy: 0,
        move: 0, moveTarget: 0, moveDelay: 0, mvx: 0, mvy: 0,
        dim: 0, dimTarget: 0,           // the field has no band; always ink
        resolved: false, unswap: false,
        calm: 0,                // 1 on the needle — churns quieter than the rest
        permanent: false,       // exempt from the budget once found
        temp: false,            // resolved only for the reveal
      });
    }
    // Place the needle. On a resize the caller passes the old grid position so
    // a window drag cannot move what someone is hunting for — only a genuinely
    // new field re-rolls it.
    fieldNeedle = -1;
    if (keepNeedleAt && keepNeedleAt.c < fieldCols && keepNeedleAt.r < fieldRows) {
      fieldNeedle = keepNeedleAt.r * fieldCols + keepNeedleAt.c;
    } else if (N > 0) {
      fieldNeedle = Math.floor(Math.random() * N);
    }
    if (fieldNeedle >= 0) {
      fieldCells[fieldNeedle].calm = 1;
      // and it resolves into the one form nothing else in the field carries,
      // so at the reveal the cell you found is visibly singular
      if (shapeTex.length > 1) fieldCells[fieldNeedle].shapeTex = shapeTex[shapeTex.length - 1];
    }
    return met;
  }

  // A resize changes how many cells fit, so the set is rebuilt — but what the
  // visitor already resolved is theirs and must not be wiped by dragging the
  // window. Resolved state is carried across BY GRID POSITION; cells that fall
  // outside the new bounds are lost, which is the honest limit of the mapping.
  function buildFieldPreservingResolved() {
    const old = fieldCells, oc = fieldCols, wasFound = fieldFound;
    const keep = [];
    for (let i = 0; i < old.length; i++) {
      if (old[i].resolved && !old[i].temp) {
        keep.push([i % oc, Math.floor(i / oc), old[i].shapeTex, old[i].permanent]);
      }
    }
    // the needle keeps its grid position across a resize — a window drag must
    // not relocate the thing being hunted for, nor hand out a second chance
    const nAt = fieldNeedle >= 0 && oc > 0
      ? { c: fieldNeedle % oc, r: Math.floor(fieldNeedle / oc) } : null;
    buildField(nAt);
    fieldFound = wasFound;
    fieldRevealT = 0;
    for (const [c, r, tex, perm] of keep) {
      if (c >= fieldCols || r >= fieldRows) continue;
      const k = r * fieldCols + c, ic = fieldCells[k];
      ic.tex = tex; ic.shapeTex = tex; ic.unswap = false; ic.permanent = perm;
      ic.resolved = true; ic.mix = 0; ic.target = 0; ic.still = 1; ic.stillTarget = 1;
      if (!perm) fieldOrder.push(k);
    }
    icons = fieldCells;
  }

  // Lay the cells out. Deliberately NOT relayout(): that one centres a short
  // final row and derives ROWS from the icon count. Here the grid is full by
  // construction and both counts come from the screen.
  function fieldRelayout() {
    if (!field || !fieldCells.length || !canvasCssW || !canvasCssH) return;
    rowCycle = 0;                 // the field is a grid, not a ring — this is
                                  // what puts the draw loop and the hit test
                                  // back on the single position each cell has
    const met = fieldMetrics();
    const cellPx = met.pitch * (1 - GAP_RATIO), gapPx = met.pitch * GAP_RATIO;
    cellPxCss = cellPx;
    footW = 2 * cellPx / canvasCssW;
    footH = 2 * cellPx / canvasCssH;
    const gridW = met.cols * cellPx + (met.cols - 1) * gapPx;
    const gridH = met.rows * cellPx + (met.rows - 1) * gapPx;
    const x0 = (canvasCssW - gridW) / 2 + cellPx / 2;
    const y0 = (canvasCssH - gridH) / 2 + cellPx / 2;
    for (let r = 0, k = 0; r < met.rows; r++) {
      for (let c = 0; c < met.cols && k < fieldCells.length; c++, k++) {
        const ic = fieldCells[k];
        const px = x0 + c * (cellPx + gapPx), py = y0 + r * (cellPx + gapPx);
        ic.pxCx = px; ic.pxCy = py;
        ic.cx = px / canvasCssW * 2 - 1;
        ic.cy = 1 - py / canvasCssH * 2;
      }
    }
  }

  // Size the canvas to the FIELD rather than to the icon count, and raise the
  // seam. The canvas is set to its full size in one step while everything is
  // noise; the half then grows underneath it on a CSS transition, so the field
  // is REVEALED from the bottom up as the line travels off the top. Nothing
  // reallocates the backing store per frame.
  // `animate` is passed only when the seam is actually travelling. A window
  // resize while the field is already up must NOT animate: the height would
  // chase the drag by 900ms behind the pointer, which reads as broken.
  function fieldResize(animate) {
    const met = fieldMetrics();
    if (animate) fieldTransition();
    const dpr = Math.min(Math.max(window.devicePixelRatio || 1, RENDER_SCALE_MIN), RENDER_SCALE_MAX);
    canvas.style.width  = met.cw + 'px';
    canvas.style.height = met.ch + 'px';
    canvas.width  = Math.max(1, Math.round(met.cw * dpr));
    canvas.height = Math.max(1, Math.round(met.ch * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    canvasCssW = met.cw; canvasCssH = met.ch;
    marginPxCss = met.pitch * MARGIN_RATIO;
    rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');
    gridEl.style.height = met.vh + 'px';       // the seam, off the top
    fieldRelayout();
  }

  // The CSS height transition is added only around the move, in BOTH
  // directions, and taken off afterwards. Leaving it on permanently would
  // animate every window resize, which would make an ordinary rotation feel
  // broken.
  let fieldTxTimer = 0;
  function fieldTransition() {
    rootEl.classList.add('field-tx');
    clearTimeout(fieldTxTimer);
    fieldTxTimer = setTimeout(() => rootEl.classList.remove('field-tx'), FIELD_RISE + 120);
  }

  function enterField() {
    if (field || fieldSwap !== null || !fieldAvailable()) return;
    if (selected !== null || fixture !== null) return;   // INACTIVE STATE only:
                                  // every menu option visible, window empty
    savedIcons = icons;
    for (const ic of icons) { ic.target = 1; ic.stillTarget = 0; }   // churn out
    fieldSwap = FIELD_SWAP;       // ...and exchange the set at the midpoint
    field = true;
    rootEl.classList.add('field');
    // NOT fieldTransition() here. The seam does not move until fieldResize()
    // sets its height at the swap, and on a slow first frame that can be a
    // long way after this point — arming the transition window now would let
    // it expire before the height ever changed, and the seam would jump.
    // It is armed where the height actually moves.
    // THE MENU STANDS DOWN. #nl-keys is the real menu for a keyboard and a
    // screen reader; the cells are not links, so the layer is emptied rather
    // than left announcing thirteen projects that are no longer there. The
    // button below stays focusable and becomes the way out.
    keysEl.textContent = ''; keyEls = [];
    updateFieldBtn();
    if (fieldBtn) fieldBtn.focus();
  }

  function exitField() {
    if (!field) return;
    field = false; fieldSwap = null;
    rootEl.classList.remove('field');
    fieldTransition();
    icons = savedIcons || allIcons;
    for (const ic of icons) { ic.mix = 1; ic.target = 0; ic.still = 0; ic.stillTarget = 0; }
    buildKeys();                  // the menu comes back
    resize(true);                 // forced: the canvas must re-derive from the
                                  // icon count, not from the field
    updateFieldBtn();
    if (fieldBtn) fieldBtn.focus();
  }

  function toggleField() { field ? exitField() : enterField(); }

  // A click RESOLVES a cell: its texture becomes the geometric form while it
  // is still full noise — the same invisible exchange the section swap and
  // the window text both use — and then it settles out of the churn and
  // freezes.
  //
  // Clicking a RESOLVED cell puts it back. The texture cannot be swapped at
  // the moment of the click here, the way it can on the way in: the cell is
  // resolved, so the exchange would be plainly visible. It goes back into the
  // churn FIRST and swaps at full noise, which is why baseTex is kept and why
  // this needs the pending flag rather than being one assignment.
  function coalesce(ic) {         // out of the churn, into its shape
    ic.resolved = true;
    ic.tex = ic.shapeTex;
    ic.unswap = false;
    ic.target = 0;
    ic.stillTarget = 1;           // static, exactly like a selected icon
  }
  function dissolve(ic) {         // back into the churn
    ic.resolved = false; ic.temp = false;
    ic.target = 1;
    ic.stillTarget = 0;
    ic.unswap = true;             // texture swaps once the noise hides it
  }

  // FINDING THE NEEDLE resolves the ENTIRE field at once — for a few seconds
  // the whole array is legible, which is the only time it ever is — and then
  // everything dissolves back except the cell that was found.
  function startReveal() {
    fieldRevealT = FIELD_REVEAL;
    for (const c of fieldCells) {
      if (c.resolved) continue;
      c.temp = true;              // resolved only for this moment
      coalesce(c);
    }
  }

  function resolveCell(i) {
    const ic = fieldCells[i];
    if (!ic || fieldRevealT > 0) return;   // inert while the field is revealed
    if (ic.permanent) return;              // the found cell is not takeable back

    if (i === fieldNeedle && !fieldFound) {
      fieldFound = true;
      ic.permanent = true;
      const at = fieldOrder.indexOf(i);
      if (at >= 0) fieldOrder.splice(at, 1);   // it no longer costs budget
      coalesce(ic);
      startReveal();
      return;
    }

    if (ic.resolved) {                     // clicking a resolved cell puts it back
      dissolve(ic);
      const at = fieldOrder.indexOf(i);
      if (at >= 0) fieldOrder.splice(at, 1);
      return;
    }

    coalesce(ic);
    fieldOrder.push(i);
    // THE BUDGET. Past the limit the OLDEST coherent cell dissolves — the
    // field forgets behind you, which is what makes it bigger than the
    // attention you are allowed to spend on it.
    while (fieldOrder.length > FIELD_BUDGET) {
      const j = fieldOrder.shift();
      if (fieldCells[j] && !fieldCells[j].permanent) dissolve(fieldCells[j]);
    }
  }

  // ---- footer BUILD / DESIGN / ART
  // NOT a set exchange any more. Every section is already in the row, in
  // section order, so the footer link is a JUMP: land at rest and snap that
  // section's first icon in from the left margin. The churn-over it used to be
  // was
  // the whole cost of the old arrangement — three menus that had to be
  // dissolved into one another — and there is nothing left to dissolve.
  // Scrolling straight on from the end of one section into the next is now the
  // ordinary case, so the sections are addresses in one row, not pages.
  function switchSection(n) {
    if (field) return;            // there is no section nav in the field
    if (!DATA.sections[n]) return;
    const prev = winTarget();
    selected = null; fixture = null;   // the link names the SECTION, not a
                                       // project in it: it always lands at rest
    activeSection = n;
    bandStop(n);
    commit(prev);                 // footer, keys, window close, URL — one path
    scrollToSection(n);
  }

  // pointer -> icon index, or null for gap / margin. Tested in CSS px against
  // each icon's RESTING cell box (scale 1.0). Walks the ring exactly as the
  // draw loop does: EVERY on-screen copy of an icon is that icon to a tap, so
  // on a wide screen both of the two visible copies open the same project.
  function iconAtPointer(ev) {
    const r = canvas.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width  * canvasCssW;
    const my = (ev.clientY - r.top)  / r.height * canvasCssH;
    const half = cellPxCss / 2;
    for (let i = 0; i < icons.length; i++) {
      const ic = icons[i];
      if (Math.abs(my - ic.pxCy) > half) continue;
      if (!rowCycle) {
        if (Math.abs(mx - ic.pxCx) <= half) return i;
        continue;
      }
      for (let x = ic.wrapCx - rowCycle; x - half < canvasCssW; x += rowCycle) {
        if (Math.abs(mx - x) <= half) return i;
      }
    }
    return null;
  }

  // WHAT A TAP DOES — unchanged, lifted out of the pointerdown handler so the
  // drag path below can reach it too. Rest: an icon selects, empty space
  // dismisses a fixture. Active: the frozen icon or a gap exits, another icon
  // switches directly.
  function selectAt(hit) {
    if (selected === null) {                    // REST (or a fixture is open):
      if (hit !== null) setSelected(hit);       // an icon selects; empty space
      else if (fixture !== null) setSelected(null);   // a gap dismisses a fixture
      return;
    }
    if (hit === null || hit === selected) {     // ACTIVE: frozen icon or gap exits...
      setSelected(null);
      return;
    }
    setSelected(hit);                           // ...another icon switches directly
  }

  // TAP vs DRAG. One pointer does both, and the split is decided on RELEASE:
  // under ROW_TAP_SLOP of travel it was a tap, over it was a swipe. Deciding on
  // PRESS — which is what this did, and still does when the row fits and there
  // is nothing to scroll — would open a project every time a swipe happened to
  // start on an icon, which is most of the time.
  let dragId = null, dragMoved = 0, dragX0 = 0, dragY0 = 0;
  let dragScroll0 = 0, dragLastX = 0, dragLastT = 0;

  canvas.addEventListener('pointerdown', (ev) => {
    // IN THE FIELD a click is not navigation — there is nothing to navigate
    // to. It resolves the cell under the pointer and nothing else. The hit
    // test is the same one the menu uses, against the same resting cell boxes.
    // Checked FIRST: the field has no row to drag and no selection to make.
    if (field) {
      if (fieldSwap !== null) return;           // still churning over
      const c = iconAtPointer(ev);
      if (c !== null) resolveCell(c);
      return;
    }
    if (fixture === 'contact') return;          // CONTACT LOCK: only the x exits
    if (!rowScrolls) { selectAt(iconAtPointer(ev)); return; }   // nothing to scroll
    dragId = ev.pointerId;
    dragMoved = 0;
    dragX0 = dragLastX = ev.clientX; dragY0 = ev.clientY;
    dragScroll0 = scrollX;
    scrollV = 0; rowTarget = null;              // touching it stops it dead —
                                                // catching a moving row is how
                                                // a scroll is expected to work
    dragLastT = performance.now();
    canvas.classList.add('dragging');
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}   // a finger
                                                // that leaves the canvas keeps
                                                // driving the row
  });

  canvas.addEventListener('pointermove', (ev) => {
    if (dragId === null || ev.pointerId !== dragId) return;
    const dx = ev.clientX - dragX0;
    dragMoved = Math.max(dragMoved, Math.abs(dx), Math.abs(ev.clientY - dragY0));

    // The row follows the finger 1:1, with no resistance anywhere: there is no
    // end for a thumb to be told about.
    scrollX = dragScroll0 - dx;

    // Velocity from the LAST move only, lightly low-passed. Averaging the whole
    // gesture instead would make a slow drag that ends in a flick barely move,
    // and the flick is the part the hand meant.
    const now = performance.now(), dt = (now - dragLastT) / 1000;
    if (dt > 0.001) {
      const inst = -(ev.clientX - dragLastX) / dt;   // scrollX rises as the
                                                     // finger moves LEFT
      scrollV = scrollV * 0.2 + inst * 0.8;
      dragLastX = ev.clientX; dragLastT = now;
    }
    applyScroll();
    bandCheck();
  });

  function endDrag(ev, cancelled) {
    if (dragId === null || ev.pointerId !== dragId) return;
    dragId = null;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
    // a finger that stopped before lifting is placing the row, not throwing it
    if (performance.now() - dragLastT > ROW_STALE_MS) scrollV = 0;
    scrollV = Math.max(-ROW_MAX_V, Math.min(ROW_MAX_V, scrollV));
    if (!cancelled && dragMoved <= ROW_TAP_SLOP) { scrollV = 0; selectAt(iconAtPointer(ev)); }
  }
  canvas.addEventListener('pointerup',     (ev) => endDrag(ev, false));
  canvas.addEventListener('pointercancel', (ev) => endDrag(ev, true));

  // WHEEL — EITHER AXIS. A plain vertical wheel scrolls the row, because over
  // this canvas it has nothing else to do: html and body are overflow:hidden,
  // the page is one viewport, and a vertical wheel here did literally nothing
  // before. Claiming it is what gives a mouse-only visitor control of the row
  // without a single added control: no shift to discover, no arrows to click,
  // the same wheel they were already turning. The dominant axis wins, so a
  // trackpad's horizontal swipe and shift+wheel both work unchanged — the
  // browser puts shift+wheel on deltaX or deltaY depending on the platform,
  // and this reads whichever moved.
  //
  // passive:false because the gesture is ours: left unprevented, a two-finger
  // swipe is browser history navigation on macOS.
  canvas.addEventListener('wheel', (ev) => {
    if (field || !rowScrolls) return;   // the field has no row to scroll
    const raw = Math.abs(ev.deltaX) >= Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
    if (!raw) return;
    ev.preventDefault();
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? canvasCssW : 1;   // lines / pages -> px
    rowTarget = null; scrollV = 0;
    // nothing to clamp against: a trackpad's momentum stream can run as long as
    // it likes and the row just keeps turning
    scrollX += raw * unit;
    applyScroll();
    bandCheck();
  }, { passive: false });

  // BELOW THE SEAM IS AN EXIT — the whole half, not just the gaps between
  // icons. That half IS the menu, so a tap on it that lands on nothing means
  // "put this down and show me the menu", which is exactly what a gap between
  // two icons already meant. This extends the same reading to the rest of it:
  // the margins around the row, the footer strip's empty space, the band the
  // footer reserve leaves below the canvas.
  //
  // ABOVE THE SEAM IS STILL NOT AN EXIT. The window and its margins were tried
  // as one and it was wrong: stray taps around the window, especially near the
  // ← back mark, were ejecting the whole state. The rule that replaced it is
  // the one being extended here, not overturned — an exit is somewhere you
  // aimed at, and below the seam you have aimed away from the work.
  //
  // GEOMETRY, NOT THE DOM. #nl-fns and #nl-copy are absolutely positioned
  // siblings of the window, so "below the seam" is not a question the tree can
  // answer. It is the pointer's y against the seam's own rect — the same line
  // the eye is reading.
  //
  // Four things opt out, each because it already answers for itself: the
  // canvas (an icon selects, a gap exits — its own handler, on RELEASE), the
  // key spans that are the menu without a shader, the footer links (the
  // section wheel included, dead space and all — a wheel you missed is not a
  // request to close the work), and the field button.
  rootEl.addEventListener('click', (ev) => {
    if (field) return;                          // the field is its own level
    if (fixture === 'contact') return;          // CONTACT LOCK: the × only, so a
                                                // stray tap cannot discard a draft
    if (selected === null && fixture === null) return;      // nothing open
    if (ev.target.closest('#nl-gl, [data-key], [data-nav], #nl-sec, #nl-field')) return;
    if (ev.clientY < gridEl.getBoundingClientRect().top) return;   // above the seam
    setSelected(null);                          // the same global eject as the ×
  });

  // Exits, in full: the ×, the frozen icon, anywhere below the seam, and
  // Escape. Escape and the ← pop ONE level from an expanded image; the rest
  // eject.

  // ------------------------------------------------------------ system theme
  // The theme follows the DEVICE display setting (prefers-color-scheme) —
  // initial state and live changes. One switch, four surfaces: the CSS vars
  // (--bg/--ink drive every DOM color), the GL clear + uInk, and the
  // html/body backgrounds (overscroll regions). The bakes are never
  // touched — the shader recolors the same white-alpha textures.
  function setTheme(t) {
    const light = t === 'light';
    rootEl.classList.toggle('light', light);
    rootEl.classList.toggle('dark', !light);   // see the two-class note in the CSS
    BG  = light ? [1, 1, 1] : [0, 0, 0];
    INK = light ? [0, 0, 0] : [1, 1, 1];
    // THE ACCENT COMES FROM THE CSS TOKEN, so --accent-rgb stays the ONE place
    // the colour is written and the canvas reads the same number the
    // stylesheet does instead of keeping a second copy.
    //
    // RESOLVED OVER THE BACKGROUND, not carried as a colour plus an alpha: the
    // canvas ground is exactly --bg, so accent * 0.9 + bg * 0.1 drawn at full
    // alpha is pixel-identical to the DOM's rgba(accent, 0.9) on the same
    // ground — and the shader stays a one-colour multiply, with nothing added
    // to it and no second blend to get wrong.
    const a = (getComputedStyle(rootEl).getPropertyValue('--accent-rgb') || '')
                .split(',').map(x => parseFloat(x) / 255);
    const ok = a.length === 3 && a.every(x => x >= 0 && x <= 1);
    const acc = ok ? a : [0.56, 0.56, 0.6];
    DIM = [0, 1, 2].map(i => acc[i] * ACCENT_ALPHA + BG[i] * (1 - ACCENT_ALPHA));
    document.documentElement.style.background = light ? '#fff' : '#000';
    document.body.style.background            = light ? '#fff' : '#000';
    // (theme-color metas are media-scoped in the head — the browser picks
    // the matching one itself; no JS update needed)
  }
  // mqLight and the FIRST setTheme() call live up at the theme-state block, next
  // to the GL clear that needs the theme already resolved. Only the live change
  // listener is here, where the rest of the theme machinery is — and it is not
  // attached at all under ?light / ?dark, or the device would overrule the pin
  // the moment it changed.
  if (!FORCE_THEME && mqLight && mqLight.addEventListener) mqLight.addEventListener('change',
    (e) => setTheme(e.matches ? 'light' : 'dark'));

  // ------------------------------------------------------- footer site nav
  // Kept as spans, not anchors: no href, nothing for a webview to intercept.
  const navEls = Array.from(document.querySelectorAll('#nl-fns > [data-nav]'));
  // the vertical copyright in the right margin — set once, never touched again
  const copyEl = document.querySelector('#nl-copy span');
  if (copyEl) copyEl.textContent = CONTENT.copyright || '';
  // ------------------------------------------------------- the section wheel
  // ALL / BUILD / DESIGN / ART, stacked three-at-a-time to the left of
  // CONTACT. The CSS mask does the lighting and the browser does the
  // scrolling; this is only the two things neither of them can do — make it
  // endless, and turn a landing into a commit.
  const secEl = document.getElementById('nl-sec');
  const SEC_H = 16;                  // px per slot — mirrors --sec-h in the CSS
  // COPIES, NOT MODULO. The list is repeated and the scroll position is
  // returned to the middle copy once the scroll goes quiet, which cannot be
  // seen because every copy is the same four words. ODD, so there is a true
  // middle. Nine is enough that a hard fling from the middle cannot reach an
  // end — four turns each way — and the re-centring only ever happens at
  // REST, because moving scrollTop under a live iOS fling kills the fling.
  const SEC_CYCLES = 9;
  const SEC_MID = (SEC_CYCLES - 1) / 2;
  // ALL is slot 0 because it is the state the page loads in. The rest come
  // from DATA, so a new section needs nothing here.
  //
  // BUILT WHETHER OR NOT IT IS SHOWING: the rendering is re-decided on every
  // resize, and a phone rotating into portrait needs its wheel to exist.
  const secIds  = ['all'].concat(DATA.sections.map(s => s.id));
  const secText = ['ALL'].concat(DATA.sections.map(s => s.label));
  const SEC_N   = secIds.length;

  for (let c = 0; c < SEC_CYCLES; c++) {
    for (let k = 0; k < SEC_N; k++) {
      const el = document.createElement('span');
      el.setAttribute('data-nav', secIds[k]);
      el.textContent = secText[k];
      // ONE copy carries the semantics. A screen reader must hear four
      // sections, not thirty-six, so the other eight copies are the same
      // words again with nothing said about them.
      if (c === SEC_MID) el.setAttribute('role', 'option');
      else el.setAttribute('aria-hidden', 'true');
      secEl.appendChild(el);
    }
  }

  // scrollTop = index * SEC_H exactly, which the half-slot spacers in the CSS
  // are what make true. Everything below is arithmetic on that one fact.
  const secAt   = () => Math.round(secEl.scrollTop / SEC_H);
  const secIdAt = (i) => secIds[((i % SEC_N) + SEC_N) % SEC_N];
  const bandId  = () => activeSection === null ? 'all' : DATA.sections[activeSection].id;

  // Move the wheel to an id, taking the NEARER turn — the same rule the
  // footer jump already uses on the row, for the same reason: a ring has no
  // far side worth travelling to.
  function secTo(id, smooth) {
    const k = secIds.indexOf(id);
    if (k < 0) return;
    const cur = secAt();
    let d = (((k - cur) % SEC_N) + SEC_N) % SEC_N;
    if (d > SEC_N / 2) d -= SEC_N;
    let want = cur + d;
    if (want < 0) want += SEC_N;
    if (want >= SEC_CYCLES * SEC_N) want -= SEC_N;
    const top = want * SEC_H;
    if (top === secEl.scrollTop) return;
    if (smooth && !reduceMotion) secEl.scrollTo({ top: top, behavior: 'smooth' });
    else secEl.scrollTop = top;
  }

  // COMMIT ON REST — the row's tap rule said about a wheel. What you land on
  // is what you asked for; what you turned past is not.
  //
  // Only a scroll the VISITOR started commits. The wheel also moves itself
  // whenever the band changes somewhere else — a deep link, an icon picked
  // from outside the band, the scroll-away fallback — and that must not come
  // back round as a fresh request.
  let secUser = false, secIdle = 0;
  function secSettle() {
    const i = secAt(), id = secIdAt(i);
    const home = SEC_MID * SEC_N + (((i % SEC_N) + SEC_N) % SEC_N);
    if (home !== i) secEl.scrollTop = home * SEC_H;      // back to the middle copy
    for (const el of secEl.children) {
      if (el.getAttribute('role') !== 'option') continue;
      el.setAttribute('aria-selected', el.getAttribute('data-nav') === id ? 'true' : 'false');
    }
    if (!secUser) return;
    secUser = false;
    // landed where it started: a nudge that came back is not a request. This
    // is also what keeps an open PROJECT open — its band is already centred,
    // so turning the wheel back to it does not close the work.
    if (id === (fixture !== null ? fixture : bandId())) return;
    if (id === 'all') showAll();
    else switchSection(secIds.indexOf(id) - 1);          // ALL occupies slot 0
  }
  // scrollend is not on older Safari, and this needs no more precision than
  // "the scroll stopped" — one timer, reset by every scroll event.
  secEl.addEventListener('scroll', () => {
    clearTimeout(secIdle);
    secIdle = setTimeout(secSettle, 120);
  }, { passive: true });
  const secClaim = () => { secUser = true; };
  secEl.addEventListener('pointerdown', secClaim);
  secEl.addEventListener('wheel', secClaim, { passive: true });
  // a half-lit neighbour is a TARGET, not only a signal
  secEl.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-nav]');
    if (!el) return;
    secUser = true;
    secTo(el.getAttribute('data-nav'), true);
  });
  // ONE tab stop with arrow keys, not four tab stops — which is what a
  // listbox is, and what the four separate spans never were.
  secEl.addEventListener('keydown', (ev) => {
    const d = ev.key === 'ArrowDown' ? 1 : ev.key === 'ArrowUp' ? -1 : 0;
    if (!d) return;
    ev.preventDefault();
    secUser = true;
    secEl.scrollTo({ top: (secAt() + d) * SEC_H,
                     behavior: reduceMotion ? 'auto' : 'smooth' });
  });
  if (secWheel) {
    secEl.scrollTop = SEC_MID * SEC_N * SEC_H; // open on the middle copy, at ALL
    secSettle();                               // and mark that slot selected
  }

  // exactly ONE label is ink at a time — the fixture if one is open, else the
  // band. The footer carries the coherence when the grid cannot.
  //
  // BOTH NAVS ARE MARKED, always. navEls holds the flat row AND the two
  // fixtures; under ?wheel the four section labels are display:none, so
  // marking them is free and there is no second code path to keep honest.
  // The wheel needs no .on of its own — its mask lights whatever is centred.
  // Called again by resize() when the rendering flips, which is what brings
  // a wheel that has just appeared round to the band.
  function updateNav() {
    for (const el of navEls) {
      const n = el.getAttribute('data-nav');
      const on = fixture !== null ? fixture === n : n === bandId();
      el.classList.toggle('on', on);
      el.setAttribute('aria-current', on ? 'true' : 'false');
    }
    if (!secWheel) return;
    secEl.classList.toggle('off', fixture !== null);
    // NO GLIDE ON LOAD, for the reason the row does not bounce on load: a page
    // that arrives already in motion reads as a glitch.
    secTo(bandId(), !bootRoute);
  }
  navEls.forEach(el => {
    const n = el.getAttribute('data-nav');
    const fn = () => {
      if (n === 'about' || n === 'contact') { openFixture(n); return; }
      if (n === 'all') { showAll(); return; }
      const si = DATA.sections.findIndex(sec => sec.id === n);
      if (si >= 0) switchSection(si);
    };
    el.addEventListener('click', fn);
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(); }
    });
  });

  // the field's control: same click + Enter/Space contract as every other
  // footer item, so the keyboard path is not a second-class one
  if (fieldBtn) {
    fieldBtn.addEventListener('click', toggleField);
    fieldBtn.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleField(); }
    });
  }

  // ------------------------------------------- window text (coherence swap)
  // The window text is treated as one more icon. One progress value (cMix)
  // eases on the icons' clock going up (dt/ON_TIME) and its own slower clock
  // going down (dt/CONTACT_OFF_TIME = 2x the grid), shaped by smoothstep.
  // While it moves, unresolved
  // characters churn through a glyph pool at their own random thresholds
  // (the per-icon seed analog). There is NO crossfade: each text dissolves
  // fully into churn, a hard visibility swap happens at the midpoint, and the
  // other text re-forms out of churn on the far side.
  // prefers-reduced-motion collapses this to an instant swap of resolved text.
  const aboutEl   = document.getElementById('nl-about');
  const aboutTxt  = document.getElementById('nl-about-text');
  const winEl     = document.getElementById('nl-window');
  const winTxt    = document.getElementById('nl-window-text');

  let cMix = 0, cTarget = 0;     // same semantics as an icon's mix/target
  let cDirty = true;             // force one apply on load
  let cSwapTo = null;            // pending entry for an open->open switch

  function contactSet(open) { cTarget = open ? 1 : 0; cSwapTo = null; if (!open) hardResetExpand(); }

  // open -> open switch: e = 0.5 is exactly "window visible, text 100%
  // churned" (the hard-swap midpoint), so a switch dissolves DOWN to 0.5 on
  // the FAST clock, exchanges the entry there, and resolves back to 1 — the
  // about never appears, and switching stays snappy while exit keeps its
  // slow decay.
  function contactSwap(i) { cTarget = 1; cSwapTo = i; }

  const mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let reduceMotion = mqReduce ? mqReduce.matches : false;
  if (mqReduce && mqReduce.addEventListener) mqReduce.addEventListener('change', (e) => {
    reduceMotion = e.matches; restoreChars(); cDirty = true;
    // the preference can flip DURING a rearrangement. Snap the icons home
    // rather than letting them finish, and lift the input lock with them —
    // otherwise the grid stays inert waiting on an ease that no longer runs.
    if (reduceMotion) cancelGridMotion();
  });

  // wrap every non-space character in a span with a random resolve threshold
  // (the per-icon seed analog). BRs and spaces pass through untouched so line
  // structure and word shapes survive the churn.
  function spanify(el) {
    const spans = [];
    (function walk(node) {
      for (const k of Array.from(node.childNodes)) {
        if (k.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const ch of k.textContent) {
            if (ch === ' ' || ch === '\u00a0' || ch === '\n') { frag.appendChild(document.createTextNode(ch)); continue; }
            const s = document.createElement('span');
            s.textContent = ch;
            spans.push({ el: s, ch, t: 0.05 + Math.random() * 0.9 });
            frag.appendChild(s);
          }
          node.replaceChild(frag, k);
        } else if (k.nodeType === 1 && k.tagName !== 'BR' &&
                   k.tagName !== 'INPUT' && k.tagName !== 'TEXTAREA') {
          walk(k);
        }
      }
    })(el);
    return spans;
  }
  const aboutSpans = spanify(aboutTxt);

  // the close mark is a GLOBAL exit, not content: it never churns — it rides
  // the window's visibility but stays resolved and fixed. Tap / Enter /
  // Space exit; Escape exits from anywhere on keyboard devices
  const closeEl = document.getElementById('nl-close');
  closeEl.addEventListener('click', () => setSelected(null));
  closeEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setSelected(null); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape') return;
    if (field) { exitField(); return; }                 // the field is its own level
    if (xTarget === 1) { collapseExpand(); syncRoute(false); }   // pop the image first...
    else if (fixture === 'contact') { /* contact lock: the x is the only exit */ }
    else if (selected !== null || fixture !== null)
      setSelected(null);                               // ...then the window
    // (contact lock: Escape is ignored on the form — the x is the only exit)
  });

  // Build all window entries from LIST (entries + about) — each gets its
  // TEXT div and, IF it has images, its OWN carousel strip in the #nl-car
  // host, driven entirely by the entry's images array. An entry WITHOUT
  // images (ABOUT; any imageless project) gets no strip — full-height text,
  // same path as the form. Churn state is per-entry, and switching selection
  // is a display swap, not a rebuild. Thumbs render their image as a cover
  // background (grey base shows while loading) and are tappable (expand /
  // jump / collapse); the expand view reads the SAME records.
  const carHost = document.getElementById('nl-car');
  const winEntries = LIST.map((en, i) => {
    const d = document.createElement('div');
    if (i !== 0) d.style.display = 'none';
    // THE HEADING IS THE CLIENT when this entry belongs to a group — the
    // icon named them, so the window agrees with the icon and the sibling row
    // below says which of their projects you are looking at.
    d.innerHTML = `<span class="hd">${en.groupTitle || en.hd}</span><br><br>`
      + `${en.lines.join('<br>')}<br><br>`
      + `<div class="body">${paras(en.blurb).join('<br><br>')}</div>`;
    winTxt.appendChild(d);
    let car = null, thumbs = null;
    if (en.images && en.images.length) {
      car = document.createElement('div');
      car.className = 'car';
      if (i !== 0) car.style.display = 'none';
      carHost.appendChild(car);
      thumbs = en.images.map((im, k) => {
        const ph = document.createElement('div');
        ph.className = 'ph';
        // NOT PAINTED HERE. The box has no size until CSS has laid it out and
        // this entry is the visible one, and the width we ask for is read off
        // that box — so the background-image is fitThumbs()' job, not the
        // builder's. The one URL this function still builds is the ratio
        // probe below, and that is not a picture: nobody looks at it.
        if (en.layout === 'grid') {
          // a grid is uniform by definition: every cell 16:9, images cropped
          // to fill. The per-image ratio is deliberately ignored here.
          ph.style.aspectRatio = '16 / 9';
        } else if (im.ratio) {
          ph.style.aspectRatio = im.ratio[0] + ' / ' + im.ratio[1];
        } else {
          // FALLBACK ONLY — a record with no ratio. Hold a square, measure on
          // decode, settle once. This costs a network fetch PER IMAGE at load,
          // for every entry, visible or not: it is why ratio should always be
          // stored. Probing the THUMB keeps the damage to a small file rather
          // than pulling every full-size image on the site.
          ph.style.aspectRatio = '1 / 1';
          const probe = new Image();
          // PROBE_W, the smallest rung: a resize preserves the ratio, so the
          // shape reads the same off 320px as off the original, for a fraction
          // of the bytes. This image is never displayed.
          probe.onload = () => {
            im.ratio = [probe.naturalWidth, probe.naturalHeight];
            ph.style.aspectRatio = im.ratio[0] + ' / ' + im.ratio[1];
          };
          probe.src = thumbURL(im, PROBE_W);
        }
        if (en.expand === false) {
          // not a control — it opens nothing. No button role, no tab stop,
          // no pointer: the picture is the presentation, not a door.
          ph.classList.add('static');
          ph.setAttribute('role', 'img');
          ph.setAttribute('aria-label', im.alt || ('Image ' + (k + 1)));
        } else {
          ph.setAttribute('role', 'button');
          ph.setAttribute('tabindex', '0');
          ph.setAttribute('aria-label', im.alt || ('Image ' + (k + 1) + ' of ' + en.images.length));
          ph.addEventListener('click', () => thumbTap(i, k));
          // TIER 3: the full-size picture starts on the way DOWN. The tap
          // commits on the way up, and that gap is the head start. A swipe
          // that begins here spends one picture it may not open — on purpose.
          ph.addEventListener('pointerdown', () => warm(sized(im.src, EXPAND_W)));
          ph.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); thumbTap(i, k); }
          });
        }
        car.appendChild(ph);
        return ph;
      });
    }
    return { el: d, car, thumbs, images: en.images || null, hd: en.hd,
             body: d.querySelector('.body'),
             layout: en.layout || DEFAULT_LAYOUT,
             expand: en.expand !== false,
             wordmark: en.wordmark || null, spans: spanify(d) };
  });

  // THE SIBLING ROW, inserted AFTER the map above — which is what keeps it out
  // of the churn: spanify() has already walked each entry by the time this
  // runs, so the row is never in its span list. Controls stay resolved; this
  // is a control. (The caret and the two exit marks get the same guarantee by
  // living outside the entry entirely; this one has to sit inside the text
  // column to land on the margin, so it earns it by arriving late instead.)
  winEntries.forEach((we, i) => {
    const en = LIST[i];
    if (!en || !en.sibs || en.sibs.length < 2) return;
    const row = document.createElement('div');
    row.className = 'sibs';
    en.sibs.forEach(sib => {
      const t = FLAT_OF.get(sib);
      const el = document.createElement('span');
      el.className = 'sib' + (t === i ? ' on' : '');
      el.textContent = sib.hd;
      if (t === i) {
        el.setAttribute('aria-current', 'true');
      } else {
        // only the OTHER works are controls. The one you are looking at is a
        // label — a button that lands you where you already are is furniture.
        el.setAttribute('role', 'button');
        el.tabIndex = 0;
        el.addEventListener('click', () => showSib(t));
        el.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showSib(t); }
        });
      }
      row.appendChild(el);
    });
    // after the heading and its two breaks: [span.hd, br, br, ...]
    we.el.insertBefore(row, we.el.childNodes[3] || null);
  });

  // Picking a work from the sibling row. The GRID DOES NOT MOVE — same icon,
  // same band, same scroll position — so this is not a selection: it swaps the
  // window on the churn and writes the new work's address, and that is all.
  // The URL write is immediate, as it is for every other transition; only the
  // churn is deferred.
  function showSib(t) {
    if (t === winActive) return;
    subActive = t;
    contactSwap(t);
