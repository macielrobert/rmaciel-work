  // WHEEL — EITHER AXIS. A plain vertical wheel scrolls the row, because over
  // this canvas it has nothing else to do: html and body are overflow:hidden,
  // the page is one viewport, and a vertical wheel here did literally nothing
  // before. Claiming it is what gives a mouse-only visitor control of the row
  // without a single added control: no shift to discover, no arrows to click,
  // the same wheel they were already turning. The dominant axis wins, so a
  // trackpad's horizontal swipe and shift+wheel both work unchanged — the
  // browser puts shift+wheel on deltaX or deltaY depending on the platform,
  // and this reads whichever moved.
  //
  // passive:false because the gesture is ours: left unprevented, a two-finger
  // swipe is browser history navigation on macOS.
  canvas.addEventListener('wheel', (ev) => {
    if (!rowScrolls) return;
    const raw = Math.abs(ev.deltaX) >= Math.abs(ev.deltaY) ? ev.deltaX : ev.deltaY;
    if (!raw) return;
    ev.preventDefault();
    const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? canvasCssW : 1;   // lines / pages -> px
    rowTarget = null; scrollV = 0;

    // past an end the wheel goes soft and the edge spring takes it back, the
    // same as the finger. Clamping here instead is what made a trackpad — whose
    // momentum keeps sending deltas after your fingers lift — stop dead against
    // an invisible wall while still moving at speed.
    let t = scrollX + raw * unit;
    if (t < 0 || t > scrollMax) t = scrollX + raw * unit * ROW_RUBBER;
    scrollX = Math.max(-ROW_OVER_MAX, Math.min(scrollMax + ROW_OVER_MAX, t));
    applyScroll();
  }, { passive: false });

  // NOTE: the contact half / window margins are deliberately NOT an exit —
  // stray taps around the window (especially near the ← back mark) were
  // ejecting the whole state. Exits are the ×, the frozen icon, grid gaps,
  // and Escape.

  // ------------------------------------------------------------ system theme
  // The theme follows the DEVICE display setting (prefers-color-scheme) —
  // initial state and live changes. One switch, four surfaces: the CSS vars
  // (--bg/--ink drive every DOM color), the GL clear + uInk, and the
  // html/body backgrounds (overscroll regions). The bakes are never
  // touched — the shader recolors the same white-alpha textures.
  function setTheme(t) {
    const light = t === 'light';
    rootEl.classList.toggle('light', light);
    BG  = light ? [1, 1, 1] : [0, 0, 0];
    INK = light ? [0, 0, 0] : [1, 1, 1];
    document.documentElement.style.background = light ? '#fff' : '#000';
    document.body.style.background            = light ? '#fff' : '#000';
    // (theme-color metas are media-scoped in the head — the browser picks
    // the matching one itself; no JS update needed)
  }
  const mqLight = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
  setTheme(mqLight && mqLight.matches ? 'light' : 'dark');
  if (mqLight && mqLight.addEventListener) mqLight.addEventListener('change',
    (e) => setTheme(e.matches ? 'light' : 'dark'));

  // ------------------------------------------------------- footer site nav
  // Kept as spans, not anchors: no href, nothing for a webview to intercept.
  const navEls = Array.from(document.querySelectorAll('#nl-fns [data-nav]'));
  // the vertical copyright in the right margin — set once, never touched again
  const copyEl = document.querySelector('#nl-copy span');
  if (copyEl) copyEl.textContent = CONTENT.copyright || '';
  // exactly ONE label is ink at a time — the fixture if one is open, else the
  // active section. The footer carries the coherence when the grid cannot.
  function updateNav() {
    for (const el of navEls) {
      const n = el.getAttribute('data-nav');
      // gSwapTo first: during a section swap that is the section the footer
      // means, and activeSection does not catch up until commitSection().
      const sn  = gSwapTo !== null ? gSwapTo : activeSection;
      const on = fixture !== null
        ? (fixture === n)
        : (DATA.sections[sn] && DATA.sections[sn].id === n);
      el.classList.toggle('on', !!on);
      el.setAttribute('aria-current', on ? 'true' : 'false');
    }
  }
  navEls.forEach(el => {
    const n = el.getAttribute('data-nav');
    const fn = () => {
      if (n === 'about' || n === 'contact') { openFixture(n); return; }
      const si = DATA.sections.findIndex(sec => sec.id === n);
      if (si >= 0) switchSection(si);
    };
    el.addEventListener('click', fn);
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(); }
    });
  });

  // the field's control: same click + Enter/Space contract as every other
  // footer item, so the keyboard path is not a second-class one
  if (fieldBtn) {
    fieldBtn.addEventListener('click', toggleField);
    fieldBtn.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleField(); }
    });
  }

  // ------------------------------------------- window text (coherence swap)
  // The window text is treated as one more icon. One progress value (cMix)
  // eases on the icons' clock going up (dt/ON_TIME) and its own slower clock
  // going down (dt/CONTACT_OFF_TIME = 2x the grid), shaped by smoothstep.
  // While it moves, unresolved
  // characters churn through a glyph pool at their own random thresholds
  // (the per-icon seed analog). There is NO crossfade: each text dissolves
  // fully into churn, a hard visibility swap happens at the midpoint, and the
  // other text re-forms out of churn on the far side.
  // prefers-reduced-motion collapses this to an instant swap of resolved text.
  const aboutEl   = document.getElementById('nl-about');
  const aboutTxt  = document.getElementById('nl-about-text');
  const winEl     = document.getElementById('nl-window');
  const winTxt    = document.getElementById('nl-window-text');

  let cMix = 0, cTarget = 0;     // same semantics as an icon's mix/target
  let cDirty = true;             // force one apply on load
  let cSwapTo = null;            // pending entry for an open->open switch

  function contactSet(open) { cTarget = open ? 1 : 0; cSwapTo = null; if (!open) hardResetExpand(); }

  // open -> open switch: e = 0.5 is exactly "window visible, text 100%
  // churned" (the hard-swap midpoint), so a switch dissolves DOWN to 0.5 on
  // the FAST clock, exchanges the entry there, and resolves back to 1 — the
  // about never appears, and switching stays snappy while exit keeps its
  // slow decay.
  function contactSwap(i) { cTarget = 1; cSwapTo = i; }

  const mqReduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let reduceMotion = mqReduce ? mqReduce.matches : false;
  if (mqReduce && mqReduce.addEventListener) mqReduce.addEventListener('change', (e) => {
    reduceMotion = e.matches; restoreChars(); cDirty = true;
    // the preference can flip DURING a rearrangement. Snap the icons home
    // rather than letting them finish, and lift the input lock with them —
    // otherwise the grid stays inert waiting on an ease that no longer runs.
    if (reduceMotion) cancelGridMotion();
  });

  // wrap every non-space character in a span with a random resolve threshold
  // (the per-icon seed analog). BRs and spaces pass through untouched so line
  // structure and word shapes survive the churn.
  function spanify(el) {
    const spans = [];
    (function walk(node) {
      for (const k of Array.from(node.childNodes)) {
        if (k.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const ch of k.textContent) {
            if (ch === ' ' || ch === '\u00a0' || ch === '\n') { frag.appendChild(document.createTextNode(ch)); continue; }
            const s = document.createElement('span');
            s.textContent = ch;
            spans.push({ el: s, ch, t: 0.05 + Math.random() * 0.9 });
            frag.appendChild(s);
          }
          node.replaceChild(frag, k);
        } else if (k.nodeType === 1 && k.tagName !== 'BR' &&
                   k.tagName !== 'INPUT' && k.tagName !== 'TEXTAREA') {
          walk(k);
        }
      }
    })(el);
    return spans;
  }
  const aboutSpans = spanify(aboutTxt);

  // the close mark is a GLOBAL exit, not content: it never churns — it rides
  // the window's visibility but stays resolved and fixed. Tap / Enter /
  // Space exit; Escape exits from anywhere on keyboard devices
  const closeEl = document.getElementById('nl-close');
  closeEl.addEventListener('click', () => setSelected(null));
  closeEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setSelected(null); }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape') return;
    if (field) { exitField(); return; }                 // the field is its own level
    if (xTarget === 1) { collapseExpand(); syncRoute(false); }   // pop the image first...
    else if (fixture === 'contact') { /* contact lock: the x is the only exit */ }
    else if (selected !== null || fixture !== null)
      setSelected(null);                               // ...then the window
    // (contact lock: Escape is ignored on the form — the x is the only exit)
  });

  // Build all window entries from LIST (entries + about) — each gets its
  // TEXT div and, IF it has images, its OWN carousel strip in the #nl-car
  // host, driven entirely by the entry's images array. An entry WITHOUT
  // images (ABOUT; any imageless project) gets no strip — full-height text,
  // same path as the form. Churn state is per-entry, and switching selection
  // is a display swap, not a rebuild. Thumbs render their image as a cover
  // background (grey base shows while loading) and are tappable (expand /
  // jump / collapse); the expand view reads the SAME records.
  const carHost = document.getElementById('nl-car');
  const winEntries = LIST.map((en, i) => {
    const d = document.createElement('div');
    if (i !== 0) d.style.display = 'none';
    d.innerHTML = `<span class="hd">${en.hd}</span><br><br>`
      + `${en.lines.join('<br>')}<br><br>`
      + `<div class="body">${paras(en.blurb).join('<br><br>')}</div>`;
    winTxt.appendChild(d);
    let car = null, thumbs = null;
    if (en.images && en.images.length) {
      car = document.createElement('div');
      car.className = 'car';
      if (i !== 0) car.style.display = 'none';
      carHost.appendChild(car);
      thumbs = en.images.map((im, k) => {
        const ph = document.createElement('div');
        ph.className = 'ph';
        const tsrc = thumbURL(im);                // resized by the host when configured
        if (en.layout === 'grid') {
          // a grid is uniform by definition: every cell 16:9, images cropped
          // to fill. The per-image ratio is deliberately ignored here.
          ph.style.aspectRatio = '16 / 9';
        } else if (im.ratio) {
          ph.style.aspectRatio = im.ratio[0] + ' / ' + im.ratio[1];
        } else {
          // FALLBACK ONLY — a record with no ratio. Hold a square, measure on
          // decode, settle once. This costs a network fetch PER IMAGE at load,
          // for every entry, visible or not: it is why ratio should always be
          // stored. Probing the THUMB keeps the damage to a small file rather
          // than pulling every full-size image on the site.
          ph.style.aspectRatio = '1 / 1';
          const probe = new Image();
          probe.onload = () => {
            im.ratio = [probe.naturalWidth, probe.naturalHeight];
            ph.style.aspectRatio = im.ratio[0] + ' / ' + im.ratio[1];
          };
          probe.src = tsrc;
        }
        ph.style.backgroundImage = 'url("' + tsrc + '")';
        if (en.expand === false) {
          // not a control — it opens nothing. No button role, no tab stop,
          // no pointer: the picture is the presentation, not a door.
          ph.classList.add('static');
          ph.setAttribute('role', 'img');
          ph.setAttribute('aria-label', im.alt || ('Image ' + (k + 1)));
        } else {
          ph.setAttribute('role', 'button');
          ph.setAttribute('tabindex', '0');
          ph.setAttribute('aria-label', im.alt || ('Image ' + (k + 1) + ' of ' + en.images.length));
          ph.addEventListener('click', () => thumbTap(i, k));
          ph.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); thumbTap(i, k); }
          });
        }
        car.appendChild(ph);
        return ph;
      });
    }
    return { el: d, car, thumbs, images: en.images || null, hd: en.hd,
             body: d.querySelector('.body'),
             layout: en.layout || DEFAULT_LAYOUT,
             expand: en.expand !== false,
             wordmark: en.wordmark || null, spans: spanify(d) };
  });

  // ONE shared wordmark element whose mask swaps with the entry (the same
  // pattern as the expanded image — only one entry is ever visible, and there
  // is no per-entry state to preserve). Non-churn: it hard-cuts with its view.
  // CSS decides WHETHER it shows (landscape, not expanded, not carless); this
  // only decides WHICH mark and whether one exists at all.
  // LAYOUT: the window wears `l-<name>`; CSS does the rest. Swapped at the
  // churn midpoint with the entry, so the rearrangement happens inside the
  // invisible cut — never as a visible reflow.
  function applyLayout(en) {
    for (const n of LAYOUTS) winEl.classList.remove('l-' + n);
    winEl.classList.add('l-' + ((en && en.layout) || DEFAULT_LAYOUT));
  }

  // READ MORE: the caret appears only when a body actually overflows its
  // clamp, so short copy shows no control at all. Opening swaps the caret to
  // its mirror — tap the coherent thing to dissolve it, the same gesture as
  // the frozen icon and the active thumb.
  const moreEl = document.getElementById('nl-more');

  // The mark itself is CSS (see #nl-more::before) — the `more` class on the
  // window turns it over. No character swap: the two states were two separate
  // codepoints, neither in the typeface, and they arrived from whatever
  // fallback fonts the visitor happened to have. Only the accessible state
  // is set here; a screen reader never saw the glyph anyway.
  function setMore(on) {
    winEl.classList.toggle('more', on);
    moreEl.setAttribute('aria-expanded', on ? 'true' : 'false');
    moreEl.setAttribute('aria-label', on ? 'Show less' : 'Read more');
  }
  // measure the ACTIVE entry: is there more copy than the clamp shows?
  // Re-run on entry switch and on resize — a width change re-wraps the text
  // and can flip the answer either way. (The measure cap means this now
  // stops flipping once the window passes 66ch — the column stops widening,
  // so the wrap stops changing.)
  function updateMore() {
    const en = winEntries[winActive];
    if (!en || en.layout !== 'grid' || !en.body) { moreEl.classList.remove('on'); return; }
    if (winEl.classList.contains('more')) { moreEl.classList.add('on'); return; }
    moreEl.classList.toggle('on', en.body.scrollHeight > en.body.clientHeight + 1);
  }
  moreEl.addEventListener('click', () => { setMore(!winEl.classList.contains('more')); updateMore(); });
  moreEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault(); setMore(!winEl.classList.contains('more')); updateMore();
    }
  });

  const markEl = document.getElementById('nl-mark');
  // The slot holds a WORDMARK if one exists, otherwise the project's FIRST
  // image as a hero, otherwise nothing. Both are sized through the host
  // transform at what they can actually draw — a mark never exceeds 320 CSS
  // px, a hero never exceeds 720.
  function applyMark(en) {
    const wm   = en && en.wordmark;
    const hero = (!wm && en && en.images && en.images.length) ? en.images[0] : null;
    markEl.classList.toggle('hero', !!hero);
    if (wm) {
      const url = 'url("' + sized(wm.src, MARK_W) + '")';
      markEl.style.webkitMaskImage = url;
      markEl.style.maskImage       = url;
      markEl.style.backgroundImage = '';
    } else if (hero) {
      markEl.style.webkitMaskImage = '';
      markEl.style.maskImage       = '';
      markEl.style.backgroundImage = 'url("' + sized(hero.src, HERO_W) + '")';
    } else {
      markEl.style.webkitMaskImage = '';
      markEl.style.maskImage       = '';
      markEl.style.backgroundImage = '';
    }
    const src = wm || hero;
    markEl.style.visibility = src ? '' : 'hidden';
    markEl.setAttribute('aria-label', src ? (src.alt || '') : '');
  }

  let winActive = 0;
  function setWinContent(i) {
    if (i === winActive || !winEntries[i]) return;
    hardResetExpand();                          // switching icons drops any expansion
    const prev = winEntries[winActive], next = winEntries[i];
    prev.el.style.display = 'none';
    if (prev.car) prev.car.style.display = 'none';
    next.el.style.display = '';
    if (next.car) { next.car.style.display = ''; carHost.style.display = ''; }
    else carHost.style.display = 'none';        // no strip -> full-height text
    applyLayout(next);                          // l-<name> restructures the window
    applyMark(next);                            // wordmark hard-cuts with the entry
    setMore(false);                             // every entry opens clamped
    winTxt.scrollTop = 0;                       // each entry opens at its top
    winActive = i;
    updateMore();                               // does THIS body overflow?
    // a deep link asked for an image on an entry that was not on screen yet —
    // it is now
    if (pendingExpand !== null) {
      const k = pendingExpand; pendingExpand = null;
      if (next.images && next.images.length && next.expand !== false) {
        expandTo(Math.min(k, next.images.length - 1));
      }
    }
  }
  applyLayout(winEntries[0]);                   // entry 0 is built visible; seed
  applyMark(winEntries[0]);                     // its layout class and wordmark
  setMore(false); updateMore();

  // ---------------------------------------------- expanded image (per entry)
  // The carousel is a miniature of the site: tap a thumb -> its image takes
  // over the text region (text churns out on the fast clock, hard cut to the
  // image at the midpoint — images are non-churn material, like the ×). The
  // strip stays and becomes the filmstrip. Grammar:
  //   swipe on the image        -> prev / next (wraps)
  //   caption                   -> STATIC: shown iff the image has content
  //   tap the ACTIVE thumb / <- -> collapse (back to the project overview)
  //   tap another thumb         -> jump
  //   Escape                    -> pops one level (image, then window)
  // Everything this view shows comes from the entry's image RECORD:
  // src, alt, caption — the same record the thumb was built from.
  const expHd    = document.getElementById('nl-exp-hd');
  const expStage = document.getElementById('nl-exp-stage');
  const expImg   = document.getElementById('nl-exp-img');
  const expCap   = document.getElementById('nl-exp-cap');
  let xMix = 0, xTarget = 0, xDirty = true;
  let expIdx = 0;

  function setExpandIndex(k) {
    const en = winEntries[winActive], im = en.images[k];
    expIdx = k;
    expImg.src = im.src;
    expImg.alt = im.alt || '';
    expCap.textContent = im.caption || '';
    // STATIC caption: visible iff this image has content — no interaction
    expCap.style.visibility = im.caption ? 'visible' : 'hidden';
    en.thumbs.forEach((t, j) => t.classList.toggle('on', j === k));
    en.thumbs[k].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    // SIBLING move, not a deeper one: replaces the entry rather than adding
    // to it, so ten swipes never bury the way out ten presses deep
    if (xTarget === 1) syncRoute(true);
  }
  function expandTo(k) {
    expHd.textContent = winEntries[winActive].hd;
    setExpandIndex(k);
    winEntries[winActive].car.classList.add('expanded');
    setMore(false);            // opening an image leaves the text view, so the
                               // read-more state goes with it (and its rule
                               // stops competing with the filmstrip)
    xTarget = 1;
    syncRoute(false);          // going DEEPER: pushes, so back closes the image
  }
  function collapseExpand() {
    const en = winEntries[winActive];
    if (en.car) en.car.classList.remove('expanded');
    en.thumbs && en.thumbs.forEach(t => t.classList.remove('on'));
    xTarget = 0;
  }
  function hardResetExpand() {                  // instant — used when content changes
    collapseExpand();
    xMix = 0;
    winEl.classList.remove('x');
    xDirty = true;
  }
  function thumbTap(i, k) {
    if (i !== winActive) return;                // strip is only visible for the active entry
    if (winEntries[i].expand === false) return; // this entry's images don't open
    if (xTarget === 1) {
      if (k === expIdx) { collapseExpand(); syncRoute(false); }   // tap the coherent thing -> dissolve
      else setExpandIndex(k);                   // jump (hard cut)
    } else expandTo(k);
  }
  function applyExpand(xe, moving) {
    const on = xe >= 0.5;                       // midpoint hard cut, both directions
    winEl.classList.toggle('x', on);            // display swap: text view <-> expand view
    if (reduceMotion || on) return;
    churn(winEntries[winActive].spans, Math.max(0, 1 - xe * 2), moving);
  }

  // swipe / tap on the expanded stage
  const backEl = document.getElementById('nl-back');
  backEl.addEventListener('click', () => { collapseExpand(); syncRoute(false); });
  backEl.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); collapseExpand(); syncRoute(false); }
  });
  let swX = 0, swY = 0;
  expStage.addEventListener('pointerdown', (ev) => { swX = ev.clientX; swY = ev.clientY; });
  expStage.addEventListener('pointerup', (ev) => {
    const dx = ev.clientX - swX, dy = ev.clientY - swY;
    const en = winEntries[winActive];
    if (!en.thumbs) return;
    if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy)) {
      const n = en.thumbs.length;
      setExpandIndex((expIdx + (dx < 0 ? 1 : -1) + n) % n);   // swipe advances (wraps)
    }
    // no tap action on the stage — the caption is static
  });

  // ---- CONTACT FORM: the last entry in the flat list, hand-built OUTSIDE the
  // data contract (it holds real inputs, not content). Reached from the footer,
  // not the grid. The header, labels, and
  // SEND churn like all other text; the fields themselves are real inputs
  // (spanify skips INPUT/TEXTAREA) and simply appear with the window. SEND
  // composes a mailto — no backend; swap for a form endpoint (Formspree /
  // Netlify native) at deploy.
  {
    const d = document.createElement('div');
    d.className = 'form-entry';
    d.style.display = 'none';
    d.innerHTML =
      `<span class="hd">CONTACT</span><br><br>` +
      `<label>NAME<input id="nl-f-name" type="text" autocomplete="name"></label>` +
      `<label>EMAIL<input id="nl-f-email" type="email" autocomplete="email"></label>` +
      `<label>MESSAGE<textarea id="nl-f-msg" rows="3"></textarea></label>` +
      `<span class="send" role="button" tabindex="0">SEND</span>`;
    winTxt.appendChild(d);
    winEntries.push({ el: d, car: null, hd: 'CONTACT', layout: 'form', body: null, spans: spanify(d) });

    const gv = id => (document.getElementById(id).value || '').trim();
    const go = () => {
      const n = gv('nl-f-name'), em = gv('nl-f-email'), ms = gv('nl-f-msg');
      const su = encodeURIComponent('Portfolio contact' + (n ? ' — ' + n : ''));
      const bo = encodeURIComponent(ms + ((n || em) ? '\n\n' + [n, em].filter(Boolean).join('\n') : ''));
      window.location.href = 'mailto:' + CONTENT.contact.email + '?subject=' + su + '&body=' + bo;
    };
    const send = d.querySelector('.send');
    send.addEventListener('click', go);
    send.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); }
    });
  }

  /* ==================================================================== ROUTING
     The site had state but no ADDRESS: you could not send anyone to a project,
     and on mobile the back gesture left the site instead of closing what was
     open. Both are the same missing piece.

       #                            rest
       #build                       a section
       #build/vessel-series         a project
       #build/vessel-series/2       an expanded image (1-based, as written)
       #about   #contact            the fixtures

     THE RULE: the URL MIRRORS state, it is never a second way of setting it.
     applyRoute() drives the SAME setSelected / commit / commitSection /
     expandTo the pointer and keyboard drive, so every transition still churns
     exactly as it always did and there is one code path per state change, not
     two. `routing` suppresses the write-back while a route is being applied,
     and `lastHash` recognises our own writes coming back as hashchange.

     PUSH vs REPLACE — back pops a LEVEL, not a sibling. Opening a project or
     an image pushes; swiping between images inside the expanded view replaces.
     Otherwise a ten-image swipe would bury the exit ten presses deep.

     ACCEPTED: back closes the contact form and loses a draft. The contact lock
     was built against STRAY taps; back is deliberate, and a hash change cannot
     be blocked. Normal web behaviour, but it does mean the lock is no longer
     absolute.

     ACCEPTED: applying a route switches sections with a HARD CUT rather than
     the churn-over. History navigation can land on a project inside the new
     section, and the churn commits at a transition midpoint one frame later —
     the project would have nothing to select into. Footer taps still churn.

     WRITING THE URL IS OPTIONAL. In a sandboxed or cross-origin iframe —
     an artifact preview, a CMS preview pane, anyone embedding the piece —
     history.replaceState throws and a hash write may be blocked outright.
     syncRoute() runs from inside commit(), so an unguarded throw there would
     take SELECTION down with it: the whole site broken by a feature that is
     only ever a convenience. So the URL is written only when the page
     actually owns it, and every write is wrapped regardless. Reading an
     incoming hash stays enabled everywhere, since reading cannot fail. */
  let routing = false;
  let lastHash = null;
  let pendingExpand = null;      // image to open once its entry is actually live

  // do we own the address bar? framed => no. Probed, not assumed: the throw
  // only shows up on the first real write, which is too late to find out.
  let ROUTING_OK = true;
  try { if (window.top !== window.self) ROUTING_OK = false; }
  catch (e) { ROUTING_OK = false; }                  // cross-origin parent
  if (ROUTING_OK) {
    try { history.replaceState(null, '', location.hash || location.pathname); }
    catch (e) { ROUTING_OK = false; }                // sandboxed / opaque origin
  }

  function parseHash() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    if (!raw) return null;
    return raw.split('/').filter(Boolean).map(s => {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    });
  }

  // current state -> the hash that describes it
  function routeString() {
    if (fixture) return fixture;
    const sec = DATA.sections[activeSection];
    if (!sec) return '';
    if (selected === null) return sec.id;
    const en = sec.entries[selected];
    if (!en) return sec.id;
    let s = sec.id + '/' + en.slug;
    if (xTarget === 1) s += '/' + (expIdx + 1);
    return s;
  }

  function writeHash(h, replace) {
    if (!ROUTING_OK) return;                   // not our URL to write
    const full = h ? '#' + h : '#';
    if (location.hash === full) { lastHash = full; return; }
    lastHash = full;
    try {
      if (replace) history.replaceState(null, '', full);
      else location.hash = h;                  // creates the history entry
    } catch (e) {
      // a sandbox that permits the probe but blocks the write. Give up on the
      // URL for the rest of the session rather than throwing once per tap.
      ROUTING_OK = false;
      console.warn('[noiselab] URL updates blocked by the embedding context; routing disabled.');
    }
  }

  function updateDocTitle() {
    const base = CONTENT.siteTitle || 'Portfolio';
    let t = base;
    if (fixture === 'about')        t = 'About \u2014 ' + base;
    else if (fixture === 'contact') t = 'Contact \u2014 ' + base;
    else {
      const sec = DATA.sections[activeSection];
      const en  = (sec && selected !== null) ? sec.entries[selected] : null;
      if (en)       t = en.hd + ' \u2014 ' + base;
      else if (sec) t = sec.label + ' \u2014 ' + base;
    }
    document.title = t;
  }

  function syncRoute(replace) {
    if (routing) return;                       // we are BEING driven by the URL
    writeHash(routeString(), replace);
    updateDocTitle();
  }

  // hash -> state. `initial` marks the first application at load, where an
  // absent hash means "leave the default alone" rather than "go to rest".
  function applyRoute(parts, initial) {
    routing = true;
    try {
      if (!parts || !parts.length) {           // bare '#' or empty
        if (!initial && (selected !== null || fixture !== null)) {
          const p = winTarget(); selected = null; fixture = null; commit(p);
        }
        return;
      }
      const head = String(parts[0]).toLowerCase();

      if (head === 'about' || head === 'contact') {
        if (fixture !== head) {
          const p = winTarget(); selected = null; fixture = head; commit(p);
        }
        return;
      }

      const si = DATA.sections.findIndex(s => s.id === head);
      if (si < 0) return;                      // unknown section: leave state alone
      const sec = DATA.sections[si];

      const slug = parts[1] ? String(parts[1]).toLowerCase() : null;
      // an unknown slug resolves to the SECTION, not to an error — a link to a
      // renamed or deleted project still lands somewhere sensible
      const idx = slug ? sec.entries.findIndex(e => e.slug === slug) : -1;

      if (si !== activeSection) commitSection(si);   // hard cut; see note above

      const want = idx >= 0 ? idx : null;
      if (selected !== want || fixture !== null) {
        const p = winTarget(); selected = want; fixture = null; commit(p);
      }

      // ---- image level
      const flat = want !== null ? SECTION_OFFSET[si] + want : -1;
      const en   = flat >= 0 ? winEntries[flat] : null;
      const imgs = en && en.images;
      if (en && imgs && imgs.length && en.expand !== false && parts[2] !== undefined) {
        const n = parseInt(parts[2], 10);
        const k = Math.min(Math.max(isFinite(n) ? n : 1, 1), imgs.length) - 1;
        // the entry may not be on screen yet: an open->open switch swaps the
        // window at the churn MIDPOINT, a frame or more from now. Queue it and
        // let setWinContent fire it on arrival.
        if (winActive === flat) { if (xTarget === 1) setExpandIndex(k); else expandTo(k); }
        else pendingExpand = k;
      } else if (xTarget === 1) {
        collapseExpand();
      }
    } finally {
      routing = false;
      updateDocTitle();
    }
  }

  window.addEventListener('hashchange', () => {
    if (location.hash === lastHash) return;    // our own write coming back
    lastHash = location.hash;
    applyRoute(parseHash(), false);
  });

  // single-width ASCII pool only — CJK/block glyphs are double-width in some
  // monospace stacks and make the line lengths jitter
  const POOL = '#%*+=-:;/\\|<>~^';
  function churn(spans, res, moving) {   // res: 0..1 resolvedness for this element
    for (const s of spans) {
      if (res >= s.t) { if (s.el.textContent !== s.ch) s.el.textContent = s.ch; }
      else if (moving) { s.el.textContent = POOL[(Math.random() * POOL.length) | 0]; }
    }
  }
  function restoreChars() {
    for (const s of aboutSpans) s.el.textContent = s.ch;
    for (const en of winEntries) for (const s of en.spans) s.el.textContent = s.ch;
  }

  function applyContact(e, moving) {
    // NO crossfade. Both texts live at full opacity; a hard visibility swap
    // happens at the midpoint. Each side dissolves FULLY to churn before the
    // cut and materialises FROM full churn after it, so the swap is
    // noise-to-noise and the cut itself is invisible — coherence dissolves,
    // then re-forms as the other content.
    const aboutOn = e < 0.5;
    aboutEl.style.visibility = aboutOn ? 'visible' : 'hidden';
    winEl.style.visibility   = aboutOn ? 'hidden'  : 'visible';

    if (reduceMotion) { restoreChars(); return; }   // instant swap, resolved text

    churn(aboutSpans, Math.max(0, 1 - e * 2), moving);  // fully churned by e = 0.5
    churn(winEntries[winActive].spans, Math.max(0, e * 2 - 1), moving);  // resolves from churn after e = 0.5
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;

    // the menu row's glide runs BEFORE the draw, so the positions this frame
    // paints are the positions this frame's hit-test would return
    stepRowScroll(dt);

    // THE DRAWING is the only part of this loop that needs a shader. The
    // clocks below it — section swap, window churn, image expand — are DOM
    // effects and must keep running without one, or the fallback site would
    // have no transitions at all.
    if (gl) {
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.uniform1i(loc.uTex, 0);
    gl.uniform3f(loc.uInk, INK[0], INK[1], INK[2]);   // same ink for every icon

    for (const ic of icons) {
      // each icon eases its OWN mix toward its OWN target (same on/off feel)
      if (ic.mix < ic.target) ic.mix = Math.min(ic.target, ic.mix + dt / ON_TIME);
      else if (ic.mix > ic.target) ic.mix = Math.max(ic.target, ic.mix - dt / OFF_TIME);
      const e = smooth(ic.mix);

      // stillness eases on the SAME asymmetric clock (snap frozen, ease back
      // to breathing). s = 1 kills displacement AND stops the phase clock, so
      // the selected icon is genuinely static — not breathing at amp 0.
      if (ic.still < ic.stillTarget)      ic.still = Math.min(ic.stillTarget, ic.still + dt / ON_TIME);
      else if (ic.still > ic.stillTarget) ic.still = Math.max(ic.stillTarget, ic.still - dt / OFF_TIME);
      const s = smooth(ic.still);

      // `calm` is the needle, and 0 on every menu icon — a cell that churns
      // quieter and slower than its neighbours without ever holding still.
      // It has to be findable by looking and invisible to a glance, which is
      // why it scales the existing churn rather than adding a tell of its own.
      const cq = ic.calm || 0;
      const amp  = mixv(AMP_OFF,  AMP_ON,  e) * (1 - s) * (1 - cq * FIELD_CALM_AMP);
      const freq = mixv(FREQ_OFF, FREQ_ON, e);
      const spd  = mixv(SPEED_OFF, SPEED_ON, e) * (1 - s) * (1 - cq * FIELD_CALM_SPD);
      ic.phase += spd * dt;             // own clock: calm keeps breathing while others churn

      // POSITION eases on the SAME asymmetric clock as mix and still, with one
      // addition: a per-icon delay, which is the entirety of "stagger" here.
      if (ic.moveDelay > 0) ic.moveDelay = Math.max(0, ic.moveDelay - dt);
      else if (ic.move < ic.moveTarget) ic.move = Math.min(ic.moveTarget, ic.move + dt / ON_TIME);
      else if (ic.move > ic.moveTarget) ic.move = Math.max(ic.moveTarget, ic.move - dt / OFF_TIME);

      // ...and is applied as an OFFSET from the resting cell, never written
      // back into cx/cy. Rest stays the single source of geometry, so a
      // relayout() mid-flight (a phone rotation is the real case) moves the
      // rest UNDER the animation instead of fighting it — the icon keeps
      // converging, on the new grid. Amplitude is in cell widths, so it
      // rescales with the cell rather than going stale.
      //
      // Skipped entirely at rest, which is the overwhelmingly common case —
      // and that guard is load-bearing, not an optimisation: before the first
      // resize() canvasCssW is 0, and 0 * 0 / 0 is NaN, which as a uniform
      // silently draws nothing at all.
      let ox = 0, oy = 0;
      if (ic.move > 0 && canvasCssW && canvasCssH) {
        const mv = smooth(ic.move) * MOVE_AMP * cellPxCss;
        ox =  mv * ic.mvx * 2 / canvasCssW;
        oy = -mv * ic.mvy * 2 / canvasCssH;    // clip space y points the other way
      }

      // SCALE TRACKS THE WARP, NOT THE MIX. The shrink exists to open a
      // transparent ring for the warp to spill into, so it has to rise and
      // fall with the warp that fills it — and the warp is e AND still, on
      // two clocks: `e * (1 - s)`, the same product uAmp is given below.
      //
      // Reading `e` alone was fine in the two symmetric cases and wrong in
      // the two mixed ones. Selecting a CHURNING icon (switching projects
      // directly) freezes it in ON_TIME 0.12s but eases its mix down over
      // OFF_TIME 0.80s — so the warp vanished in a twelfth of a second and
      // you then watched an already-still icon swell from 0.64 to full for
      // another two thirds of a second. Deselecting one is the same fault
      // mirrored: mix snaps up in 0.12s and the icon shrank away from a
      // warp that `still` was holding off for 0.80s.
      //
      // With the product, the quad grows exactly as fast as the warp leaves
      // it — which is what makes both reads the way rest -> active already
      // read: no size change at all, only coherence.
      const iconScale = mixv(SCALE_OFF, SCALE_ON, e * (1 - s));
      const qw = footW * iconScale, qh = footH * iconScale;

      gl.uniform1f(loc.uAmp, amp);
      gl.uniform1f(loc.uFreq, freq);
      gl.uniform1f(loc.uPhase, ic.phase);
      gl.uniform2f(loc.uScale, qw, qh);
      gl.uniform2f(loc.uTranslate, ic.cx + ox - qw * 0.5, ic.cy + oy - qh * 0.5);
      gl.uniform2f(loc.uSeed, ic.sx, ic.sy);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, ic.tex);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    // The input lock lifts when the LAST icon has settled — not when the
    // texture swap happened. Between those two moments the icons are still
    // travelling, and that is precisely the window a tap must not be read in.
    if (moveActive) {
      let settled = true;
      for (const ic of icons) {
        if (ic.move !== 0 || ic.moveTarget !== 0 || ic.moveDelay > 0) { settled = false; break; }
      }
      if (settled) moveActive = false;
    }
    }   // end if (gl) — drawing only

    // SECTION SWAP: runs on the fast clock alongside the icons' own churn-out,
    // so they arrive together. At the top the icon set is exchanged — noise to
    // noise, the same invisible cut the window text uses — and the new set
    // eases back down to calm.
    if (gSwapTo !== null) {
      gMix += dt / ON_TIME;
      if (gMix >= 1) { commitSection(gSwapTo); gSwapTo = null; gMix = 0; }
    }

    // A cell on its way back into the churn swaps its texture the moment the
    // noise is dense enough to hide the change — the same midpoint cut used
    // everywhere else, just measured on the cell's own mix rather than on a
    // shared clock.
    if (field) {
      for (const ic of fieldCells) {
        if (ic.unswap && ic.mix >= 0.9) { ic.tex = ic.baseTex; ic.unswap = false; }
      }
      // the reveal ends by returning EVERYTHING to the churn except the found
      // cell — a clean field again, holding one permanent mark
      if (fieldRevealT > 0) {
        fieldRevealT -= dt;
        if (fieldRevealT <= 0) {
          fieldRevealT = 0;
          for (const ic of fieldCells) if (!ic.permanent && ic.resolved) dissolve(ic);
          fieldOrder = [];
        }
      }
    }

    // FIELD ENTRY: the menu icons are churned out on the same fast clock, and
    // the cell set is exchanged at the top of it — noise to noise, so the cut
    // is invisible and the count can change from 14 to ~300 across it without
    // anything being seen to appear.
    if (fieldSwap !== null) {
      fieldSwap -= dt;
      if (fieldSwap <= 0) {
        fieldSwap = null;
        fieldFound = false; fieldRevealT = 0;   // a fresh entry, a new needle
        buildField(null);
        icons = fieldCells;
        fieldResize(true);        // the seam travels from here
      }
    }

    // contact progress rides the same loop; DOM writes only while moving
    // (or once after load). A pending swap descends FIRST (fast clock) to the
    // churn midpoint, exchanges the entry, then the normal rise resumes.
    let cMoving = false;
    if (cSwapTo !== null) {
      cMix = Math.max(0.5, cMix - dt / ON_TIME); cMoving = true;
      if (cMix <= 0.5) { setWinContent(cSwapTo); cSwapTo = null; }
    }
    else if (cMix < cTarget) { cMix = Math.min(cTarget, cMix + dt / ON_TIME);  cMoving = true; }
    else if (cMix > cTarget) { cMix = Math.max(cTarget, cMix - dt / CONTACT_OFF_TIME); cMoving = true; }
    if (cMoving || cDirty) { applyContact(smooth(cMix), cMoving); cDirty = false; }

    // expanded-image progress: fast clock BOTH ways (expand and collapse are
    // in-window moves, not exits)
    let xMoving = false;
    if (xMix < xTarget)      { xMix = Math.min(xTarget, xMix + dt / ON_TIME); xMoving = true; }
    else if (xMix > xTarget) { xMix = Math.max(xTarget, xMix - dt / ON_TIME); xMoving = true; }
    if (xMoving || xDirty) { applyExpand(smooth(xMix), xMoving); xDirty = false; }

    requestAnimationFrame(frame);
  }

  // --------------------------------------------------------------- run it
  (async function () {
    // EVERY section bakes up front (33 icons here, vs 15 before): the churn
    // swap exchanges textures at the transition midpoint and cannot wait on an
    // async bake. Still one deferred burst behind the double-rAF, so first
    // paint is unaffected.
    const flatIcons = SECTION_ICONS.reduce((a, b) => a.concat(b), []);

    // An icon is GEOMETRY plus ANIMATION STATE; the texture is one field of
    // it. Everything downstream — resize, relayout, placeKeys, the hit test,
    // the menu row — reads only the other fields, so without a shader the icons
    // still exist, they simply have nothing to draw. That is what keeps the
    // rest of boot() identical in both modes rather than forked.
    const iconState = (tex) => ({
      tex,
      sx: Math.random() * 127,
      sy: Math.random() * 127,
      mix: 0, target: 0,              // per-icon morph state
      still: 0, stillTarget: 0,       // 1 = frozen (the selected icon)
      phase: Math.random() * 100,     // desync the resting breathing
      cx: 0, cy: 0, pxCx: 0, pxCy: 0,
      // reorganisation state, on the same target/current/clock pattern as mix
      // and still. move is 1 at full displacement; mvx/mvy are its direction;
      // moveDelay is this icon's share of the stagger. These are an OFFSET
      // applied at draw time — they never write into cx/cy or pxCx/pxCy, so
      // relayout() stays the single source of where an icon IS.
      move: 0, moveTarget: 0, moveDelay: 0,
      mvx: 0, mvy: 0,
    });

    // the field's resolve targets. Placeholder geometry for now — real
    // drawings drop in here by replacing this list with {kind:'shape'} items
    // or ordinary {src} ones; nothing downstream cares which.
    const FIELD_FORMS = ['disc','ring','square','frame','triangle','hexagon',
                         'hexframe','diamond','cross','chevron','half','quarter','bars',
                         'target']   // LAST = the needle's own form, held back
                        .map(form => ({ kind: 'shape', form }));

    let made = null;
    if (gl) {
      try {
        const canvases = await Promise.all(flatIcons.map(bakeIcon));
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        const upload = (cv) => {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          return tex;
        };
        made = canvases.map((cv) => iconState(upload(cv)));
        // the field's forms ride the same bake and upload path as the icons —
        // one texture pipeline, not two. Cheap: they are drawn, not fetched.
        shapeTex = (await Promise.all(FIELD_FORMS.map(bakeIcon))).map(upload);
      } catch (e) {
        // a bake or upload failed after everything else succeeded — the last
        // place this can go wrong, and it degrades like all the others
        console.warn('[noiselab] icon bake/upload failed — falling back to the DOM menu:', e);
        gl = null;
        rootEl.classList.add('nogl');
        made = null;
      }
    }
    if (!made) made = flatIcons.map(() => iconState(null));

    // deal the flat bake back out into one array per section
    let cut = 0;
    allIcons = SECTION_ICONS.map(list => made.slice(cut, cut += list.length));
    icons = allIcons[activeSection];

    buildKeys();                      // the DOM twin of the starting icon set
    resize();
    updateNav();                      // light the starting section
    updateFieldBtn();                 // offer the field only where it works

    // INCOMING DEEP LINK, applied once everything it might target exists.
    // A bare load writes NOTHING: appearing to navigate on arrival, and
    // pushing '#build' into a clean address bar, is noise. The first real
    // interaction starts the history trail.
    lastHash = location.hash;
    if (location.hash) applyRoute(parseHash(), true);
    else updateDocTitle();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    // keyboard freeze bookends: layout holds while typing; on blur, undo any
    // keyboard pan iOS applied to the (non-scrolling) page and re-derive
    document.addEventListener('focusin', (ev) => {
      if (ev.target && ev.target.matches && ev.target.matches('input, textarea')) kbFrozen = true;
    });
    document.addEventListener('focusout', () => {
      if (!kbFrozen) return;
      setTimeout(() => {                       // defer one tick: a field->field
        const ae = document.activeElement;     // hop is NOT a keyboard dismissal
        if (ae && ae.matches && ae.matches('input, textarea')) return;
        kbFrozen = false;
        window.scrollTo(0, 0);
        resize();
      }, 0);
    });
    requestAnimationFrame(frame);
  })();
  } // end boot()

  // Two rAFs guarantee at least one presented (black) frame before boot's
  // synchronous work blocks the main thread.
  requestAnimationFrame(() => requestAnimationFrame(boot));
})();
</script>
</body>
</html>
