       - This site is ONE file with zero outside dependencies. A separate
         content file would have to be FETCHED when the page loads, and
         browsers BLOCK fetching a local file when you just open the HTML
         directly — you'd need a running web server just to preview a wording
         change. Inline keeps it "double-click to preview, drag-to-deploy,"
         and keeps the self-contained character of the piece.
       - The trade-off of inline: the words share a file with the code. THIS
         BLOCK is the answer to that — every editable word is gathered HERE,
         in one place, labelled. Nothing below this block needs touching to
         change copy.
       - This block is ALSO the exact shape a CMS emits later. When you add
         one, it writes to this structure and the code below does not change.
         That prediction held: Decap plugged in without changing a line below,
         and so did Keystatic when it replaced Decap. So choosing inline now costs nothing later — the only
         thing that ever moves is WHERE these bytes sit, never their shape.
         The one thing that reads this block (buildData, just under it) is the
         seam a CMS plugs into.

     THE FIELDS (same for a project and for ABOUT):
       title    — the header, shown in grey
       details  — the three short lines under it (material / edition / year…)
       summary  — the description. A single string, OR a LIST of strings for
                  multi-paragraph copy. In the 'grid' layout a long body is
                  clamped and opened by a caret; elsewhere it simply runs on.
       icon     — placeholder art for now; becomes a client mark later. You
                  won't edit these until real marks exist. 'placeholder' art
                  is generated; 'glyph' is a single typed character.
       images   — OPTIONAL. Leave it out for no image strip (ABOUT has none).
                  Omitting it auto-fills placeholders so layout can be judged.
                  Each image is one record:

                    src     ONE uploaded file, full size. You do NOT export or
                            store small versions — the host resizes on demand
                            (see IMAGE_TRANSFORM below the CONTENT block).
                    ratio   [width, height] of that file, e.g. [4,3] or
                            [1600,1200]. NOT optional in practice: without it
                            the page has to DOWNLOAD every image on the site
                            at load just to measure its shape, which throws
                            away the on-demand loading everything else relies
                            on. Any CMS knows the dimensions of what it
                            stored — have it write them here.
                    caption Optional. Shown under the expanded image; omit it
                            and no caption line appears.
                    alt     Screen-reader description of the image.
                    thumb   Optional override. Only needed if you ever want a
                            hand-picked crop in the strip instead of the
                            automatic resize of `src`.
       layout   — OPTIONAL. Which window arrangement this project uses, by
                  name: 'standard' (default), 'grid', or 'text'. A section can
                  set its own default via `layout` on the section; a project's
                  own value always wins. Unknown names fall back to standard.
                    standard  carousel strip at the foot, wordmark beside it
                    grid      fixed 16:9 cells, column count adapts to width;
                              text above, grid fills the rest and scrolls
                    text      copy only, full width
       expand   — OPTIONAL true/false. Whether tapping an image opens it full
                  size. Defaults to TRUE on 'standard' and FALSE on 'grid' —
                  in a grid the pictures are usually the presentation, not a
                  set of doors. Set it either way to override.
       wordmark — OPTIONAL. If OMITTED, the project's FIRST image is used as a
                  hero in the same slot instead (shown as a picture, not an
                  ink silhouette). Client work supplies a mark; self-authored
                  work usually will not, and gets the hero.
                  When supplied: the spelled-out brand mark, shown centered in the
                  open area on WIDE screens only (its compact counterpart is
                  the `icon` in the grid). Like the icons, it is drawn as a
                  SILHOUETTE in the site's ink — supply transparent-background
                  art with real counterforms; brand colors are discarded.
                  Omitting it auto-fills a placeholder so layout can be seen.

     SECTIONS: the work is split into three — BUILD / DESIGN / ART. Each is
     its own list with its own icons; the footer switches between them. Order
     of `sections` = order of the footer labels; order of a section's
     `projects` = order in the grid. Adding a fourth section is one more
     object here (plus its footer label).
     ABOUT and CONTACT are fixtures ("chrome"): they belong to no section and
     sit apart from the lists entirely.
     ======================================================================= */
  /* CONTENT:START */
  /* EMPTY BY DESIGN. build.js writes the CONTENT object here at deploy,
     assembled from content/*.json (the CMS is the source of truth).

     CONSEQUENCE: opening THIS file directly no longer previews the site —
     there is no CONTENT to build from, so boot() throws. Preview the deploy
     preview URL instead, or run `node build.js` and open dist/index.html.
     That is the one thing the CMS cost, and it is recorded in CLAUDE.md.

     Do not hand-edit between the markers: the next build overwrites it. */
  /* CONTENT:END */

  /* ------------------------------------------------- host image transform
     THE DEPLOY SEAM — set this once, when the host is chosen.

     Static hosts resize images on demand from a single uploaded file: ask for
     the same photo at 480px and the CDN generates, caches, and serves it. That
     is what keeps ONE upload per image and NO size variants to manage locally.

     Point this at the host's URL format and every thumbnail derives itself —
     the `thumb` field stays empty forever. Formats to VERIFY against the
     host's current docs at setup (they change):
       Netlify     (src, w) => `/.netlify/images?url=${encodeURIComponent(src)}&w=${w}&fm=webp`
       Cloudflare  (src, w) => `/cdn-cgi/image/width=${w},format=auto/${src}`

     null = no transform, `src` serves both roles. That is correct today (the
     placeholders are inline data, nothing to resize) and correct for local
     preview, where no CDN exists to do the resizing. */
  // Valid layout names. Add here AND add matching `.l-<name>` CSS rules.
  // 'form' is not selectable from CONTENT — the contact form is hand-built and
  // assigns it directly — but it lives here so applyLayout() clears it like
  // any other layout class.
  const LAYOUTS = ['standard', 'text', 'grid', 'form'];
  const DEFAULT_LAYOUT = 'standard';

  const IMAGE_TRANSFORM = null;

  // Request widths, each set to what the element can actually SHOW at 2x.
  // Anything displayed small asks for a small file; the expanded image is
  // the one place that deliberately asks for the original.
  const THUMB_W = 480;   // carousel strip — 240px box at 2x
  const MARK_W  = 640;   // wordmark — capped at 320px wide by CSS, at 2x
  const HERO_W  = 1440;  // hero image — capped at 720px wide by CSS, at 2x

  // any source URL -> the URL to actually load at a given display width.
  // Data URIs pass through untouched: there is no file for a CDN to fetch.
  function sized(src, w) {
    if (!src) return src;
    if (IMAGE_TRANSFORM && !src.startsWith('data:')) return IMAGE_TRANSFORM(src, w);
    return src;
  }
  // one image record -> the URL the STRIP should load (explicit thumb wins)
  function thumbURL(im) { return im.thumb || sized(im.src, THUMB_W); }

  // ------------------------------------------------------------ data adapter
  // THE SEAM. Reads the editable CONTENT block above (authoring shape: title /
  // details / summary) and produces the internal shape the rest of the code
  // runs on (hd / lines / blurb / images). A CMS later feeds this same adapter
  // the same authoring shape — so the code below the adapter never changes.
  // Grid order = each section's `projects` order; everything downstream (the
  // per-section icon sets, window text, carousels, expand view) derives from
  // the adapter's output. ABOUT and CONTACT are fixtures with NO grid icon —
  // they live in the footer and sit at the end of the flat window list.
  // Runs LAZILY in boot(): resolving a 'placeholder'
  // icon calls makeTestPNG (canvas + toDataURL), which is too heavy for script
  // eval on mobile — it would delay first paint.
  // WHICH SECTION the grid is showing (index into CONTENT.sections). The
  // footer will drive this once switching is wired; until then it stays 0.
  let activeSection = 0;

  // copy may be one string or a list of paragraphs — normalise to a list
  const paras = v => Array.isArray(v) ? v : [v];

  // TITLE -> URL SLUG. THE FALLBACK, NOT THE RULE — see buildData() below,
  // which prefers the slug the CMS authored. Kept for entries that carry no
  // slug of their own: ABOUT, and anything hand-written into CONTENT.
  //
  // It used to be the rule, on the reasoning that a title changes less often
  // than a position does. True, but it made a title edit silently move a URL,
  // while the CMS was promising the editor the opposite — that the slug field
  // is the permanent address. The authored slug wins now, so that promise is
  // real and titles are free to be edited. Never derived from an INDEX either
  // way: reordering a section must not break a link someone already sent.
  const slugify = s => String(s).toLowerCase()
    .replace(/['\u2018\u2019]/g, '')          // drop apostrophes rather than hyphenate
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'item';

  let DATA = null;
  function buildData() {
    // placeholder icon descriptors -> a real bakeable icon object. Real marks
    // arrive as { kind:'svg'|'png', src } and pass straight through.
    const SHAPE_SVG = { circle:SVG_CIRCLE, tri:SVG_TRI, ring:SVG_RING, square:SVG_SQUARE, diamond:SVG_DIAMOND };
    function resolveIcon(ic) {
      if (!ic || ic.kind === 'glyph' || ic.kind === 'svg' || ic.kind === 'png') return ic;
      if (ic.kind === 'placeholder') {
        return SHAPE_SVG[ic.shape]
          ? { kind:'svg', src: svgURL(SHAPE_SVG[ic.shape]) }   // one of the SVG shapes
          : { kind:'png', src: makeTestPNG(ic.shape) };        // otherwise a generated PNG
      }
      return ic;
    }
    // authoring shape -> internal shape, EVERY section. All of them are built
    // (and baked) up front: a section switch churns the grid over on the fast
    // clock and swaps at the midpoint, which leaves no room for an async bake.
    const sections = CONTENT.sections.map((sec, si) => {
      const usedSlugs = Object.create(null);   // per section: two projects can
                                               // share a title across sections
      return {
      id: sec.id, label: sec.label,
      entries: sec.projects.map((p, i) => {
        const seed = si * 100 + i;             // per-section placeholder variety
        const en = { icon: resolveIcon(p.icon), hd: p.title, lines: p.details,
                     blurb: paras(p.summary) };
        // THE AUTHORED SLUG WINS. In the CMS it is the filename, which is the
        // permanent address the editor's help text promises — set once, never
        // changed. Falling back to the title keeps hand-written CONTENT and
        // any entry predating the field working unchanged.
        // The de-duplication below still stands: authored slugs are unique by
        // construction (they are filenames), but a title-derived fallback is
        // not, and two entries answering to one URL is the bug it prevents.
        let sl = p.slug || slugify(p.title);
        if (usedSlugs[sl]) { let n = 2; while (usedSlugs[sl + '-' + n]) n++; sl = sl + '-' + n; }
        usedSlugs[sl] = 1;
        en.slug = sl;
        const wantLayout = p.layout || sec.layout || DEFAULT_LAYOUT;
        en.images = (p.images && p.images.length) ? p.images
                  : placeholderImages(seed, p.title, wantLayout === 'grid' ? 12 : 4);
        // PLACEHOLDER POLICY (filler only — real content just omits the field):
        // BUILD stands in for client work, which ships a wordmark. DESIGN and
        // ART stand in for self-authored work, which does not — so they fall
        // through to the hero image and the fallback is visible there.
        en.wordmark = p.wordmark || (si === 0 ? placeholderWordmark(seed, p.title) : null);
        // project layout > section default > global default; an entry with no
        // imagery is 'text' regardless, since the other layouts need images
        const want = p.layout || sec.layout || DEFAULT_LAYOUT;
        en.layout = !en.images.length ? 'text'
                  : (LAYOUTS.indexOf(want) >= 0 ? want : DEFAULT_LAYOUT);
        // tapping a picture opens it full size? grids default to no.
        en.expand = (p.expand !== undefined) ? !!p.expand : (en.layout !== 'grid');
        return en;
      }),
    };});
    // ABOUT: same shape, but a fixture and image-less (no strip -> full text).
    // Neither fixture carries an icon — both live in the footer, not the grid.
    const about = { hd: CONTENT.about.title, layout: 'text',
      lines: CONTENT.about.details, blurb: paras(CONTENT.about.summary) };
    return { sections, about };
  }
  // Window entries are ONE FLAT LIST across all sections, so switching an
  // entry stays a display swap and never a rebuild:
  //   [ ...section 0, ...section 1, ...section 2, ABOUT, FORM ]
  // SECTION_OFFSET maps (section, project) -> flat index.
  let LIST = null;            // flat list feeding the window build
  let SECTION_ICONS = null;   // icon descriptors, per section (grid order)
  let SECTION_OFFSET = null;  // flat index where each section's entries start
  let ABOUT_INDEX = 0, FORM_INDEX = 0;

  // ------------------------------------------------------------------ boot
  // EVERYTHING below runs inside boot(), deferred until after the black shell
  // has PAINTED (see the double-rAF at the bottom). WebGL context creation,
  // shader compile/link, and the PNG test-icon bakes are all synchronous and,
  // run at script eval, can hold up first paint for the whole init on mobile —
  // which reads as the host background (grey) instead of this page's black.
  function boot() {
  DATA = buildData();
  SECTION_ICONS  = DATA.sections.map(s => s.entries.map(e => e.icon));
  SECTION_OFFSET = [];
  LIST = [];
  DATA.sections.forEach(sec => { SECTION_OFFSET.push(LIST.length); LIST = LIST.concat(sec.entries); });
  ABOUT_INDEX = LIST.length;          // ABOUT sits after every section
  FORM_INDEX  = LIST.length + 1;      // the form is appended after the build
  LIST = LIST.concat(DATA.about);

  // ------------------------------------------------------------------ webgl
  // `gl` is a LET and doubles as the feature flag: any failure below sets it
  // back to null and every GL-touching block is guarded by `if (gl)`. Nothing
  // else in boot() returns early any more — the DOM site is built either way.
  //
  // EVERY path to the fallback WARNS. The shader is the piece; degrading to a
  // text list is a real loss, not a neutral alternative, so it must never
  // happen quietly. A silent downgrade is indistinguishable from a bug, and
  // the first version of this shipped exactly that mistake.
  //
  // TESTING: add ?nogl to the URL to force the fallback on hardware that
  // supports the shader perfectly well. One file with a flag, rather than a
  // second deliberately-broken copy sitting next to the real one waiting to be
  // opened by accident.
  const rootEl = document.getElementById('noiselab');   // needed this early by
                                                        // the failure path below
  const canvas = document.getElementById('nl-gl');
  const FORCE_NOGL = /[?&#]nogl\b/.test(location.search + location.hash);
  let gl = null;
  if (FORCE_NOGL) {
    console.warn('[noiselab] ?nogl flag set — shader disabled deliberately, DOM menu in use.');
  } else {
    try {
      gl = canvas.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: false });
    } catch (e) {                       // some browsers THROW rather than return null
      console.warn('[noiselab] WebGL2 context creation threw:', e);
    }
    if (!gl) console.warn('[noiselab] WebGL2 unavailable — falling back to the DOM menu.');
  }
  if (!gl) rootEl.classList.add('nogl');

  // ---------------------------------------------------------------- theme
  // GL-side theme state. DARK is the load default (the black-at-load chain
  // stays intact); setTheme() flips these plus the CSS vars and metas.
  let BG  = [0, 0, 0];    // clear color
  let INK = [1, 1, 1];    // icon color (uInk)

  // Paint the theme background immediately. The icon bake is async (images
  // decode before the first frame()), so without this the canvas can show an
  // uninitialised (grey/garbage) buffer for a beat on load. Together with the
  // CSS canvas background, the color-scheme/theme-color metas, and the inline
  // html background, the page is black at every stage of load.
  if (gl) {
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  const VERT = `#version 300 es
in vec2 aPos;
uniform vec2 uTranslate;
uniform vec2 uScale;
out vec2 vUv;
void main() {
  vUv = aPos;
  gl_Position = vec4(uTranslate + aPos * uScale, 0.0, 1.0);
}`;

  const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2  uSeed;
uniform float uAmp;
uniform float uFreq;
uniform float uPhase;
uniform vec3  uInk;   // icon color: white in dark mode, black in light mode

// Ashima / Stefan Gustavson 3D simplex noise (webgl-noise, MIT)
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

void main() {
  float nx = snoise(vec3(vUv * uFreq + uSeed, uPhase));
  float ny = snoise(vec3(vUv * uFreq + uSeed + vec2(19.13, 7.7), uPhase + 4.2));
  vec2 disp = vec2(nx, ny) * uAmp;
  vec4 t = texture(uTex, vUv + disp);        // premultiplied; transparent border = no smear
  // the bake is pure white art, so alpha IS the shape — recolor with uInk
  // (output stays premultiplied for the ONE / ONE_MINUS_SRC_ALPHA blend)
  fragColor = vec4(uInk * t.a, t.a);
}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  // A context can exist and STILL fail to compile or link — driver bugs and
  // blocklisted GPUs both show up here rather than at getContext. Treated the
  // same as no context at all: drop to null and let the DOM site carry on.
  let prog = null, loc = null, vao = null;
  if (gl) {
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

      loc = {
        aPos:      gl.getAttribLocation(prog, 'aPos'),
        uTranslate:gl.getUniformLocation(prog, 'uTranslate'),
        uScale:    gl.getUniformLocation(prog, 'uScale'),
        uTex:      gl.getUniformLocation(prog, 'uTex'),
        uSeed:     gl.getUniformLocation(prog, 'uSeed'),
        uAmp:      gl.getUniformLocation(prog, 'uAmp'),
        uFreq:     gl.getUniformLocation(prog, 'uFreq'),
        uPhase:    gl.getUniformLocation(prog, 'uPhase'),
        uInk:      gl.getUniformLocation(prog, 'uInk'),
      };

      // one unit quad, reused for every icon
      const quad = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
      vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc.aPos);
      gl.vertexAttribPointer(loc.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied alpha
    } catch (e) {
      // NOT silent. This catch exists for driver-level failures, but it would
      // just as happily swallow a coding mistake in the block above and make
      // it look like a capability problem. The warning is what tells those two
      // apart.
      console.warn('[noiselab] shader setup failed — falling back to the DOM menu:', e);
      gl = null;
      rootEl.classList.add('nogl');
    }
  }

  // ------------------------------------------------------------- bake step
  // The crux: SVG, PNG and glyph all end up as the same kind of texture.
  function loadImage(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
  }
  async function bakeIcon(item) {
    const S = BAKE_PX, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.clearRect(0, 0, S, S);
    if (item.kind === 'glyph') {
      // draw text directly — never rasterise <text>-in-SVG via <img>
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `700 ${Math.round(S*0.44)}px ui-monospace, Menlo, Monaco, 'Segoe UI', sans-serif`;
      x.fillText(item.char, S/2, S*0.52);
      return c;
    }
    // GEOMETRIC FORMS for the field, drawn straight to canvas for the same
    // reason glyphs are: nothing is rasterised through <img>, and alpha is
    // the shape — white on transparent, recoloured by uInk like every other
    // texture. PLACEHOLDER ART, meant to be replaced by real drawings.
    if (item.kind === 'shape') {
      const d = S * BAKE_FILL, o = (S - d) / 2, r = d / 2, cx = S / 2, cy = S / 2;
      x.fillStyle = '#fff'; x.strokeStyle = '#fff';
      x.lineWidth = Math.max(2, d * 0.11); x.lineJoin = 'miter';
      const poly = (n, rot) => {
        x.beginPath();
        for (let i = 0; i < n; i++) {
          const a = rot + i * 2 * Math.PI / n;
          x[i ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a));
        }
        x.closePath();
      };
      switch (item.form) {
        case 'disc':     x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); break;
        case 'ring':     x.beginPath(); x.arc(cx, cy, r - x.lineWidth / 2, 0, 7); x.stroke(); break;
        case 'square':   x.fillRect(o, o, d, d); break;
        case 'frame':    x.strokeRect(o + x.lineWidth / 2, o + x.lineWidth / 2, d - x.lineWidth, d - x.lineWidth); break;
        case 'triangle': poly(3, -Math.PI / 2); x.fill(); break;
        case 'hexagon':  poly(6, -Math.PI / 2); x.fill(); break;
        case 'hexframe': poly(6, -Math.PI / 2); x.stroke(); break;
        case 'diamond':  poly(4, -Math.PI / 2); x.fill(); break;
        case 'cross':    x.fillRect(cx - d * 0.16, o, d * 0.32, d);
                         x.fillRect(o, cy - d * 0.16, d, d * 0.32); break;
        case 'chevron':  x.beginPath(); x.moveTo(o, cy + r * 0.55);
                         x.lineTo(cx, cy - r * 0.55); x.lineTo(o + d, cy + r * 0.55);
                         x.stroke(); break;
        case 'half':     x.beginPath(); x.arc(cx, cy, r, Math.PI, 0); x.fill(); break;
        case 'quarter':  x.beginPath(); x.moveTo(o, o + d); x.arc(o, o + d, d, -Math.PI / 2, 0); x.fill(); break;
        case 'bars':     for (let i = 0; i < 3; i++) x.fillRect(o, o + i * d / 2.5, d, d * 0.18); break;
        // reserved for the needle — compound, so it is unmistakable among the
        // simple forms at the moment the whole field resolves
        case 'target':   x.beginPath(); x.arc(cx, cy, r - x.lineWidth / 2, 0, 7); x.stroke();
                         x.beginPath(); x.arc(cx, cy, r * 0.34, 0, 7); x.fill(); break;
        default:         x.fillRect(o, o, d, d);
      }
      return c;
    }

    const img = await loadImage(item.src);             // svg or png file
    const target = S * BAKE_FILL, sc = Math.min(target/img.width, target/img.height);
    const w = img.width * sc, h = img.height * sc;
    x.drawImage(img, (S - w)/2, (S - h)/2, w, h);       // centred, with margin to warp into
    return c;
  }

  // ------------------------------------------------------- layout (state)
  // Set by resize()/relayout(); read by frame() and iconAtPointer().
  let icons = [];       // the ACTIVE section's icons (what frame() draws)
  let allIcons = [];    // every section's icons, baked once at boot
  let footW = 0, footH = 0;       // per-icon quad size, clip units
  let cellPxCss = 0;              // icon cell size, CSS px (hit-test)
  let canvasCssW = 0, canvasCssH = 0;
  let marginPxCss = 24;           // pitch * MARGIN_RATIO — feeds --nl-m
  let gridTopCss = 0;             // resting grid's top cell edge, canvas CSS px
  let kbFrozen = false;           // layout freeze while a form field owns the keyboard
  const gridEl    = document.getElementById('nl-grid');
  const stageEl   = document.getElementById('nl-stage');
  // rootEl is declared up at the webgl block — the GL failure path needs it
  // before this point.
  gridEl.style.paddingBottom = FOOTER_RESERVE + 'px';   // single source: the JS knob

  // ------------------------------------------------------ menu row (state)
  // The menu is one row; when that row is wider than the canvas it SCROLLS.
  //   scrollX   offset in CSS px — 0 puts the first icon against the left margin
  //   scrollMax the far end (content width minus viewport width)
  //   scrollV   glide velocity, px/s, decaying after a flick
  //   rowTarget a settle destination (edge spring-back, or scroll-into-view)
  // scrollV and rowTarget are never both live: a target cancels the glide.
  let rowScrolls = false;
  let scrollX = 0, scrollMax = 0, scrollV = 0, rowTarget = null;

  // Push the current scroll into the two things that read icon positions: the
  // icons' own centers (pointer hit-test AND shader), and the DOM twin. The
  // twin moves as ONE transform on the container rather than N left writes —
  // its spans stay at CONTENT coordinates, so placeKeys() and this never have
  // to agree about anything except the base position. It also means a scroll
  // frame writes one style property and reads no layout.
  let fadeL = -1, fadeR = -1;            // last written, so a glide through the
                                         // middle of the row writes nothing
  function applyScroll() {
    for (const ic of icons) {
      ic.pxCx = ic.baseCx - scrollX;
      ic.cx = ic.pxCx / canvasCssW * 2 - 1;
    }
    if (!gl) return;
    keysEl.style.transform = scrollX ? 'translateX(' + (-scrollX).toFixed(1) + 'px)' : '';

    // the dissolve at each end, ramped over the last pitch of travel so it
    // grows in as you leave an end rather than snapping on at the first pixel.
    // Pinned at full width everywhere in between — which is why the guard
    // below means most scroll frames touch no style at all.
    const l = Math.max(0, Math.min(rowFadePx, scrollX));
    const r = Math.max(0, Math.min(rowFadePx, scrollMax - scrollX));
    if (Math.abs(l - fadeL) > 0.5 || (l === 0) !== (fadeL === 0)) {
      canvas.style.setProperty('--fade-l', l.toFixed(1) + 'px'); fadeL = l;
    }
    if (Math.abs(r - fadeR) > 0.5 || (r === 0) !== (fadeR === 0)) {
      canvas.style.setProperty('--fade-r', r.toFixed(1) + 'px'); fadeR = r;
    }
  }

  const rowClamp = x => Math.max(0, Math.min(scrollMax, x));

  // Place every icon: ONE row, square cells, uniform gaps, FIXED pitch.
  // Fits the canvas -> the row centers and nothing scrolls (desktop, as
  // before). Does not fit -> the row starts at the left margin and the rest is
  // reached by swipe. The pitch is the same number either way; that is the
  // whole point (see the taskbar rule at CELL_PX).
  function relayout() {
    const N = icons.length;
    if (!N || !canvasCssW || !canvasCssH) return;

    const g = GAP_RATIO, m = MARGIN_RATIO;

    // The pitch is the fixed base pitch. The ONLY thing that may shrink it is
    // GRID_MAX_FRAC having shortened the canvas — a viewport too short for one
    // row plus the footer reserve. That is the same last-resort uniform shrink
    // the old multi-row layout had, and it is the one case where icons give up
    // their fixed size rather than evict the content half.
    const pitch  = Math.min(CELL_PX / (1 - g), canvasCssH / (1 - g + 2 * m));
    const cellPx = pitch * (1 - g);
    const gapPx  = pitch * g;
    cellPxCss = cellPx;
    marginPxCss = pitch * m;             // ONE margin value for grid AND window
    footW = 2 * cellPx / canvasCssW;     // CSS px -> clip-space quad size
    footH = 2 * cellPx / canvasCssH;

    // Does the row fit? resize() has already sized the canvas from the same
    // two numbers, so this cannot disagree with it. The half-pixel slack keeps
    // rounding from arming a scroll of nothing.
    const rowW = N * cellPx + (N - 1) * gapPx;
    const over = rowW + 2 * marginPxCss - canvasCssW;
    rowScrolls = over > 0.5;
    scrollMax = rowScrolls ? over : 0;
    rowFadePx = pitch;                   // one pitch — see the note at its
                                         // declaration for why not less
    if (!rowScrolls) { scrollX = 0; scrollV = 0; rowTarget = null; }
    else scrollX = rowClamp(scrollX);    // a resize can shorten the run

    // vertical: the single row, centered in the canvas
    const cy = canvasCssH / 2;
    gridTopCss = cy - cellPx / 2;        // top cell edge — the window margins
                                         // against THIS
    // horizontal: centered while it fits, left-aligned once it scrolls
    const cx0 = rowScrolls ? marginPxCss + cellPx / 2
                           : (canvasCssW - rowW) / 2 + cellPx / 2;

    for (let i = 0; i < N; i++) {
      const ic = icons[i];
      ic.baseCx = cx0 + i * (cellPx + gapPx);   // CONTENT space — no scroll in it
      ic.pxCy = cy;
      ic.cy = 1 - cy / canvasCssH * 2;
    }
    applyScroll();                       // fills pxCx / cx from baseCx
    canvas.classList.toggle('scroll-row', rowScrolls);
    keysEl.classList.toggle('scroll-row', rowScrolls && !!gl);
  }

  // Bring icon i fully inside the viewport, one margin clear of the edge. Both
  // the keyboard and the URL land here: an icon you cannot see is not selected
  // as far as the eye is concerned, and arrowing off the visible end has to
  // take the row with it.
  function ensureVisible(i, instant) {
    if (!rowScrolls || i === null || i === undefined || !icons[i]) return;
    const half = cellPxCss / 2, pad = marginPxCss;
    const l = icons[i].baseCx - half - pad;
    const r = icons[i].baseCx + half + pad;
    let t = scrollX;
    if (l < t) t = l;
    else if (r > t + canvasCssW) t = r - canvasCssW;
    t = rowClamp(t);
    if (Math.abs(t - scrollX) < 0.5) return;
    scrollV = 0;
    if (instant) { rowTarget = null; scrollX = t; applyScroll(); }
    else rowTarget = t;                  // eases in stepRowScroll
  }

  // The glide, integrated once per frame from frame(). It rides the rAF loop
  // the icons already run on — a scroll animation with its own loop would be a
  // second clock, and the two would drift.
  function stepRowScroll(dt) {
    if (!rowScrolls || dragId !== null) return;   // the finger owns the position
    if (rowTarget !== null) {
      const k = 1 - Math.exp(-ROW_SPRING * dt);
      scrollX += (rowTarget - scrollX) * k;
      if (Math.abs(rowTarget - scrollX) < 0.5) { scrollX = rowTarget; rowTarget = null; }
      applyScroll();
      return;
    }
    const bound = rowClamp(scrollX);
    const off   = scrollX - bound;
    if (scrollV === 0 && off === 0) return;

    if (off !== 0) {
      // PAST AN END. A spring pulls back and swallows whatever speed is left,
      // whether the row arrived here on a glide or the finger let go mid-
      // overscroll. Clamping instead — which is what this did — stops a moving
      // row dead against an invisible wall, and at this friction most flicks
      // reach an end, so that stop is the thing you would feel most.
      scrollV += -off * ROW_EDGE_K * dt;
      scrollV *= Math.exp(-ROW_EDGE_DAMP * dt);
      scrollX += scrollV * dt;
      if (Math.abs(scrollX - bound) < 0.5 && Math.abs(scrollV) < ROW_STOP_V) {
        scrollX = bound; scrollV = 0;
      }
    } else {
      scrollX += scrollV * dt;
      scrollV *= Math.exp(-ROW_FRICTION * dt);  // exponential, not linear: a
                                                // hard flick runs long and a
                                                // nudge stops soon
      if (Math.abs(scrollV) < ROW_STOP_V) scrollV = 0;
    }
    applyScroll();
  }

  // ------------------------------------------- keyboard / screen-reader grid
  // The DOM twin of the icon grid. The canvas DRAWS the icons; these spans ARE
  // the icons as far as the keyboard and a screen reader are concerned. All
  // geometry comes from relayout()'s output — the same numbers the pointer
  // hit-test uses — so the two paths cannot disagree about where an icon is.
  //
  // ROVING TABINDEX: the grid is ONE tab stop, not thirteen. Exactly one span
  // holds tabindex 0; the arrows move it. Tab enters the grid there and the
  // next Tab leaves for the footer, so the menu never becomes a tab trap.
  //
  // FOCUS IS NOT SELECTION. Arrowing moves focus only; Enter or Space commits.
  // If focus selected, crossing the grid would churn the whole thing once per
  // keypress and open thirteen windows on the way past.
  const keysEl = document.getElementById('nl-keys');
  let keyEls = [];
  let focusIdx = 0;

  // rebuild the layer for the ACTIVE section (titles and count both change)
  function buildKeys() {
    keysEl.textContent = '';
    const ents = (DATA.sections[activeSection] || {}).entries || [];
    focusIdx = 0;
    keyEls = ents.map((en, i) => {
      const s = document.createElement('span');
      s.setAttribute('data-key', '');
      s.setAttribute('role', 'option');
      s.setAttribute('aria-selected', 'false');
      s.setAttribute('aria-label', en.hd);   // an EMPTY span — the label is the
                                             // whole content, so nothing draws
      // ...unless there is no shader, in which case this layer IS the menu and
      // the title has to be readable. Same element, same handlers, same state:
      // only whether it draws changes.
      if (!gl) s.textContent = en.hd;
      s.tabIndex = i === 0 ? 0 : -1;
      s.addEventListener('keydown', (ev) => onKeyNav(ev, i));
      // harmless with a shader (the layer is pointer-events: none there, so it
      // never fires); the only way to select without one
      s.addEventListener('click', () => {
        if (gridInert() || fixture === 'contact') return;        // same locks
        setSelected(selected === i ? null : i);
      });
      keysEl.appendChild(s);
      return s;
    });
    updateKeys();
  }

  // lay every span onto its icon's resting cell box. Called from resize() just
  // after relayout(), so the targets follow the grid through every reflow,
  // rotation, and section change without a second source of geometry.
  function placeKeys() {
    if (!gl) return;                 // flowed as a text list; CSS owns it
    if (!keyEls.length || !canvasCssW) return;
    const sRect = stageEl.getBoundingClientRect();
    const cRect = canvas.getBoundingClientRect();
    keysEl.style.left   = (cRect.left - sRect.left).toFixed(1) + 'px';
    keysEl.style.top    = (cRect.top  - sRect.top ).toFixed(1) + 'px';
    keysEl.style.width  = canvasCssW.toFixed(1) + 'px';
    keysEl.style.height = canvasCssH.toFixed(1) + 'px';
    const half = cellPxCss / 2;
    for (let i = 0; i < keyEls.length && i < icons.length; i++) {
      const s = keyEls[i], ic = icons[i];
      // baseCx, NOT pxCx: the spans sit at content coordinates and the scroll
      // is one transform on the container (see applyScroll). Writing the
      // scrolled position here would apply the offset twice.
      s.style.left   = (ic.baseCx - half).toFixed(1) + 'px';
      s.style.top    = (ic.pxCy - half).toFixed(1) + 'px';
      s.style.width  = cellPxCss.toFixed(1) + 'px';
      s.style.height = cellPxCss.toFixed(1) + 'px';
    }
  }

  // aria-selected mirrors the FROZEN icon, so a screen reader hears the same
  // thing the eye sees: exactly one item selected, or none while a fixture
  // holds the window. The roving tabindex follows the selection too — tabbing
  // back into the grid lands on whatever is currently open, not on item one.
  function updateKeys() {
    const sel = (fixture === null) ? selected : null;
    if (sel !== null) focusIdx = sel;
    for (let i = 0; i < keyEls.length; i++) {
      keyEls[i].setAttribute('aria-selected', i === sel ? 'true' : 'false');
      keyEls[i].tabIndex = (i === focusIdx) ? 0 : -1;
    }
  }

  function moveFocus(i) {
    if (i < 0 || i >= keyEls.length) return;
    focusIdx = i;
    for (let k = 0; k < keyEls.length; k++) keyEls[k].tabIndex = (k === i) ? 0 : -1;
    // preventScroll is LOAD-BEARING now that the row can scroll: the spans run
    // past the canvas, and the browser's own scroll-focus-into-view would
    // scroll the nearest scrollable ancestor — #nl-grid, which is
    // overflow:hidden, so the offset is silent and nothing ever puts it back.
    // The row is scrolled deliberately instead, on the line below.
    keyEls[i].focus({ preventScroll: true });
    ensureVisible(i);
  }

  function onKeyNav(ev, i) {
    // the grid is inert while it REARRANGES and under the CONTACT LOCK,
    // exactly as the pointer path is — the keyboard gets no privilege the
    // pointer lacks, so a stray Enter can no more discard a draft, or commit
    // an icon that is still travelling, than a stray tap can. Focus may still
    // MOVE while inert; it changes nothing.
    const inert = gridInert() || (fixture === 'contact');
    let d = null;
    switch (ev.key) {
      // Left/Right step the list LINEARLY, so they still work at >=950px where
      // the grid is a single row; Up/Down jump by the current column count.
      case 'ArrowRight': d = i + 1;      break;
      case 'ArrowLeft':  d = i - 1;      break;
      case 'ArrowDown':  d = i + COLS;   break;
      case 'ArrowUp':    d = i - COLS;   break;
      case 'Home':       d = 0;          break;
      case 'End':        d = keyEls.length - 1; break;
      case 'Enter':
      case ' ':
        ev.preventDefault();
        if (inert) return;
        // mirrors the pointer exactly: committing the ALREADY-frozen icon is
        // the exit, the same gesture as tapping the coherent thing
        setSelected(selected === i ? null : i);
        return;
      default: return;                   // every other key belongs to the page
    }
    ev.preventDefault();                  // arrows would otherwise scroll
    // CLAMPED, not wrapped. The filmstrip wraps because it is a line; this is
    // a grid, and running off its end would land somewhere unrelated.
    moveFocus(Math.max(0, Math.min(keyEls.length - 1, d)));
  }

  // The grid half is sized by the grid itself: the cell pitch is a FIXED
  // constant (CELL_PX — icons never change size on rotation OR resize), the
  // available width decides how many columns fit, and the half — and with it
  // the seam — is exactly canvas + footer reserve. Contact takes the rest.
  // Wide enough for every icon in one row (~950px at 15 icons) reads as a
  // menu bar at the foot of the page.
  function resize(force) {
    // the on-screen keyboard collapses 100dvh — re-deriving the grid from that
    // transient viewport makes the page thrash mid-typing. FORCE overrides it
    // for changes that MUST re-lay-out regardless: a section commit swaps in an
    // icon set that has never been positioned, and skipping relayout would
    // leave every icon of the new section stacked at the origin.
    if (kbFrozen && !force) return;

    // THE FIELD SIZES ITSELF FROM THE SCREEN, not from the icon count, so it
    // takes the whole of resize() rather than a branch inside it. Leaving the
    // field if the window drops below the minimum keeps the mode honest: it
    // is offered only where it works, so it should not survive there either.
    if (field) {
      if (rootEl.getBoundingClientRect().width < FIELD_MIN_W) { exitField(); return; }
      buildFieldPreservingResolved();
      fieldResize(false);        // follow the window, do not animate after it
      return;
    }

    const nlRect = rootEl.getBoundingClientRect();
    const availW = Math.max(80, nlRect.width);

    // FIXED pitch (the taskbar rule): cell size never follows the viewport.
    // Available width decides how much of the row is VISIBLE, never how big
    // the icons in it are.
    const g = GAP_RATIO, m = MARGIN_RATIO;
    const basePitch = CELL_PX / (1 - g);

    // NO SHADER: there is no canvas to size and no grid to lay out — the key
    // layer flows itself as a wrapped list. Everything else still holds.
    //
    // THE SEAM FOLLOWS THE MENU, exactly as it does with a shader, where the
    // grid half is precisely canvas + footer reserve. Sizing this half to a
    // flat 50% instead — which is what the first version of this branch did —
    // throws that rule away: the titles float in half a screen of nothing and
    // the window is squeezed into the other half for no reason. The menu is
    // made of type here rather than pixels; it gets measured the same way.
    if (!gl) {
      COLS = 1;                          // arrow Up/Down step one in a list
      marginPxCss = basePitch * m;
      rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');   // set
                                         // BEFORE measuring: the list's padding
                                         // derives from it and affects wrapping

      // the wrapped list's natural height IS the measurement. +2 covers the
      // seam's own 1px border so the last row never clips into a scrollbar.
      const listH = Math.ceil(keysEl.scrollHeight) + 2;
      const maxH  = nlRect.height * GRID_MAX_FRAC - FOOTER_RESERVE;   // the same
                                         // last-resort cap the canvas obeys
      const gh    = Math.max(24, maxH > 24 ? Math.min(listH, maxH) : listH);
      gridEl.style.height = (gh + FOOTER_RESERVE).toFixed(1) + 'px';

      // window bottom lands one margin above the seam — the fallback's
      // equivalent of "one margin above the resting grid's top cell edge"
      const wb = Math.min(gh + FOOTER_RESERVE + marginPxCss,
                          nlRect.height - marginPxCss - 60);   // keep >=60px of window
      rootEl.style.setProperty('--nl-win-bottom', Math.max(0, wb).toFixed(1) + 'px');
      const wh = nlRect.height - marginPxCss - Math.max(0, wb);
      rootEl.style.setProperty('--car-h', Math.max(48, wh * 0.25).toFixed(1) + 'px');
      if (typeof updateMore === 'function') updateMore();
      return;
    }

    const N = icons.length || 1;
    COLS = N;                            // one row — the keyboard's Up/Down step

    // ONE ROW at a FIXED pitch. The whole row wants basePitch * (N - g + 2m).
    // When that fits, the canvas hugs it (margins = pitch * MARGIN_RATIO
    // inside) and centers in the half, exactly as it always did. When it does
    // not, the canvas takes the FULL width and becomes the VIEWPORT onto a row
    // that runs past both edges — the row is not made smaller and it is not
    // wrapped. relayout() re-derives that same verdict from these two numbers,
    // so the canvas and the layout cannot disagree about whether it scrolls.
    const fullW = basePitch * (N - g + 2 * m);
    let cw = Math.min(fullW, availW);
    let ch = basePitch * (1 - g + 2 * m);

    // cap the grid half at GRID_MAX_FRAC of the page so the contact half
    // always keeps working room; when the cap bites, shrink uniformly.
    // One row needs a viewport under ~210px tall before this bites at all, and
    // the width half of it is skipped while scrolling: there the width is the
    // VIEWPORT, and narrowing a viewport does not buy back any height.
    const maxCh = nlRect.height * GRID_MAX_FRAC - FOOTER_RESERVE;
    if (maxCh > 0 && ch > maxCh) { if (cw >= fullW) cw *= maxCh / ch; ch = maxCh; }

    // the SEAM follows the grid: half height = canvas + footer reserve
    gridEl.style.height = (ch + FOOTER_RESERVE).toFixed(1) + 'px';

    const dpr = Math.min(Math.max(window.devicePixelRatio || 1, RENDER_SCALE_MIN), RENDER_SCALE_MAX);
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width  = Math.max(1, Math.round(cw * dpr));
    canvas.height = Math.max(1, Math.round(ch * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);

    // the backing store was just reallocated — repaint it in the theme
    // background NOW, not at the next frame(), so a resize can never flash
    // an uninitialised buffer
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    canvasCssW = cw; canvasCssH = ch;
    relayout();
    placeKeys();                         // targets follow the grid, one source
    ensureVisible(selected, true);       // a rotation must not leave the open
                                         // project scrolled off the row. No
                                         // animation: the layout already moved

    // ---- window geometry: one margin, derived from the grid pitch.
    // top / left / right = --nl-m from the screen edges; bottom lands the
    // window --nl-m above the RESTING grid's top cell edge (which the warp
    // never moves). Recomputed here because the pitch, the seam, and the
    // canvas position all change on resize.
    const nlRect2 = rootEl.getBoundingClientRect();   // re-read: grid height was just set
    const cRect  = canvas.getBoundingClientRect();
    const gridTopLocal = (cRect.top - nlRect2.top) + gridTopCss;   // in #noiselab space
    let winBottom = nlRect2.height - gridTopLocal + marginPxCss;
    winBottom = Math.min(winBottom, nlRect2.height - marginPxCss - 60);  // keep ≥60px of window
    rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');
    rootEl.style.setProperty('--nl-win-bottom', Math.max(0, winBottom).toFixed(1) + 'px');

    // carousel height: ~25% of the window's actual height, floored so short
    // screens keep a visible strip
    const winH = nlRect2.height - marginPxCss - Math.max(0, winBottom);
    rootEl.style.setProperty('--car-h', Math.max(48, winH * 0.25).toFixed(1) + 'px');

    // the window just changed width: copy re-wraps, so whether it overflows
    // the clamp may have flipped
    if (typeof updateMore === 'function') updateMore();
  }

  // ----------------------------------------------------- selection + morph
  const smooth = x => x * x * (3 - 2 * x);
  const mixv = (a, b, e) => a + (b - a) * e;

  // selection model:
  //   selected === null -> all icons calm (breathing), contact shows the ABOUT
  //   selected === i      -> icon i FREEZES (static); every other icon is driven
  //                          noisy, and the contact WINDOW opens
  // REST:   tap an icon to activate it; a tap in empty space changes nothing.
  // ACTIVE: the grid IS the navigation —
  //         tap a DIFFERENT icon  -> switch to it directly (no rest stop);
  //         tap the FROZEN icon   -> exit to rest (dissolve the coherent thing);
  //         tap a gap / margin    -> exit to rest.
  //         (the contact half is NOT an exit — misclick protection around
  //         the window and its controls)
  // CONTACT LOCK: while the contact FORM is active, the grid is inert and
  //         Escape is ignored — the × is the ONLY exit, so a stray tap can
  //         never throw away a half-written message.
  // Hit-testing tests each icon's RESTING cell box (pxCx/pxCy), which the warp
  // never moves, so targets stay pinned even while the art churns.
  // THREE state values now, composing cleanly:
  //   activeSection  which icon set the grid holds (footer BUILD/DESIGN/ART)
  //   selected       which project in that section is frozen, or null
  //   fixture        'about' | 'contact' | null — a footer entry holding the
  //                  window with NO grid icon behind it
  // The coherence grammar is unchanged, just extended: exactly one thing is
  // still at any moment. With a fixture open that thing is the FOOTER LABEL
  // (ink against the grey row) and the whole grid churns — you have stepped
  // out of the work, so nothing in the work is coherent.
  let selected = null;
  let fixture  = null;

  function applySelection() {
    const fx = fixture !== null;
    for (let i = 0; i < icons.length; i++) {
      icons[i].target      = fx ? 1 : (selected === null ? 0 : (i === selected ? 0 : 1));
      icons[i].stillTarget = (!fx && selected !== null && i === selected) ? 1 : 0;
    }
  }

  // where the window should be pointing, as a FLAT winEntries index (or null
  // for rest). One function so grid selections and footer fixtures share the
  // same open / switch / close machinery.
  function winTarget() {
    if (fixture === 'about')   return ABOUT_INDEX;
    if (fixture === 'contact') return FORM_INDEX;
    if (selected !== null)     return SECTION_OFFSET[activeSection] + selected;
    return null;
  }

  // apply whatever state was just set: grid noise, footer marks, and the
  // window (open from rest / switch entry / close), on the existing clocks.
  function commit(prevTarget) {
    applySelection();
    updateNav();
    updateKeys();
    ensureVisible(selected);             // opening a project off the visible
                                         // end of the row brings it into view
                                         // (a deep link does this too)
    const t = winTarget();
    if (t === null)             { contactSet(false); syncRoute(false); return; }
    if (prevTarget === null)    { setWinContent(t); contactSet(true); }  // rest -> open
    else if (t !== prevTarget)  { contactSwap(t); }                      // open -> open
    syncRoute(false);
  }

  // selecting an icon drives the noise: the picked icon freezes static, every
  // other icon activates, and the window opens. Selecting while
  // ALREADY open is a SWITCH: the old icon melts back into the churn (slow
  // clock) while the new one snaps still, and the window re-churns to the new
  // entry via contactSwap. Deselecting (next = null) returns everything to rest.
  function setSelected(next) {
    const prev = winTarget();
    selected = next;
    fixture  = null;              // a grid selection always leaves a fixture
    commit(prev);
  }

  // footer ABOUT / CONTACT: take the window with no grid icon behind them.
  // Tapping the lit one again returns to rest, so each is its own toggle.
  function openFixture(which) {
    const prev = winTarget();
    if (fixture === which) { selected = null; fixture = null; }
    else                   { selected = null; fixture = which; }
    commit(prev);
  }

  // ---- section switching (footer BUILD / DESIGN / ART)
  // The grid churns OVER: every icon drives to full noise on the fast clock,
  // the icon set is exchanged at the midpoint — noise to noise, so the cut is
  // invisible, exactly as the window's text swap works — and the new set
  // resolves back to calm on the slow clock. The window leaves with the old
  // section; a switch always lands at rest.
  let gSwapTo = null, gMix = 0;

  // ---- grid reorganisation (position). See NOTES-GRID-MOTION.md.
  // moveActive is true from the moment a switch is armed until the LAST icon
  // has settled — which is a much longer window than gSwapTo, and that gap is
  // the whole point (see gridInert below).
  let moveActive = false;

  // Zero the displacement on EVERY set, not just the active one. An icon set
  // that was switched away from mid-flight keeps whatever move value it had;
  // if the next thing to happen is a path that does not re-arm it, it would
  // draw permanently off its cell. Clearing all sets makes that unreachable.
  function cancelGridMotion() {
    for (const set of allIcons) for (const ic of set) { ic.move = 0; ic.moveTarget = 0; ic.moveDelay = 0; }
    moveActive = false;
  }

  // Arm the displacement for the CURRENT set. Outgoing: drive to full
  // displacement on the fast clock, arriving exactly as the icon set is
  // exchanged. Incoming: the new set ARRIVES displaced and converges on the
  // slow clock, mirroring how mix already arrives at 1 and eases to 0.
  //
  // STAGGER IS ON THE RETURN ONLY. The way out is ON_TIME (0.12s) and has no
  // room to spread; the way back is OFF_TIME (0.80s) and does. So the set
  // leaves together and settles raggedly, which is the same asymmetry the
  // rest of the file already commits to.
  //
  // WHAT THE ARRANGEMENT IS is NOT designed here. Radial-with-jitter is a
  // placeholder chosen so the mechanism is legible while being watched — the
  // set opens apart and converges, rather than jittering in place. Step 4 in
  // the note is the actual design problem and is deliberately still open.
  function armGridMotion(incoming) {
    // OFF BY DEFAULT (see GRID_MOTION). NO SHADER: no icon is drawn at all —
    // #nl-keys IS the menu — so there is nothing to move. REDUCED MOTION:
    // collapse to the instant swap, exactly as the text churn already does.
    // All three ZERO the offsets rather than merely returning, so a set left
    // displaced can never stay that way — and because moveActive is only ever
    // armed below, none of them can leave the grid inert either.
    if (!GRID_MOTION || !gl || reduceMotion) { cancelGridMotion(); return; }
    moveActive = true;
    for (const ic of icons) {
      const a = Math.atan2(ic.pxCy - canvasCssH * 0.5, ic.pxCx - canvasCssW * 0.5)
              + (Math.random() - 0.5) * MOVE_JITTER;
      ic.mvx = Math.cos(a); ic.mvy = Math.sin(a);
      if (incoming) { ic.move = 1; ic.moveTarget = 0; ic.moveDelay = Math.random() * MOVE_STAGGER; }
      else          { ic.moveTarget = 1; ic.moveDelay = 0; }
    }
  }

  // THE GRID IS INERT WHILE IT IS MOVING — not merely while the icon set is
  // being exchanged. gSwapTo covers only the 0.12s churn-out; the icons keep
  // travelling through the 0.80s re-form after it, while the hit test and
  // #nl-keys still read relayout()'s RESTING boxes. A tap in that window would
  // land on the project that will END UP there, not the one under the finger.
  //
  // This is the deliberate answer to hazard 1 in the note. The alternative —
  // a hit target that chases the drawn position — makes the pointer path and
  // the DOM twin disagree about where an icon is, which is the one thing the
  // twin exists to prevent. Locking is honest and nothing can disagree.
  //
  // The FOOTER is not covered by this: switchSection keeps its own gSwapTo
  // guard, so a second section tap during the re-form still lands. Only the
  // icons — the things actually moving — stop accepting input.
  function gridInert() { return gSwapTo !== null || moveActive; }

  // ============================================================== the field
  // A MODE, not a state of the menu. While it is up there is no menu, no
  // seam, no selection and no window — which is why two CLAUDE.md rules stop
  // applying here (documented in NOTES-ICON-FIELD.md): "the seam follows the
  // menu" has no seam to follow, and "exactly one thing is coherent" inverts,
  // because the field ACCUMULATES coherence as you resolve shape after shape.
  // That inversion is the point of the piece, not a violation of the grammar.
  //
  // The taskbar rule is NOT suspended: cells are the same fixed 50px as menu
  // icons and only the count changes.
  let field = false;            // is the field up?
  let fieldCells = [];          // its cells — built once, on first entry
  let shapeTex = [];            // baked geometric forms, the resolve targets
  let fieldSwap = null;         // pending entry, seconds remaining
  let savedIcons = null;        // the menu set to come back to

  const fieldBtn = document.getElementById('nl-field');

  // The field is offered only where it can actually be had: a real pointer, a
  // wide screen, a shader, and no stated preference against motion. A
  // reduced-motion version of a motion piece is worse than its absence, so it
  // is withheld rather than degraded — the button simply is not there.
  function fieldAvailable() {
    return !!gl && !reduceMotion && shapeTex.length > 0 &&
           rootEl.getBoundingClientRect().width >= FIELD_MIN_W;
  }
  function updateFieldBtn() {
    rootEl.classList.toggle('can-field', fieldAvailable() || field);
    if (!fieldBtn) return;
    fieldBtn.setAttribute('aria-label', field ? 'Leave the field' : 'Enter the field');
    fieldBtn.setAttribute('aria-pressed', field ? 'true' : 'false');
  }

  // COLS and ROWS both from the viewport at the menu's fixed pitch — Robert's
  // rule, and the exact formula resize() already uses for COLS, applied to the
  // other axis as well. Returns the cell counts and the canvas that holds them.
  function fieldMetrics() {
    const r = rootEl.getBoundingClientRect();
    const g = GAP_RATIO, m = MARGIN_RATIO, pitch = CELL_PX / (1 - g);
    const n = (px) => Math.max(1, Math.floor(px / pitch - 2 * m + g + 1e-6));
    // ROWS COME OFF THE HEIGHT MINUS THE FOOTER RESERVE, not the raw viewport.
    // The footer strip is not available real estate — the canvas is anchored
    // above it, so deriving rows from the full height overfills by about half
    // a row and the top one gets clipped off the screen.
    const cols = n(r.width), rows = n(r.height - FOOTER_RESERVE);
    return { cols, rows, pitch,
             cw: pitch * (cols - g + 2 * m),
             ch: pitch * (rows - g + 2 * m),
             vh: r.height };
  }

  // Build (or rebuild) the cell set for the current viewport. Each cell is
  // DERIVED FROM an icon — it churns that icon's texture, unrecognisably —
  // and carries a different geometric form as what it resolves INTO. That is
  // the description exactly: shapes that no longer represent what they came
  // from.
  let fieldCols = 0, fieldRows = 0;
  let fieldOrder = [];          // resolved cells, oldest first — the budget queue
  let fieldNeedle = -1;         // the calm cell
  let fieldFound = false;
  let fieldRevealT = 0;         // seconds left of the whole-field reveal

  function buildField(keepNeedleAt) {
    const met = fieldMetrics(), N = met.cols * met.rows;
    const src = allIcons.reduce((a, b) => a.concat(b), []);
    fieldCols = met.cols; fieldRows = met.rows;
    fieldOrder = [];
    fieldCells = [];
    for (let i = 0; i < N; i++) {
      const from = src[i % src.length];
      fieldCells.push({
        tex: from ? from.tex : null,
        baseTex: from ? from.tex : null,   // what it churns as, to return to
        // RANDOM, not `i % forms`. Modulo assignment tiles: at the reveal the
        // whole field came out as regular diagonal stripes, which reads as
        // wallpaper and throws away the one moment the array is legible.
        // Scattered, each cell looks like it had its own answer.
        // The LAST form is held back for the needle — see below.
        shapeTex: shapeTex[Math.floor(Math.random() * Math.max(1, shapeTex.length - 1))],
        sx: Math.random() * 127, sy: Math.random() * 127,
        mix: 1, target: 1,              // arrives churning and STAYS churning
        still: 0, stillTarget: 0,       // until a click resolves it
        phase: Math.random() * 100,
        cx: 0, cy: 0, pxCx: 0, pxCy: 0,
        move: 0, moveTarget: 0, moveDelay: 0, mvx: 0, mvy: 0,
        resolved: false, unswap: false,
        calm: 0,                // 1 on the needle — churns quieter than the rest
        permanent: false,       // exempt from the budget once found
        temp: false,            // resolved only for the reveal
      });
    }
    // Place the needle. On a resize the caller passes the old grid position so
    // a window drag cannot move what someone is hunting for — only a genuinely
    // new field re-rolls it.
    fieldNeedle = -1;
    if (keepNeedleAt && keepNeedleAt.c < fieldCols && keepNeedleAt.r < fieldRows) {
      fieldNeedle = keepNeedleAt.r * fieldCols + keepNeedleAt.c;
    } else if (N > 0) {
      fieldNeedle = Math.floor(Math.random() * N);
    }
    if (fieldNeedle >= 0) {
      fieldCells[fieldNeedle].calm = 1;
      // and it resolves into the one form nothing else in the field carries,
      // so at the reveal the cell you found is visibly singular
      if (shapeTex.length > 1) fieldCells[fieldNeedle].shapeTex = shapeTex[shapeTex.length - 1];
    }
    return met;
  }

  // A resize changes how many cells fit, so the set is rebuilt — but what the
  // visitor already resolved is theirs and must not be wiped by dragging the
  // window. Resolved state is carried across BY GRID POSITION; cells that fall
  // outside the new bounds are lost, which is the honest limit of the mapping.
  function buildFieldPreservingResolved() {
    const old = fieldCells, oc = fieldCols, wasFound = fieldFound;
    const keep = [];
    for (let i = 0; i < old.length; i++) {
      if (old[i].resolved && !old[i].temp) {
        keep.push([i % oc, Math.floor(i / oc), old[i].shapeTex, old[i].permanent]);
      }
    }
    // the needle keeps its grid position across a resize — a window drag must
    // not relocate the thing being hunted for, nor hand out a second chance
    const nAt = fieldNeedle >= 0 && oc > 0
      ? { c: fieldNeedle % oc, r: Math.floor(fieldNeedle / oc) } : null;
    buildField(nAt);
    fieldFound = wasFound;
    fieldRevealT = 0;
    for (const [c, r, tex, perm] of keep) {
      if (c >= fieldCols || r >= fieldRows) continue;
      const k = r * fieldCols + c, ic = fieldCells[k];
      ic.tex = tex; ic.shapeTex = tex; ic.unswap = false; ic.permanent = perm;
      ic.resolved = true; ic.mix = 0; ic.target = 0; ic.still = 1; ic.stillTarget = 1;
      if (!perm) fieldOrder.push(k);
    }
    icons = fieldCells;
  }

  // Lay the cells out. Deliberately NOT relayout(): that one centres a short
  // final row and derives ROWS from the icon count. Here the grid is full by
  // construction and both counts come from the screen.
  function fieldRelayout() {
    if (!field || !fieldCells.length || !canvasCssW || !canvasCssH) return;
    const met = fieldMetrics();
    const cellPx = met.pitch * (1 - GAP_RATIO), gapPx = met.pitch * GAP_RATIO;
    cellPxCss = cellPx;
    footW = 2 * cellPx / canvasCssW;
    footH = 2 * cellPx / canvasCssH;
    const gridW = met.cols * cellPx + (met.cols - 1) * gapPx;
    const gridH = met.rows * cellPx + (met.rows - 1) * gapPx;
    const x0 = (canvasCssW - gridW) / 2 + cellPx / 2;
    const y0 = (canvasCssH - gridH) / 2 + cellPx / 2;
    for (let r = 0, k = 0; r < met.rows; r++) {
      for (let c = 0; c < met.cols && k < fieldCells.length; c++, k++) {
        const ic = fieldCells[k];
        const px = x0 + c * (cellPx + gapPx), py = y0 + r * (cellPx + gapPx);
        ic.pxCx = px; ic.pxCy = py;
        ic.cx = px / canvasCssW * 2 - 1;
        ic.cy = 1 - py / canvasCssH * 2;
      }
    }
  }

  // Size the canvas to the FIELD rather than to the icon count, and raise the
  // seam. The canvas is set to its full size in one step while everything is
  // noise; the half then grows underneath it on a CSS transition, so the field
  // is REVEALED from the bottom up as the line travels off the top. Nothing
  // reallocates the backing store per frame.
  // `animate` is passed only when the seam is actually travelling. A window
  // resize while the field is already up must NOT animate: the height would
  // chase the drag by 900ms behind the pointer, which reads as broken.
  function fieldResize(animate) {
    const met = fieldMetrics();
    if (animate) fieldTransition();
    const dpr = Math.min(Math.max(window.devicePixelRatio || 1, RENDER_SCALE_MIN), RENDER_SCALE_MAX);
    canvas.style.width  = met.cw + 'px';
    canvas.style.height = met.ch + 'px';
    canvas.width  = Math.max(1, Math.round(met.cw * dpr));
    canvas.height = Math.max(1, Math.round(met.ch * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    canvasCssW = met.cw; canvasCssH = met.ch;
    marginPxCss = met.pitch * MARGIN_RATIO;
    rootEl.style.setProperty('--nl-m', marginPxCss.toFixed(1) + 'px');
    gridEl.style.height = met.vh + 'px';       // the seam, off the top
    fieldRelayout();
  }

  // The CSS height transition is added only around the move, in BOTH
  // directions, and taken off afterwards. Leaving it on permanently would
  // animate every window resize, which would make an ordinary rotation feel
  // broken.
  let fieldTxTimer = 0;
  function fieldTransition() {
    rootEl.classList.add('field-tx');
    clearTimeout(fieldTxTimer);
    fieldTxTimer = setTimeout(() => rootEl.classList.remove('field-tx'), FIELD_RISE + 120);
  }

  function enterField() {
    if (field || fieldSwap !== null || !fieldAvailable()) return;
    if (gSwapTo !== null) return;                 // not mid-section-swap
    if (selected !== null || fixture !== null) return;   // INACTIVE STATE only:
                                  // every menu option visible, window empty
    savedIcons = icons;
    for (const ic of icons) { ic.target = 1; ic.stillTarget = 0; }   // churn out
    fieldSwap = FIELD_SWAP;       // ...and exchange the set at the midpoint
    field = true;
    rootEl.classList.add('field');
    // NOT fieldTransition() here. The seam does not move until fieldResize()
    // sets its height at the swap, and on a slow first frame that can be a
    // long way after this point — arming the transition window now would let
    // it expire before the height ever changed, and the seam would jump.
    // It is armed where the height actually moves.
    // THE MENU STANDS DOWN. #nl-keys is the real menu for a keyboard and a
    // screen reader; the cells are not links, so the layer is emptied rather
    // than left announcing thirteen projects that are no longer there. The
    // button below stays focusable and becomes the way out.
    keysEl.textContent = ''; keyEls = [];
    updateFieldBtn();
    if (fieldBtn) fieldBtn.focus();
  }

  function exitField() {
    if (!field) return;
    field = false; fieldSwap = null;
    rootEl.classList.remove('field');
    fieldTransition();
    icons = savedIcons || allIcons[activeSection];
    for (const ic of icons) { ic.mix = 1; ic.target = 0; ic.still = 0; ic.stillTarget = 0; }
    buildKeys();                  // the menu comes back
    resize(true);                 // forced: the canvas must re-derive from the
                                  // icon count, not from the field
    updateFieldBtn();
    if (fieldBtn) fieldBtn.focus();
  }

  function toggleField() { field ? exitField() : enterField(); }

  // A click RESOLVES a cell: its texture becomes the geometric form while it
  // is still full noise — the same invisible exchange the section swap and
  // the window text both use — and then it settles out of the churn and
  // freezes.
  //
  // Clicking a RESOLVED cell puts it back. The texture cannot be swapped at
  // the moment of the click here, the way it can on the way in: the cell is
  // resolved, so the exchange would be plainly visible. It goes back into the
  // churn FIRST and swaps at full noise, which is why baseTex is kept and why
  // this needs the pending flag rather than being one assignment.
  function coalesce(ic) {         // out of the churn, into its shape
    ic.resolved = true;
    ic.tex = ic.shapeTex;
    ic.unswap = false;
    ic.target = 0;
    ic.stillTarget = 1;           // static, exactly like a selected icon
  }
  function dissolve(ic) {         // back into the churn
    ic.resolved = false; ic.temp = false;
    ic.target = 1;
    ic.stillTarget = 0;
    ic.unswap = true;             // texture swaps once the noise hides it
  }

  // FINDING THE NEEDLE resolves the ENTIRE field at once — for a few seconds
  // the whole array is legible, which is the only time it ever is — and then
  // everything dissolves back except the cell that was found.
  function startReveal() {
    fieldRevealT = FIELD_REVEAL;
    for (const c of fieldCells) {
      if (c.resolved) continue;
      c.temp = true;              // resolved only for this moment
      coalesce(c);
    }
  }

  function resolveCell(i) {
    const ic = fieldCells[i];
    if (!ic || fieldRevealT > 0) return;   // inert while the field is revealed
    if (ic.permanent) return;              // the found cell is not takeable back

    if (i === fieldNeedle && !fieldFound) {
      fieldFound = true;
      ic.permanent = true;
      const at = fieldOrder.indexOf(i);
      if (at >= 0) fieldOrder.splice(at, 1);   // it no longer costs budget
      coalesce(ic);
      startReveal();
      return;
    }

    if (ic.resolved) {                     // clicking a resolved cell puts it back
      dissolve(ic);
      const at = fieldOrder.indexOf(i);
      if (at >= 0) fieldOrder.splice(at, 1);
      return;
    }

    coalesce(ic);
    fieldOrder.push(i);
    // THE BUDGET. Past the limit the OLDEST coherent cell dissolves — the
    // field forgets behind you, which is what makes it bigger than the
    // attention you are allowed to spend on it.
    while (fieldOrder.length > FIELD_BUDGET) {
      const j = fieldOrder.shift();
      if (fieldCells[j] && !fieldCells[j].permanent) dissolve(fieldCells[j]);
    }
  }

  function switchSection(n) {
    if (field) return;            // there is no section nav in the field
    if (gSwapTo !== null || !allIcons[n]) return;
    // tapping the section you are ALREADY in is not a no-op when a fixture
    // holds the window: it means "back to the work". Dismiss and stop —
    // there is no icon set to churn over.
    if (n === activeSection) {
      if (fixture !== null) { const p0 = winTarget(); fixture = null; selected = null; commit(p0); }
      return;
    }
    const prev = winTarget();
    selected = null; fixture = null;
    if (prev !== null) contactSet(false);        // close the window with the section
    for (const ic of icons) { ic.target = 1; ic.stillTarget = 0; }   // everything churns out
    armGridMotion(false);         // ...and travels while it does
    gSwapTo = n;
    updateNav();
    updateKeys();                 // the outgoing set holds no selection either
  }
  function commitSection(n) {
    activeSection = n;
    updateNav();                  // the ONE place activeSection changes, so the
                                  // one place the footer is guaranteed correct.
                                  // A deep link ('#build', no slug) lands here
                                  // and then skips commit() — nothing else on
                                  // that path re-reads the footer.
    icons = allIcons[n];
    // the new set ARRIVES fully churned and eases back to calm
    for (const ic of icons) { ic.mix = 1; ic.target = 0; ic.still = 0; ic.stillTarget = 0; }
    scrollX = 0; scrollV = 0; rowTarget = null;   // a new section starts at its
                                                  // first icon, not wherever
                                                  // the last one was left
    buildKeys();                  // new titles, new count — rebuilt, then placed
    resize(true);                 // the icon COUNT changed -> new row width,
                                  // canvas, and scroll range.
                                  // forced: this set has never been positioned
    armGridMotion(true);          // AFTER resize: the direction is radial from
                                  // the grid centre, so it needs the new set's
                                  // resting positions to exist first
    syncRoute(false);             // suppressed when a route drove us here
  }

  // pointer -> icon index, or null for gap / margin. Tested in CSS px against
  // each icon's RESTING cell box (scale 1.0). Works in either layout.
  function iconAtPointer(ev) {
    const r = canvas.getBoundingClientRect();
    const mx = (ev.clientX - r.left) / r.width  * canvasCssW;
    const my = (ev.clientY - r.top)  / r.height * canvasCssH;
    const half = cellPxCss / 2;
    for (let i = 0; i < icons.length; i++) {
      if (Math.abs(mx - icons[i].pxCx) <= half && Math.abs(my - icons[i].pxCy) <= half) return i;
    }
    return null;
  }

  // WHAT A TAP DOES — unchanged, lifted out of the pointerdown handler so the
  // drag path below can reach it too. Rest: an icon selects, empty space
  // dismisses a fixture. Active: the frozen icon or a gap exits, another icon
  // switches directly.
  function selectAt(hit) {
    if (selected === null) {                    // REST (or a fixture is open):
      if (hit !== null) setSelected(hit);       // an icon selects; empty space
      else if (fixture !== null) setSelected(null);   // a gap dismisses a fixture
      return;
    }
    if (hit === null || hit === selected) {     // ACTIVE: frozen icon or gap exits...
      setSelected(null);
      return;
    }
    setSelected(hit);                           // ...another icon switches directly
  }

  // TAP vs DRAG. One pointer does both, and the split is decided on RELEASE:
  // under ROW_TAP_SLOP of travel it was a tap, over it was a swipe. Deciding on
  // PRESS — which is what this did, and still does when the row fits and there
  // is nothing to scroll — would open a project every time a swipe happened to
  // start on an icon, which is most of the time.
  let dragId = null, dragMoved = 0, dragX0 = 0, dragY0 = 0;
  let dragScroll0 = 0, dragLastX = 0, dragLastT = 0;

  canvas.addEventListener('pointerdown', (ev) => {
    // IN THE FIELD a click is not navigation — there is nothing to navigate
    // to. It resolves the cell under the pointer and nothing else. The hit
    // test is the same one the menu uses, against the same resting cell boxes.
    // Checked FIRST: the field has no row to drag and no selection to make.
    if (field) {
      if (fieldSwap !== null) return;           // still churning over
      const c = iconAtPointer(ev);
      if (c !== null) resolveCell(c);
      return;
    }
    if (gSwapTo !== null) return;               // inert while the grid swaps over
    if (fixture === 'contact') return;          // CONTACT LOCK: only the x exits
    if (!rowScrolls) { selectAt(iconAtPointer(ev)); return; }   // nothing to scroll
    dragId = ev.pointerId;
    dragMoved = 0;
    dragX0 = dragLastX = ev.clientX; dragY0 = ev.clientY;
    dragScroll0 = scrollX;
    scrollV = 0; rowTarget = null;              // touching it stops it dead —
                                                // catching a moving row is how
                                                // a scroll is expected to work
    dragLastT = performance.now();
    canvas.classList.add('dragging');
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}   // a finger
                                                // that leaves the canvas keeps
                                                // driving the row
  });

  canvas.addEventListener('pointermove', (ev) => {
    if (dragId === null || ev.pointerId !== dragId) return;
    const dx = ev.clientX - dragX0;
    dragMoved = Math.max(dragMoved, Math.abs(dx), Math.abs(ev.clientY - dragY0));

    // The row follows the finger 1:1 in range, and at ROW_RUBBER past either
    // end — that resistance is what tells a thumb it has reached the end.
    // pointerup springs the overshoot back.
    let t = dragScroll0 - dx;
    if (t < 0) t *= ROW_RUBBER;
    else if (t > scrollMax) t = scrollMax + (t - scrollMax) * ROW_RUBBER;
    scrollX = t;

    // Velocity from the LAST move only, lightly low-passed. Averaging the whole
    // gesture instead would make a slow drag that ends in a flick barely move,
    // and the flick is the part the hand meant.
    const now = performance.now(), dt = (now - dragLastT) / 1000;
    if (dt > 0.001) {
      const inst = -(ev.clientX - dragLastX) / dt;   // scrollX rises as the
                                                     // finger moves LEFT
      scrollV = scrollV * 0.2 + inst * 0.8;
      dragLastX = ev.clientX; dragLastT = now;
    }
    applyScroll();
  });

  function endDrag(ev, cancelled) {
    if (dragId === null || ev.pointerId !== dragId) return;
    dragId = null;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
    // a finger that stopped before lifting is placing the row, not throwing it
    if (performance.now() - dragLastT > ROW_STALE_MS) scrollV = 0;
    scrollV = Math.max(-ROW_MAX_V, Math.min(ROW_MAX_V, scrollV));
    // letting go while overscrolled needs no special case: stepRowScroll sees
    // the row is past an end and the same spring brings it back
    if (!cancelled && dragMoved <= ROW_TAP_SLOP) { scrollV = 0; selectAt(iconAtPointer(ev)); }
  }
  canvas.addEventListener('pointerup',     (ev) => endDrag(ev, false));
  canvas.addEventListener('pointercancel', (ev) => endDrag(ev, true));
