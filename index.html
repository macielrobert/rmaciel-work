  // column count, which in one row means "jump to the end".
  let COLS = 4;                 // set to the icon count in resize()
  const BAKE_PX = 320;          // per-icon bake resolution (crispness vs size)

  // Render resolution (supersampling). The canvas backing store is sized at this
  // multiple of CSS px. Low-DPI screens (most desktops, dpr 1) otherwise render
  // the warp soft; flooring at 2 keeps icons crisp there. High-DPI phones are
  // capped at 2 for lightness — they already looked sharp.
  const RENDER_SCALE_MIN = 2;   // floor — supersamples 1x (desktop) displays
  const RENDER_SCALE_MAX = 2;   // ceiling — caps cost on 2x/3x phones

  // transition timing (asymmetric: snap on, ease off)
  const ON_TIME  = 0.12;        // seconds, off -> on
  const OFF_TIME = 0.80;        // seconds, on  -> off

  // the contact text settles slower than the grid: its close (window -> about)
  // runs at 2x the icon OFF_TIME. Opening still shares ON_TIME.
  const CONTACT_OFF_TIME = OFF_TIME * 2;   // 1.60s

  // TEXT CHURN — OFF. The window/about swap used to cycle every character
  // through a pool of ASCII glyphs on the way past, the DOM twin of the noise
  // the icons churn in. It read as a screen effect from another decade rather
  // than as this site's own material, so it is switched off at the knob rather
  // than deleted: spanify() still runs, the spans and their thresholds are
  // still there, and flipping this back to true restores it with no other
  // edit. Everything else the swap does — the timing, the hard cut, the icon
  // churn underneath it — is untouched.
  //
  // Turning it off changes WHERE the cut lands; see applyContact.
  const TEXT_CHURN = false;

  // GRID REORGANISATION (see NOTES-GRID-MOTION.md). A section switch displaces
  // every icon while it is churned, so the grid ARRIVES SOMEWHERE rather than
  // exchanging contents inside a fixed lattice. Position rides the same
  // asymmetric clock as the churn: out on ON_TIME, back on OFF_TIME.
  //
  // Amplitude is in CELL WIDTHS, not pixels. That is what makes a resize
  // mid-flight harmless — the offset rescales with the cell instead of being
  // a stale pixel count (hazard 2 in the note).
  //
  // THE CEILING ON MOVE_AMP IS DERIVED, NOT TASTE. The canvas hugs the grid
  // with exactly ONE margin outside it, and that margin is MARGIN_RATIO of a
  // pitch while a cell is (1 - GAP_RATIO) of a pitch. So the headroom before an
  // icon runs off the canvas edge is:
  //
  //     MARGIN_RATIO / (1 - GAP_RATIO)  =  0.20 / 0.80  =  0.25 cells
  //
  // in EVERY direction and at EVERY size — when the GRID_MAX_FRAC cap shrinks
  // the canvas it scales pitch, cell and margin together, so the ratio is
  // invariant. That is the second reason amplitude is in cell widths rather
  // than pixels: the limit travels with it.
  //
  // Measured: at 0.55 the icons clipped hard against the canvas edge at the
  // peak of the churn. 0.22 sits just inside the headroom. Going meaningfully
  // further needs either a per-icon clamp or a canvas with room to breathe —
  // a real input to the arrangement design, recorded in NOTES-GRID-MOTION.md.
  //
  // Motion changes WHERE, never HOW BIG — the taskbar rule is untouched.
  const MOVE_AMP     = 0.22;    // peak displacement, in cell widths (max 0.25)
  const MOVE_STAGGER = 0.22;    // seconds — total spread of the RETURN only
  const MOVE_JITTER  = 0.9;     // radians of scatter off the radial direction

  // OFF BY DEFAULT — add ?motion to the URL to enable it, the same testing
  // idiom as ?nogl. The mechanism is finished and the hazards are handled,
  // but the ARRANGEMENT is not designed: every icon currently returns to the
  // cell it left, so this is motion, not reorganisation.
  //
  // Judged in the preview and it made the site worse, which is the correct
  // outcome for a placeholder rather than a surprise. Two reasons, and the
  // first is the one that was actually felt:
  //
  //   1. Motion forces the input lock, and the lock is the real cost — the
  //      grid stops accepting taps for ~0.92s after a section switch instead
  //      of 0.12s. Paying that for a transition that gains nothing is a
  //      straight regression.
  //   2. Wiggling outward and returning home is not a weak version of a
  //      rearrangement, it is a DIFFERENT motion. Icons arriving at different
  //      cells is the thing; no amount of tuning this gets there.
  //
  // One flag switches off the displacement AND the lock, because the lock
  // only ever arms from armGridMotion(). Turn it on when step 4 exists.
  const GRID_MOTION = /[?&#]motion\b/.test(location.search + location.hash);

  // ------------------------------------------------------------- the field
  // The desktop-only interaction that is NOT a container for portfolio
  // content. See NOTES-ICON-FIELD.md. The seam rises off the top, the icons
  // follow it up and multiply into a field of churning shapes that are no
  // longer links, and a click resolves one into a geometric form.
  //
  // PROPORTIONS ARE HELD, COUNT IS DERIVED — the taskbar rule, unchanged.
  // Same fixed pitch as the menu; COLS *and* ROWS both come from the viewport
  // rather than from the icon count. That inversion is the whole layout
  // difference: the menu asks "how do N icons fit?", the field asks "how many
  // cells fit on this screen?" (~300 on a 14in laptop, ~840 at 2560 wide).
  const FIELD_RISE   = 900;     // ms for the seam to travel off the top
  const FIELD_MIN_W  = 900;     // px — below this the field is not offered
  const FIELD_SWAP   = 0.14;    // seconds — icons are fully churned by here,
                                // so the cell set is exchanged noise-to-noise,
                                // the same invisible cut used everywhere else

  // THE EXERCISE. Without a limit the field has no stakes: ~300 cells, free
  // clicks, and you simply resolve all of them. The budget is what makes it
  // an exercise rather than a toy — and it does not break the site's central
  // rule, it GENERALISES it. The portfolio says exactly ONE thing is coherent
  // at a time; the field says exactly twelve. Same grammar, different number.
  //
  // The consequence is the good part: the field is larger than the window of
  // attention you are allowed, so it forgets behind you as you move across
  // it, and searching it becomes a real activity.
  const FIELD_BUDGET = 12;      // cells that may be coherent at once

  // THE NEEDLE. One cell churns slightly calmer than the rest — lower
  // amplitude, slower evolution. It is findable BY LOOKING, which is the
  // whole point: the site's thesis is that noise resolves into form under
  // attention, so its one interactive piece should reward attention rather
  // than exhaustive clicking. Resolve it and it is exempt from the budget
  // and never dissolves — the single permanent mark on a surface that
  // forgets everything else.
  //
  // Both knobs are deliberately subtle. Raise them if it proves too hard to
  // spot; the failure mode to avoid is a cell that announces itself.
  const FIELD_CALM_AMP = 0.30;  // fraction of churn amplitude removed
  const FIELD_CALM_SPD = 0.50;  // fraction of churn speed removed
  const FIELD_REVEAL   = 2.6;   // seconds the whole field stays resolved

  // the one effect, parameterised. off = breathe, on = degrade.
  // amp is in UV units (fraction of an icon). these are the knobs to taste.
  // AMP_OFF is 0: THE RESTING GRID DOES NOT MOVE. It used to breathe at 0.018,
  // which read as a page that had not finished loading rather than as a page at
  // rest. Only SPEED_OFF stays non-zero — amplitude 0 makes it invisible, but
  // it keeps each icon's phase clock running, so churn starts from a spread of
  // phases instead of every icon flinching in unison.
  const AMP_OFF  = 0.0,   AMP_ON  = 0.38;   // displacement magnitude
  const FREQ_OFF = 1.6,   FREQ_ON = 5.5;    // noise frequency across the icon
  const SPEED_OFF= 0.18,  SPEED_ON= 0.95;   // noise evolution (per second)

  // --------------------------------------------------------- layout knobs
  // Expressed relative to the cell PITCH (cell + gap), not to the canvas, so
  // cells stay square and gaps stay uniform in BOTH orientations.
  const GAP_RATIO    = 0.20;      // gap as a fraction of one pitch
  const MARGIN_RATIO = GAP_RATIO; // outer padding EQUALS the icon gap — one
                                  // spacing value everywhere (also feeds --nl-m)

  // THE TASKBAR RULE. The icon cell is a FIXED size in CSS px — like an OS
  // taskbar, it does not grow because the window or monitor did, and it does
  // not shrink to make a long list fit either.
  //
  // THE MENU IS ONE ROW, AT EVERY WIDTH. Overflow is solved by SCROLLING the
  // row, not by wrapping it. Narrow viewports used to gain rows instead (390px
  // portrait was 6 x 3), and that was wrong twice over: three rows of icons ate
  // a third of a phone screen for navigation, and the seam — which follows the
  // menu — jumped every time the row count changed. Wrapping also reads badly
  // at this size, because rows two and three look like a second, lesser menu
  // when they are the same menu. So the row keeps its size and gains a swipe.
  // 50 reproduces the reference phone layout exactly.
  // Accessibility comes free: CSS px track browser zoom and OS display
  // scaling, so user-level size preferences scale the icons; raw window
  // real estate never does.
  const CELL_PX = 50;

  // TWO SECTION NAVS, ONE FILE: the flat row of labels and the vertical
  // three-slot wheel, which holds any number of sections, three in view.
  // wantWheel() picks, at parse time so the first paint is already right, and
  // again on every resize, since a phone that loads in landscape can rotate
  // into portrait. The wheel is shown when any of three things holds:
  //
  //   ?wheel — pinned at every width, the testing idiom of ?nogl and ?motion.
  //     location.search only, not the hash: a project slug called "wheel"
  //     would otherwise turn it on.
  //   A PHONE WITH MORE THAN THREE SECTIONS (Robert, 2026-10-10: "wheel on
  //     phones"). The phone row was drawn for ALL + three sections + CONTACT
  //     and ABOUT. A fourth leaves it no room to breathe: measured with
  //     SYSTEMS, it fit a 375px phone by 9px and a 430px one by 0. A test
  //     that close flips with a pixel of font metrics, and the page would load
  //     as one footer and settle as the other; a count does not move. Phone =
  //     the strip's own narrow rule, max-width 500px, where it is already one
  //     centred run rather than two ends.
  //   THE FLAT ROW DOES NOT FIT, anywhere — the net under every other width,
  //     for the day there are six sections and a 600px window (flatFits()).
  const SEC_WHEEL_PINNED = /[?&]wheel\b/.test(location.search);
  const PHONE_MQ = '(max-width: 500px)';
  const PHONE_SECTIONS = 3;
  let secWheel = false;

  // Strip reserved below the grid for the footer. The canvas sits flush on
  // top of it. 52 holds a single line of 11px type; the wheel is three slots
  // (3 * --sec-h = 48) plus the 20px the strip already stood off the bottom,
  // so 72 with the same few px of slack. THE SEAM MOVES WITH IT — the grid
  // half is canvas + this — which is the price of the wheel, and the reason
  // the flat row does not pay it. A LET, because the rendering can change
  // with the width; setWheel() is the only thing that writes it.
  let FOOTER_RESERVE = 52;      // px

  // Does the flat row fit? Its labels' own widths against the strip's inner
  // width, measured with the wheel class off for the length of the call
  // (synchronous, so nothing is painted in between). The labels do not wrap
  // (white-space: nowrap), so each is laid out at its full width either way.
  // Before the typeface has loaded this measures the fallback face; boot()
  // asks again once it has.
  function flatFits() {
    const root = document.getElementById('noiselab');
    const fns  = document.getElementById('nl-fns');
    const had  = root.classList.contains('wheel');
    if (had) root.classList.remove('wheel');
    const cs   = getComputedStyle(fns);
    const room = fns.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    let need = 0;
    for (const el of fns.children) need += el.offsetWidth;   // display:none is 0
    if (had) root.classList.add('wheel');
    return need <= room;
  }
  function wantWheel() {
    return SEC_WHEEL_PINNED
      || (matchMedia(PHONE_MQ).matches && CONTENT.sections.length > PHONE_SECTIONS)
      || !flatFits();
  }
  // true when the rendering changed, so a caller can follow it up
  function setWheel(on) {
    if (on === secWheel) return false;
    secWheel = on;
    document.getElementById('noiselab').classList.toggle('wheel', on);
    FOOTER_RESERVE = on ? 72 : 52;
    return true;
  }

  // LAST-RESORT cap: the grid half (canvas + footer reserve) may take at most
  // this fraction of the page, so the contact half always keeps working room.
  // With fixed cells this should rarely bite (very short viewports, or a much
  // longer project list); when it does, the canvas shrinks uniformly — the
  // one case where icons give up their fixed size rather than evict the
  // content half.
  const GRID_MAX_FRAC = 0.60;

  // --------------------------------------------------- the resting seam
  // THE SEAM'S RESTING POSITION IS A CONSTANT, not a measurement. One row at a
  // fixed pitch means the grid half does not depend on the icon count, on the
  // viewport width, or on anything boot() has to discover first — only the
  // last-resort cap above can move it, and that needs a viewport under ~210px
  // tall. resize() derives the same two numbers from the same knobs, so they
  // are named here once and read in both places rather than written twice.
  const ROW_PITCH_PX = CELL_PX / (1 - GAP_RATIO);                          // 62.5
  const ROW_CANVAS_H = ROW_PITCH_PX * (1 - GAP_RATIO + 2 * MARGIN_RATIO);  // 75

  // ...AND IT IS PLACED BEFORE THE FIRST PAINT, not by boot(). boot() is
  // deliberately held behind two rAFs so the shell paints immediately, which
  // meant the shell painted with #nl-grid at its CSS fallback of 50%: the
  // first thing a visitor saw was the seam lying across the middle of the
  // screen, then jumping up to the menu two frames later. Nothing about that
  // read as intentional. Same knobs and the same cap resize() will apply, run
  // at parse time — so when resize() arrives at this number it changes
  // nothing. Read at parse time for the reason ?wheel is: the element has to
  // be right before the first paint, not two frames after it.
  // Called below, after footerSections(): the wheel decision it depends on
  // needs the section labels in the strip, and those come from CONTENT.
  function placeSeam() {
    const rootEl = document.getElementById('noiselab');   // 100dvh: laid out
    const gridEl = document.getElementById('nl-grid');    // by the time we run
    const maxCh  = rootEl.getBoundingClientRect().height * GRID_MAX_FRAC - FOOTER_RESERVE;
    const ch     = (maxCh > 0 && ROW_CANVAS_H > maxCh) ? maxCh : ROW_CANVAS_H;
    gridEl.style.paddingBottom = FOOTER_RESERVE + 'px';   // single source: the JS knob
    gridEl.style.height = (ch + FOOTER_RESERVE).toFixed(1) + 'px';
  }

  // ------------------------------------------------------- menu row feel
  // Knobs for the swipeable menu row (armed only while it overflows — see
  // relayout). Every rate is per SECOND and integrated against real dt, so the
  // gesture feels identical on a 60Hz phone and a 120Hz one.
  //
  // NAMING: this file already had a "carousel" — the image strip pinned at
  // the foot of the window (#nl-car, --car-h). That one is unrelated. This is
  // the MENU ROW, and everything belonging to it is ROW_ / row.
  // THE GLIDE IS A BEARING, NOT A BRAKE. Friction is the e-folds per second of
  // the coast: bigger stops sooner. iOS UIScrollView decelerates at about
  // 2.0/s (its "normal" rate is 0.998 per millisecond, and ln(0.998) * 1000 is
  // -2.0), so this is a little freer than the platform the phone came with.
  // It started at 4.6 and that read as drag, not as a bearing — a flick died
  // in under a second. At 1.6 a firm flick coasts ~1250px, which on a phone is
  // the whole row plus slack. The row is a RING now, so a flick that long no
  // longer arrives anywhere: it runs on through the next section, which is the
  // point of making it endless.
  const ROW_FRICTION = 1.6;     // glide decay: velocity e-folds this often /s
  const ROW_STOP_V   = 14;      // px/s — below this the glide is over. Low, so
                                // the coast ends by running out rather than by
                                // being switched off
  const ROW_MAX_V    = 5000;    // px/s — a flick cannot throw harder than this
  const ROW_TAP_SLOP = 8;       // px of travel still counted as a TAP, not a drag
  const ROW_STALE_MS = 90;      // finger held still this long before lifting
                                // means place, not throw: no momentum
  // THE END-OF-SCROLL BOUNCE, REASSIGNED. This spring used to catch the row at
  // the two ends of the run. An endless row has no ends, so the same spring —
  // same rate, same damping — now carries every move the row makes ON ITS OWN:
  // a footer category jump, and scroll-into-view for focus and deep links. It
  // is what the jump FEELS like, and it is the reason the jump is a jump and
  // not a cut. Damping sits just above critical (2 * sqrt(K) = 35.8), so it
  // arrives once and stops rather than ringing.
  // THE ICON ROW'S GREY is --accent-rgb at this alpha. It used to mirror the
  // stylesheet's --accent, which words shared until they got --text-2 (UX-1,
  // 2026-10-10); now only the canvas uses it, so the alpha lives here alone.
  // The canvas cannot use a CSS colour directly; the COLOUR is still read
  // from --accent-rgb, never copied.
  const ACCENT_ALPHA = 0.9;

  const ROW_SNAP_K    = 320;    // spring rate toward the target, /s^2
  const ROW_SNAP_DAMP = 36;     // damping on that spring, /s
  // HOW FAR IN FROM THE MARGIN THE ROW PARKS AN ICON. Every move the row makes
  // on its own uses it — the footer category jump and scroll-into-view alike,
  // and at both edges — because they are one problem: an icon the row has
  // deliberately brought to an edge must be legible when it gets there.
  //
  // The margin alone was the right landing when the edge was a hard one. The
  // edge is a one-pitch dissolve now and the margin lands inside it. The
  // arithmetic, at CELL_PX 50 / BAKE_FILL 0.64 / pitch 62.5: the art sits 9px
  // in from its cell, the mask reaches full ink at one pitch, so the leading
  // glyph's alpha is (margin + inset + 9) / 62.5 —
  //
  //     inset  0   art at 21.5px   34%
  //     inset 20   art at 41.5px   66%
  //     inset 30   art at 51.5px   82%
  //     inset 41   art at 62.5px  100%     <- the first value that guarantees it
  //     inset 50   art at 71.5px  100%     <- here
  //
  // THE INDENT IS THE POINT, not the price. Past 41 the snapped icon is fully
  // resolved and the extra travel buys something: at 50 the icon BEFORE it sits
  // in the ramp at roughly 14% to 66% across its width — half-there, plainly
  // continuing off the edge. So the landing reads as a heading with the
  // previous section trailing away behind it, rather than as a row that
  // happens to start here. It is the same thing the faded edge already says,
  // said about one specific icon.
  //
  // NOT DERIVED FROM THE PITCH, deliberately — though at the default pitch it
  // lands on exactly one cell. It could be computed (the clearance is
  // pitch - margin - the art's own inset) but that moves the landing every time
  // a short viewport shrinks the pitch, and this is a number chosen by looking
  // at it. A shrunken pitch only ever indents further and stays fully inked.
  const ROW_SNAP_INSET = 50;    // px
  // The dissolve at a scrollable edge is ONE PITCH wide, and that is a
  // guarantee, not a taste. A mask can only dissolve ink that is actually
  // under it, and this row is mostly empty: between the ink of one icon and
  // the ink of the next lies a gap plus both icons' transparent margins —
  // 12.5 + 9 + 9 = 30.5px of nothing at CELL_PX 50. A 32px ramp, which is what
  // this was, can therefore land almost entirely in that void: at a 396px
  // viewport it covered 2px of one icon's trailing edge at 6% alpha and the
  // fade was invisible. Whether the affordance appeared at all depended on
  // where the window edge happened to fall.
  //
  // One pitch cannot land in the void, because the void is shorter than a
  // pitch: any pitch-wide window contains one whole cell's worth of art. Worst
  // case — the void sitting at the very edge — the nearest icon still ramps
  // from 0 to about 50% across its own width, so it reads as dissolving rather
  // than as ending. It is derived in relayout() from the pitch actually in use,
  // so it follows the cells if GRID_MAX_FRAC ever shrinks them.
  let rowFadePx = 0;            // px — set in relayout()

  // Baked content fill: source art occupies this fraction of its tile,
  // leaving a transparent ring for the warp to spill into.
  const BAKE_FILL = 0.64;       // bumped from 0.55 — larger, sharper icons per cell

  // ------------------------------------------------------- dynamic shrink
  // As noise activates, each icon scales down using the SAME eased value
  // that drives the warp (so it shrinks at the same time and rate). At
  // SCALE_ON === BAKE_FILL, a fully-warped icon — whose content can reach
  // its quad edge — lands no further out than the calm icon's silhouette
  // did. i.e. the gap you see in the OFF state is the gap you keep in the
  // ON state. Nudge SCALE_ON up toward ~0.65 to let a little warp peek past.
  const SCALE_OFF = 1.0;        // footprint-filling at rest
  const SCALE_ON  = BAKE_FILL;  // tracks BAKE_FILL — the buffer-preserving value

  // ------------------------------------------------------- placeholder art
  // Test icon sources — each is referenced by ONE entry below; swapping an
  // entry's icon for a client mark is a data edit. The bake step makes the
  // source kind irrelevant to everything downstream.
  const svgURL = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  const SVG_CIRCLE = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff"/></svg>`;
  const SVG_TRI    = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><polygon points="50,8 92,86 8,86" fill="#fff"/></svg>`;
  const SVG_RING   = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="12"/></svg>`;
  const SVG_SQUARE = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect x="16" y="16" width="68" height="68" fill="#fff"/></svg>`;
  const SVG_DIAMOND= `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><polygon points="50,6 94,50 50,94 6,50" fill="#fff"/></svg>`;

  function makeTestPNG(kind) {           // genuine image/png, decoded via <img>
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.clearRect(0, 0, S, S);
    x.fillStyle = '#fff'; x.strokeStyle = '#fff';
    if (kind === 'blob') {
      const g = x.createRadialGradient(S/2, S/2, 3, S/2, S/2, S*0.5);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(S/2, S/2, S*0.5, 0, 7); x.fill();
    } else if (kind === 'squares') {
      x.lineWidth = 8;
      for (let r = S*0.46; r > 6; r -= 18) x.strokeRect(S/2 - r, S/2 - r, 2*r, 2*r);
    } else if (kind === 'rings') {
      x.lineWidth = 7;
      for (let r = S*0.42; r > 8; r -= 16) { x.beginPath(); x.arc(S/2, S/2, r, 0, 7); x.stroke(); }
    } else if (kind === 'bars') {
      const n = 5, bw = S*0.1, gp = (S - n*bw)/(n+1);
      for (let i = 0; i < n; i++) x.fillRect(gp + i*(bw+gp), S*0.18, bw, S*0.64);
    } else { // dots
      const n = 6, gap = S/(n+1), rad = gap*0.28;
      for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
        x.beginPath(); x.arc(i*gap, j*gap, rad, 0, 7); x.fill();
      }
    }
    return c.toDataURL('image/png');
  }

  // ratio-true grey placeholder image — stands in for real project imagery
  // in both the thumbs and the expanded view (one src, two uses)
  const PH = (r) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${r[0] * 120}" height="${r[1] * 120}"><rect width="100%" height="100%" fill="#808080"/></svg>`);

  // Placeholder image records for one entry: 4 DISTINCT aspect ratios from a
  // shuffle SEEDED by the entry index (mulberry32) — every entry gets its own
  // mix, identical across loads. Filler captions on images 1-3; the last
  // stays captionless to demonstrate the empty state. Real records replace
  // these wholesale: { src, caption, alt, ratio:[w,h] } — ratio optional
  // (stored = stable layout; omitted = measured on decode, settles once).
  const RATIOS = [[4,3],[3,4],[16,9],[2,3],[3,2],[1,1],[9,16]];
  const seededRnd = (seed) => () => {           // mulberry32 — tiny seeded PRNG
    seed = (seed + 0x6D2B79F5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
  // Placeholder wordmark: abstract letterform blocks at roughly 4:1, seeded
  // by entry index so each project reads as a different mark and is identical
  // across loads. White on transparent — the mask only reads alpha. Drawn as
  // shapes, never SVG <text>: rasterising text-in-SVG is the known-bad path
  // in this codebase (same reason the icon bake draws glyphs to canvas).
  function placeholderWordmark(i, title) {
    const rnd = seededRnd(i * 7919 + 13);
    const W = 400, H = 100;
    let bars = '', x = 14;
    while (x < W - 30) {
      const w = 18 + Math.round(rnd() * 44);
      if (x + w > W - 14) break;
      const h = 34 + Math.round(rnd() * 30);
      bars += `<rect x="${x}" y="${((H - h) / 2).toFixed(1)}" width="${w}" height="${h}" rx="3" fill="#fff"/>`;
      x += w + 11;
    }
    return {
      src: svgURL(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg>`),
      alt: title + ' — placeholder wordmark',
    };
  }

  function placeholderImages(i, hd, count) {
    const rnd = seededRnd(i * 1013 + 7);
    const pool = RATIOS.slice();                // per-entry deterministic shuffle
    for (let j = pool.length - 1; j > 0; j--) {
      const q = (rnd() * (j + 1)) | 0;
      [pool[j], pool[q]] = [pool[q], pool[j]];
    }
    const n = count || 4;
    while (pool.length < n) pool.push(RATIOS[(rnd() * RATIOS.length) | 0]);
    return pool.slice(0, n).map((r, k) => ({
      src: PH(r),
      ratio: r,                                 // always present -> no probe, no measuring fetch
      caption: k < 3 ? `${hd} — detail 0${k + 1}, placeholder caption.` : '',   // last ones bare: the empty state
      alt: `${hd} — placeholder image ${k + 1}`,
    }));
  }

  /* =======================================================================
     EDITABLE CONTENT  —  edit the text between the quotes; leave the rest.
     =======================================================================
     WHERE THIS LIVES, AND WHY (inline, not a separate content file):
       - This site is ONE file with zero outside dependencies. A separate
         content file would have to be FETCHED when the page loads, and
         browsers BLOCK fetching a local file when you just open the HTML
         directly — you'd need a running web server just to preview a wording
         change. Inline keeps it "double-click to preview, drag-to-deploy,"
         and keeps the self-contained character of the piece.
       - The trade-off of inline: the words share a file with the code. THIS
         BLOCK is the answer to that — every editable word is gathered HERE,
         in one place, labelled. Nothing below this block needs touching to
         change copy.
       - This block is ALSO the exact shape a CMS emits later. When you add
         one, it writes to this structure and the code below does not change.
         That prediction held: Decap plugged in without changing a line below,
         and so did Keystatic when it replaced Decap. So choosing inline now costs nothing later — the only
         thing that ever moves is WHERE these bytes sit, never their shape.
         The one thing that reads this block (buildData, just under it) is the
         seam a CMS plugs into.

     THE FIELDS (same for a project and for ABOUT):
       title    — the header, shown in grey
       details  — the three short lines under it (material / edition / year…)
       summary  — the description. A single string, OR a LIST of strings for
                  multi-paragraph copy. In the 'grid' layout a long body is
                  clamped and opened by a caret; elsewhere it simply runs on.
       icon     — placeholder art for now; becomes a client mark later. You
                  won't edit these until real marks exist. 'placeholder' art
                  is generated; 'glyph' is a single typed character.
       images   — OPTIONAL. Leave it out for no image strip (ABOUT has none).
                  Omitting it auto-fills placeholders so layout can be judged.
                  Each image is one record:

                    src     ONE uploaded file, full size. You do NOT export or
                            store small versions — the host resizes on demand
                            (see IMAGE_TRANSFORM below the CONTENT block).
                    ratio   [width, height] of that file, e.g. [4,3] or
                            [1600,1200]. NOT optional in practice: without it
                            the page has to DOWNLOAD every image on the site
                            at load just to measure its shape, which throws
                            away the on-demand loading everything else relies
                            on. Any CMS knows the dimensions of what it
                            stored — have it write them here.
                    caption Optional. Shown under the expanded image; omit it
                            and no caption line appears.
                    alt     Screen-reader description of the image.
                    thumb   Optional override. Only needed if you ever want a
                            hand-picked crop in the strip instead of the
                            automatic resize of `src`.
       layout   — OPTIONAL. Which window arrangement this project uses, by
                  name: 'standard' (default), 'grid', or 'text'. A section can
                  set its own default via `layout` on the section; a project's
                  own value always wins. Unknown names fall back to standard.
                    standard  carousel strip at the foot, wordmark beside it
                    grid      fixed 16:9 cells, column count adapts to width;
                              text above, grid fills the rest and scrolls
                    text      copy only, full width
       expand   — OPTIONAL true/false. Whether tapping an image opens it full
                  size. Defaults to TRUE on 'standard' and FALSE on 'grid' —
                  in a grid the pictures are usually the presentation, not a
                  set of doors. Set it either way to override.
       wordmark — OPTIONAL. If OMITTED, the project's FIRST image is used as a
                  hero in the same slot instead (shown as a picture, not an
                  ink silhouette). Client work supplies a mark; self-authored
                  work usually will not, and gets the hero.
                  When supplied: the spelled-out brand mark, shown centered in the
                  open area on WIDE screens only (its compact counterpart is
                  the `icon` in the grid). Like the icons, it is drawn as a
                  SILHOUETTE in the site's ink — supply transparent-background
                  art with real counterforms; brand colors are discarded.
                  Omitting it auto-fills a placeholder so layout can be seen.

     SECTIONS: the work is split into BUILD / DESIGN / ART / ... — as many as
     content/sections/ holds (build.js writes only the ones with published
     work). Each is its own list with its own icons. Order of `sections` =
     order of the footer labels; order of a section's `projects` = order in
     the grid. A new section is a file in content/sections/, from Harvest or
     Keystatic: its footer label and wheel slot are built from this list.
     ABOUT and CONTACT are fixtures ("chrome"): they belong to no section and
     sit apart from the lists entirely.
     ======================================================================= */
  /* CONTENT:START */
  /* EMPTY BY DESIGN. build.js writes the CONTENT object here at deploy,
     assembled from content/*.json (the CMS is the source of truth).

     CONSEQUENCE: opening THIS file directly no longer previews the site —
     there is no CONTENT to build from, so boot() throws. Preview the deploy
     preview URL instead, or run `node build.js` and open dist/index.html.
     That is the one thing the CMS cost, and it is recorded in AGENTS.md.

     Do not hand-edit between the markers: the next build overwrites it. */
  /* CONTENT:END */

  // THE FOOTER'S SECTION LABELS, from CONTENT, at parse time. They were four
  // spans in the template while the sections were code; written here, before
  // the first paint, a new section's label is simply there, and the flat row
  // is complete when flatFits() measures it. Same shape as the ALL span they
  // follow: a button role, a tab stop, and the section id as data-nav.
  (function footerSections() {
    const sep = document.querySelector('#nl-fns > .sep');
    for (const sec of CONTENT.sections) {
      const el = document.createElement('span');
      el.className = 'sec';
      el.setAttribute('role', 'button');
      el.tabIndex = 0;
      el.setAttribute('data-nav', sec.id);
      el.textContent = sec.label;
      sep.before(el);
    }
  })();
  // --nl-m now rather than at boot(): the strip's padding derives from it, and
  // the fit test has to measure the strip at its real width, not at the 24px
  // the CSS falls back to. Same value resize() will write (pitch * margin).
  document.getElementById('noiselab').style.setProperty('--nl-m',
    (ROW_PITCH_PX * MARGIN_RATIO).toFixed(1) + 'px');
  setWheel(wantWheel());
  placeSeam();

  /* ------------------------------------------------- host image transform
     THE DEPLOY SEAM — wired to Netlify, which is the host.

     Netlify's Image CDN resizes on demand from the single uploaded file: ask
     for the same photo at 480px and it generates, caches at the edge, and
     serves it. That is what keeps ONE upload per image and NO size variants
     to manage locally — the `thumb` field stays empty forever.

     WHY IT WAS TURNED ON. It was `null` while every image was an inline
     placeholder with nothing to resize. The first real photographs arrived as
     camera originals — 4928x3264, 6.6 MB each — and `null` meant the carousel
     strip downloaded 20 MB of them to paint three 240px boxes. That is the
     three-to-five second stall on a phone, and it is the whole of it.

     TWO PARAMETERS, DELIBERATELY:
       url   the source path, encoded. Local files in the publish directory
             need no allowlist; only REMOTE sources do (netlify.toml
             [images] remote_images), and there are none.
       w     the width. Height follows the source ratio; no `fit` needed,
             because nothing here crops through the CDN — the thumb crops in
             CSS (background-size: cover) and the expand view contains.

     NO `fm`. Omitted on purpose: with no format asked for, Netlify reads the
     browser's Accept header and returns AVIF or WebP to those that take them
     and the source format to those that do not. Naming `fm=webp` would pin
     every visitor to the worse of the two. `q` is likewise left at its
     default of 75, which is the right place to tune if a photograph ever
     shows artefacts — not the width.

     Cloudflare, if the host ever changes:
       (src, w) => `/cdn-cgi/image/width=${w},format=auto/${src}` */
  // Valid layout names. Add here AND add matching `.l-<name>` CSS rules.
  // 'form' is not selectable from CONTENT — the contact form is hand-built and
  // assigns it directly — but it lives here so applyLayout() clears it like
  // any other layout class.
  const LAYOUTS = ['standard', 'text', 'grid', 'form'];
  const DEFAULT_LAYOUT = 'standard';

  const IMAGE_TRANSFORM = (src, w) =>
    `/.netlify/images?url=${encodeURIComponent(src).replace(/%2F/g, '/')}&w=${w}`;
  /* The un-escaping of the slashes is not cosmetic. encodeURIComponent alone
     is correct — a query value is decoded before it is read — but it turns a
     path into %2Fimages%2F..., which is NOT the shape Netlify's own examples
     take, and an untestable difference in the one URL the whole strip depends
     on is not worth the tidiness. Putting the slashes back leaves every other
     escape in place, so a filename with a space, an ampersand or a hash still
     survives. */

  /* THE ONE PLACE THE TRANSFORM IS SWITCHED OFF: there is no CDN on a local
     machine. `file://` and localhost get the originals, which is slow and
     correct — a preview that 404s every image is worse than a preview that
     loads a big one. Checked against the PROTOCOL and HOSTNAME rather than
     against a deploy domain, because the domain is about to change: a test
     for `netlify.app` would silently turn the CDN off again the day
     rmaciel.work points here. */
  const HAS_IMAGE_CDN = location.protocol !== 'file:'
    && !/^(localhost|127\.|\[?::1\]?$)/.test(location.hostname);

  /* --------------------------------------------------- how wide to ask for

     THE THUMB MEASURES ITSELF. It used to be a constant, and a constant is a
     second copy of a number CSS already owns: the strip's height is --car-h,
     the grid's cell is --g-cell, and a portrait phone overrides both. Change
     any one of those and a hard-coded width does not follow — the thumbnails
     go quietly soft, months later, with nothing to connect the two edits.
     fitThumbs() reads the box off the rendered element instead, so the CSS
     stays the single source of truth for how big a thumbnail is.

     A LADDER, NOT THE EXACT NUMBER. Asking for the measured width to the
     pixel would mint a separate URL per viewport — 294, 295, 297 — and each
     distinct URL is its own resize and its own edge-cache entry, so almost
     every visitor would pay for a cold one. Rounding UP to a rung means a
     handful of URLs serve every screen there is, and the cache stays warm.
     The rungs are wide apart on purpose: a photograph does not reward
     precision here, and the whole point is that a near-miss costs nothing.

     DPR IS CAPPED AT 2. The phone is 3x, and a 3x request is ~2.2x the bytes
     of a 2x one for a difference nobody has ever picked out of a photograph
     — least of all one cropped into a thumbnail that is scrolling past. This
     is the knob to raise if a thumbnail ever looks soft; the ladder and the
     measuring are not. */
  const WIDTH_STEPS = [320, 480, 640, 960, 1280, 1920, 2560];
  const DPR_CAP = 2;
  function stepFor(cssW) {
    const want = Math.ceil(cssW * Math.min(window.devicePixelRatio || 1, DPR_CAP));
    return WIDTH_STEPS.find(w => w >= want) || WIDTH_STEPS[WIDTH_STEPS.length - 1];
  }

  /* THESE THREE STAY CONSTANTS, and the difference is not inconsistency.
     A constant is safe wherever it is a CEILING the element cannot grow past;
     it is unsafe wherever the element's size is a knob. The mark and the hero
     are capped by CSS at 320 and 720 CSS px, so 2x of each is a ceiling. The
     expanded image has no width rule at all, but it can never be wider than
     the window, and the window can never be wider than the screen — 2048
     covers a 14" MacBook (~1480 device px) outright and upscales ~1.2x on a
     5K 27" (~2500), which on a photograph is invisible. The thumbnail was the
     one whose size a stylesheet edit could change, which is why it is the one
     that now measures. */
  const MARK_W   = 640;   // wordmark — capped at 320px wide by CSS, at 2x
  const HERO_W   = 1440;  // hero image — capped at 720px wide by CSS, at 2x
  const EXPAND_W = 2048;  // expanded image — see above
  const PROBE_W  = WIDTH_STEPS[0];   // only ever loaded to READ A SHAPE (the
                                     // no-ratio fallback), never to be looked at

  // any source URL -> the URL to actually load at a given display width.
  // Data URIs pass through untouched: there is no file for a CDN to fetch.
  function sized(src, w) {
    if (!src) return src;
    if (HAS_IMAGE_CDN && IMAGE_TRANSFORM && !src.startsWith('data:')) return IMAGE_TRANSFORM(src, w);
    return src;
  }
  // one image record -> the URL the STRIP should load at a given rung
  // (an explicit `thumb` in the record still wins outright: it is a hand-made
  // crop, not a resize, and no width we could ask for would reproduce it)
  function thumbURL(im, w) { return im.thumb || sized(im.src, w); }

  /* ------------------------------------------------------ loading order

     NOT AJAX. Every word and every image record is already in this file; an
     image is a plain browser request for a URL. What this section decides is
     WHEN each request goes out, and the answer is: before anyone asks.

     Each picture costs a round trip, and the first request for any one width
     also waits on the host to make that size (150–300 ms measured on the live
     site, against 20–40 ms once made). A request that starts at the tap is a
     wait the visitor watches. So there are four tiers, and none of them holds
     anything back:
       1. AT REST, after the page has loaded — every project's FIRST SCREEN
          (its hero and the thumbs that fill the strip), in row order, a few
          at a time. warmFirstViews() in boot().
       2. ON OPEN — what is on screen goes first; the rest of the strip goes
          the moment those have landed, or the moment the strip is scrolled.
          fitThumbs() below.
       3. ON PRESS — a thumb starts its full-size picture on the way DOWN; the
          tap commits on the way up.
       4. WHILE EXPANDED — the pictures one swipe away either side.

     HELD, NOT JUST REQUESTED. The host serves these with max-age=0, so the
     browser's own cache would ask again (a round trip) every time. A page
     never re-asks for a URL it already holds, so the Image objects are kept
     for the page's lifetime and every later use of the same URL — a thumb's
     background, the expanded <img> — is served from memory.

     REJECTED: lazy loading (loading="lazy", IntersectionObserver). It waits
     until a picture is nearly on screen, which is the pop-in this exists to
     prevent. The site is furniture; its mechanism should not be watched. */
  const held = new Map();     // url -> Image, kept so the bytes stay in memory
  let markLoad = null;        // the open entry's hero, while it is in tier 2
  function warm(url, pri) {
    let im = held.get(url);
    if (!im) {
      im = new Image();
      if (pri) im.fetchPriority = pri;   // a hint; ignored where unsupported
      im.done = new Promise(res => { im.onload = im.onerror = res; });
      im.src = url;
      held.set(url, im);
    }
    return im.done;
  }

  /* Measure one entry's thumbs and ask for the rung each actually needs.
     Cheap to call often, which is the point — it runs on every resize, every
     entry switch, and every expand, and does nothing at all unless a box has
     genuinely crossed onto a higher rung.

     TWO RULES:
     - A BOX OF ZERO IS SKIPPED, not treated as tiny. A hidden entry (display:
       none until it is switched to) measures zero, and painting it would put
       its images on the wire while nothing is showing them. Skipping keeps
       hidden strips off the network, which is the behaviour the strip has
       always had.
     - IT NEVER GOES DOWN. Rotating a phone back, or collapsing an expanded
       image, can leave a thumb smaller than it was a moment ago. Re-asking at
       the lower rung would spend a fresh download to end up with a WORSE
       picture, when the bigger one is already sitting in the browser cache.
       Up is a real improvement; down is never worth a request.

     AND ONE ORDER (tier 2 above). A thumb inside the strip's visible box, and
     the hero, go first; every other thumb is painted once those have landed.
     Sent together, seventy off-screen thumbs split the connection with the
     three on screen, and the part you are looking at arrives LAST. They are
     not held back for long: the strip is released in full the moment the
     first screen is in, or the moment the strip is scrolled, whichever comes
     first. */
  function fitThumbs(en) {
    if (!en || !en.thumbs || !en.images) return;
    const view = en.car.getBoundingClientRect();
    const first = markLoad ? [markLoad] : [], rest = [];
    for (let k = 0; k < en.thumbs.length; k++) {
      const ph = en.thumbs[k];
      const r = ph.getBoundingClientRect();
      if (!r.width) continue;
      const step = stepFor(r.width);
      if (step <= (ph._step || 0)) continue;
      ph._step = step;
      const url = thumbURL(en.images[k], step);
      if (r.right > view.left && r.left < view.right && r.bottom > view.top && r.top < view.bottom) {
        first.push(warm(url));
        ph.style.backgroundImage = 'url("' + url + '")';
      } else rest.push([ph, url]);
    }
    if (!rest.length) return;
    let gone = false;
    const release = () => {
      if (gone) return;
      gone = true;
      rest.forEach(([ph, url]) => { ph.style.backgroundImage = 'url("' + url + '")'; });
    };
    Promise.all(first).then(release);
    en.car.addEventListener('scroll', release, { once: true });
  }

  // ------------------------------------------------------------ data adapter
  // THE SEAM. Reads the editable CONTENT block above (authoring shape: title /
  // details / summary) and produces the internal shape the rest of the code
  // runs on (hd / lines / blurb / images). A CMS later feeds this same adapter
  // the same authoring shape — so the code below the adapter never changes.
  // Grid order = each section's `projects` order; everything downstream (the
  // per-section icon sets, window text, carousels, expand view) derives from
  // the adapter's output. ABOUT and CONTACT are fixtures with NO grid icon —
  // they live in the footer and sit at the end of the flat window list.
  // Runs LAZILY in boot(): resolving a 'placeholder'
  // icon calls makeTestPNG (canvas + toDataURL), which is too heavy for script
  // eval on mobile — it would delay first paint.
  // WHICH SECTION the grid is showing (index into CONTENT.sections). The
  // footer will drive this once switching is wired; until then it stays 0.
  // THE BAND: which section is drawn in ink, everything else in accent grey.
  // null is ALL — every icon ink — and it is where the page loads, what the
  // ALL link returns to, and what scrolling clear of a section falls back to.
  // The row shows every project at every moment now, so position alone cannot
  // say where one section ends and the next begins; this is what says it.
  // It doubles as the footer's lit label and, at rest, as the URL.
  let activeSection = null;

  // copy may be one string or a list of paragraphs — normalise to a list
  const paras = v => Array.isArray(v) ? v : [v];

  // TITLE -> URL SLUG. THE FALLBACK, NOT THE RULE — see buildData() below,
  // which prefers the slug the CMS authored. Kept for entries that carry no
  // slug of their own: ABOUT, and anything hand-written into CONTENT.
  //
  // It used to be the rule, on the reasoning that a title changes less often
  // than a position does. True, but it made a title edit silently move a URL,
  // while the CMS was promising the editor the opposite — that the slug field
  // is the permanent address. The authored slug wins now, so that promise is
  // real and titles are free to be edited. Never derived from an INDEX either
  // way: reordering a section must not break a link someone already sent.
  const slugify = s => String(s).toLowerCase()
    .replace(/['\u2018\u2019]/g, '')          // drop apostrophes rather than hyphenate
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'item';

  let DATA = null;
  function buildData() {
    // placeholder icon descriptors -> a real bakeable icon object. Real marks
    // arrive as { kind:'svg'|'png', src } and pass straight through.
    const SHAPE_SVG = { circle:SVG_CIRCLE, tri:SVG_TRI, ring:SVG_RING, square:SVG_SQUARE, diamond:SVG_DIAMOND };
    function resolveIcon(ic) {
      if (!ic || ic.kind === 'glyph' || ic.kind === 'svg' || ic.kind === 'png') return ic;
      if (ic.kind === 'placeholder') {
        return SHAPE_SVG[ic.shape]
          ? { kind:'svg', src: svgURL(SHAPE_SVG[ic.shape]) }   // one of the SVG shapes
          : { kind:'png', src: makeTestPNG(ic.shape) };        // otherwise a generated PNG
      }
      return ic;
    }
    // authoring shape -> internal shape, EVERY section. All of them are built
    // (and baked) up front: a section switch churns the grid over on the fast
    // clock and swaps at the midpoint, which leaves no room for an async bake.
    const sections = CONTENT.sections.map((sec, si) => {
      const usedSlugs = Object.create(null);   // per section: two projects can
                                               // share a title across sections
      return {
      id: sec.id, label: sec.label,
      entries: sec.projects.map((p, i) => {
        const seed = si * 100 + i;             // per-section placeholder variety
        const en = { icon: resolveIcon(p.icon), hd: p.title, lines: p.details,
                     blurb: paras(p.summary) };
        // GROUPING. `group` is a client key shared by two or more projects;
        // `groupTitle` is what the window calls that client. Both optional —
        // an ungrouped project carries neither and behaves exactly as before.
        if (p.group) { en.group = p.group; en.groupTitle = p.groupTitle || p.group; }
        // THE AUTHORED SLUG WINS. In the CMS it is the filename, which is the
        // permanent address the editor's help text promises — set once, never
        // changed. Falling back to the title keeps hand-written CONTENT and
        // any entry predating the field working unchanged.
        // The de-duplication below still stands: authored slugs are unique by
        // construction (they are filenames), but a title-derived fallback is
        // not, and two entries answering to one URL is the bug it prevents.
        let sl = p.slug || slugify(p.title);
        if (usedSlugs[sl]) { let n = 2; while (usedSlugs[sl + '-' + n]) n++; sl = sl + '-' + n; }
        usedSlugs[sl] = 1;
        en.slug = sl;
        const wantLayout = p.layout || sec.layout || DEFAULT_LAYOUT;
        en.images = (p.images && p.images.length) ? p.images
                  : placeholderImages(seed, p.title, wantLayout === 'grid' ? 12 : 4);
        // PLACEHOLDER POLICY (filler only — real content just omits the field):
        // BUILD stands in for client work, which ships a wordmark. DESIGN and
        // ART stand in for self-authored work, which does not — so they fall
        // through to the hero image and the fallback is visible there.
        en.wordmark = p.wordmark || (si === 0 ? placeholderWordmark(seed, p.title) : null);
        // project layout > section default > global default; an entry with no
        // imagery is 'text' regardless, since the other layouts need images
        const want = p.layout || sec.layout || DEFAULT_LAYOUT;
        en.layout = !en.images.length ? 'text'
                  : (LAYOUTS.indexOf(want) >= 0 ? want : DEFAULT_LAYOUT);
        // tapping a picture opens it full size? grids default to no.
        en.expand = (p.expand !== undefined) ? !!p.expand : (en.layout !== 'grid');
        return en;
      }),
    };});
    // GROUPS: two or more works under one client share ONE ICON. The first
    // in section order stays in the row and keeps the icon; the rest LEAVE
    // THE GRID and become icon-less window entries, reached by the sibling
    // row inside the window instead of by a second icon.
    //
    // WHY THIS SHAPE AND NOT A NESTED ONE. A Keystatic file gets exactly one
    // rich-text contentField, so nesting the works inside a single .mdoc
    // would leave only the first with a real body. Every project has one.
    // Flat files plus a shared key keeps one body, one image list and one
    // permanent slug per work — and the CMS never has to learn about groups.
    //
    // Non-heads land in EXTRA and are appended past the form, where the
    // window list is ALREADY longer than the icon list (ABOUT and the form
    // live there). An entry with a window and no icon is not a new idea here.
    const extra = [];
    sections.forEach(sec => {
      const head = Object.create(null);
      sec.entries = sec.entries.filter(en => {
        if (!en.group) return true;
        if (!head[en.group]) { head[en.group] = en; en.sibs = [en]; return true; }
        en.sibs = head[en.group].sibs;   // ONE array, shared by reference, so
        en.sibs.push(en);                // every member sees the same order
        extra.push(en);
        return false;
      });
    });
    // ABOUT: same shape, but a fixture and image-less (no strip -> full text).
    // Neither fixture carries an icon — both live in the footer, not the grid.
    const about = { hd: CONTENT.about.title, layout: 'text',
      lines: CONTENT.about.details, blurb: paras(CONTENT.about.summary) };
    return { sections, about, extra };
  }
  // Window entries are ONE FLAT LIST across all sections, so switching an
  // entry stays a display swap and never a rebuild:
  //   [ ...section 0, ...section 1, ...section 2, ABOUT, FORM ]
  // SECTION_OFFSET maps (section, project) -> flat index.
  let LIST = null;            // flat list feeding the window build
  let SECTION_ICONS = null;   // icon descriptors, per section (grid order)
  let SECTION_OFFSET = null;  // flat index where each section's entries start
  let ABOUT_INDEX = 0, FORM_INDEX = 0;
  let FLAT_OF = null;         // entry object -> its index in LIST
  let ROUTE_OF = null;        // 'section/slug' -> { sel, sub } — see below

  // ------------------------------------------------------------------ boot
  // EVERYTHING below runs inside boot(), deferred until after the black shell
  // has PAINTED (see the double-rAF at the bottom). WebGL context creation,
  // shader compile/link, and the PNG test-icon bakes are all synchronous and,
  // run at script eval, can hold up first paint for the whole init on mobile —
  // which reads as the host background (grey) instead of this page's black.
  function boot() {
  DATA = buildData();
  SECTION_ICONS  = DATA.sections.map(s => s.entries.map(e => e.icon));
  SECTION_OFFSET = [];
  LIST = [];
  DATA.sections.forEach(sec => { SECTION_OFFSET.push(LIST.length); LIST = LIST.concat(sec.entries); });
  ABOUT_INDEX = LIST.length;          // ABOUT sits after every section
  LIST = LIST.concat(DATA.about);
  // Grouped siblings: window entries with no icon behind them, appended after
  // ABOUT. FORM_INDEX is read off the length AFTER they land, so the form
  // stays the last entry and its index stays the one thing that names it.
  LIST = LIST.concat(DATA.extra);
  FORM_INDEX  = LIST.length;          // the form is appended after the build
  // entry -> flat window index, for the sibling row (its targets are spread
  // across the sections and the tail, so there is no arithmetic to do)
  FLAT_OF = new Map(); LIST.forEach((en, i) => FLAT_OF.set(en, i));
  // EVERY WORK KEEPS ITS OWN ADDRESS, sub-projects included: the URL does not
  // gain a level for them. `sel` is the icon to select — the lead's, shared by
  // the whole group — and `sub` is which of its works to show, or null for the
  // lead's own. So '#build/asia-society' and '#build/asia-society-monster'
  // select the same icon and part company only inside the window.
  //
  // The group is NOT in the URL, deliberately, and for the reason the band is
  // not: it is which icon you are behind, not which thing you are looking at.
  ROUTE_OF = new Map();
  DATA.sections.forEach((sec, si) => {
    sec.entries.forEach((en, i) => {
      const sel = SECTION_OFFSET[si] + i;
      ROUTE_OF.set(sec.id + '/' + en.slug, { sel, sub: null });
      if (!en.sibs) return;
      en.sibs.forEach(sib => {
        if (sib !== en) ROUTE_OF.set(sec.id + '/' + sib.slug, { sel, sub: FLAT_OF.get(sib) });
      });
    });
  });

  // ------------------------------------------------------------------ webgl
  // `gl` is a LET and doubles as the feature flag: any failure below sets it
  // back to null and every GL-touching block is guarded by `if (gl)`. Nothing
  // else in boot() returns early any more — the DOM site is built either way.
  //
  // EVERY path to the fallback WARNS. The shader is the piece; degrading to a
  // text list is a real loss, not a neutral alternative, so it must never
  // happen quietly. A silent downgrade is indistinguishable from a bug, and
  // the first version of this shipped exactly that mistake.
  //
  // TESTING: add ?nogl to the URL to force the fallback on hardware that
  // supports the shader perfectly well. One file with a flag, rather than a
  // second deliberately-broken copy sitting next to the real one waiting to be
  // opened by accident.
  const rootEl = document.getElementById('noiselab');   // needed this early by
                                                        // the failure path below
  const canvas = document.getElementById('nl-gl');
  const FORCE_NOGL = /[?&#]nogl\b/.test(location.search + location.hash);
  let gl = null;
  if (FORCE_NOGL) {
    console.warn('[noiselab] ?nogl flag set — shader disabled deliberately, DOM menu in use.');
  } else {
    try {
      gl = canvas.getContext('webgl2', { alpha: false, antialias: false, premultipliedAlpha: false });
    } catch (e) {                       // some browsers THROW rather than return null
      console.warn('[noiselab] WebGL2 context creation threw:', e);
    }
    if (!gl) console.warn('[noiselab] WebGL2 unavailable — falling back to the DOM menu.');
  }
  if (!gl) rootEl.classList.add('nogl');

  // ---------------------------------------------------------------- theme
  // GL-side theme state. Declared here because the first clear (below) needs
  // it; setTheme() — down in the system-theme section — is what writes it,
  // along with the CSS vars and the html/body backgrounds.
  let BG  = [0, 0, 0];    // clear color
  let INK = [1, 1, 1];    // icon color (uInk) for a BANDED icon
  let DIM = [0.5, 0.5, 0.5];   // ...and for one outside the band: the accent
                               // grey already resolved over BG. See setTheme.

  // THE DEVICE SETTING, READ ONCE, HERE. The live listener stays with the rest
  // of the theme machinery further down; only this read and the first call had
  // to move, because everything above and below them assumes a resolved theme.
  const mqLight = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

  // TESTING ONLY: ?light / ?dark pin the theme. The theme still FOLLOWS THE
  // DEVICE — that decision is untouched — but some browsers will not hand you
  // both halves of it to test against. Chrome on mobile in an Incognito window
  // reports dark whatever the phone is set to, which makes every light-mode
  // path unreachable on the one device this site is built for first. Same
  // answer as ?nogl: one file with a flag, rather than a second copy that can
  // be opened by accident. While one is set the live listener is not attached,
  // so a pinned theme stays pinned if the device flips underneath it.
  //
  // location.search ONLY, never the hash — the ?wheel rule: a project slugged
  // `light` would otherwise turn it on from its own URL.
  const FORCE_THEME = /[?&]dark\b/.test(location.search)  ? 'dark'
                    : /[?&]light\b/.test(location.search) ? 'light'
                    : null;
  // The one thing a pin cannot reach is the address-bar tint: the theme-color
  // metas are media-scoped in the head and the browser picks between them
  // itself. Under ?light / ?dark that strip keeps following the device. It is
  // browser chrome, not the page, and this flag is for testing the page.
  if (FORCE_THEME) console.warn('[noiselab] ?' + FORCE_THEME +
    ' flag set — theme pinned deliberately, the device setting is ignored.');

  // RESOLVE THE THEME BEFORE THE FIRST CLEAR — this call is the fix for a real
  // bug, not tidiness. The three values above used to be hard-coded DARK and
  // corrected by setTheme() ~1500 lines later. On a dark device that cost
  // nothing. On a LIGHT one it left the canvas holding a BLACK buffer from the
  // clear below until resize() re-cleared it in the right colour — and resize()
  // runs after the icon bake, which AWAITS every icon image. So a light-mode
  // load showed a black rectangle for the whole bake: 300x150, the browser's
  // DEFAULT canvas size, centred above the footer, aligned to nothing in this
  // layout because it was not this layout's geometry at all.
  setTheme(FORCE_THEME || (mqLight && mqLight.matches ? 'light' : 'dark'));

  // Paint the theme background immediately. The icon bake is async (images
  // decode before the first frame()), so without this the canvas can show an
  // uninitialised (grey/garbage) buffer for a beat on load. Together with the
  // CSS canvas background, the color-scheme/theme-color metas, and the inline
  // html background, the page is in-theme at every stage of load.
  if (gl) {
    gl.clearColor(BG[0], BG[1], BG[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  const VERT = `#version 300 es
in vec2 aPos;
uniform vec2 uTranslate;
uniform vec2 uScale;
out vec2 vUv;
void main() {
  vUv = aPos;
  gl_Position = vec4(uTranslate + aPos * uScale, 0.0, 1.0);
}`;

  const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2  uSeed;
uniform float uAmp;
uniform float uFreq;
uniform float uPhase;
uniform vec3  uInk;   // icon color: white in dark mode, black in light mode

// Ashima / Stefan Gustavson 3D simplex noise (webgl-noise, MIT)
vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i  = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

void main() {
  float nx = snoise(vec3(vUv * uFreq + uSeed, uPhase));
  float ny = snoise(vec3(vUv * uFreq + uSeed + vec2(19.13, 7.7), uPhase + 4.2));
  vec2 disp = vec2(nx, ny) * uAmp;
  vec4 t = texture(uTex, vUv + disp);        // premultiplied; transparent border = no smear
  // the bake is pure white art, so alpha IS the shape — recolor with uInk
  // (output stays premultiplied for the ONE / ONE_MINUS_SRC_ALPHA blend)
  fragColor = vec4(uInk * t.a, t.a);
}`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  // A context can exist and STILL fail to compile or link — driver bugs and
  // blocklisted GPUs both show up here rather than at getContext. Treated the
  // same as no context at all: drop to null and let the DOM site carry on.
  let prog = null, loc = null, vao = null;
  if (gl) {
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));

      loc = {
        aPos:      gl.getAttribLocation(prog, 'aPos'),
        uTranslate:gl.getUniformLocation(prog, 'uTranslate'),
        uScale:    gl.getUniformLocation(prog, 'uScale'),
        uTex:      gl.getUniformLocation(prog, 'uTex'),
        uSeed:     gl.getUniformLocation(prog, 'uSeed'),
        uAmp:      gl.getUniformLocation(prog, 'uAmp'),
        uFreq:     gl.getUniformLocation(prog, 'uFreq'),
        uPhase:    gl.getUniformLocation(prog, 'uPhase'),
        uInk:      gl.getUniformLocation(prog, 'uInk'),
      };

      // one unit quad, reused for every icon
      const quad = new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]);
      vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc.aPos);
      gl.vertexAttribPointer(loc.aPos, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied alpha
    } catch (e) {
      // NOT silent. This catch exists for driver-level failures, but it would
      // just as happily swallow a coding mistake in the block above and make
      // it look like a capability problem. The warning is what tells those two
      // apart.
      console.warn('[noiselab] shader setup failed — falling back to the DOM menu:', e);
      gl = null;
      rootEl.classList.add('nogl');
    }
  }

  // ------------------------------------------------------------- bake step
  // The crux: SVG, PNG and glyph all end up as the same kind of texture.
  function loadImage(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = rej;
      im.src = src;
    });
  }
  async function bakeIcon(item) {
    const S = BAKE_PX, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.clearRect(0, 0, S, S);
    if (item.kind === 'glyph') {
      // draw text directly — never rasterise <text>-in-SVG via <img>
      x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `700 ${Math.round(S*0.44)}px ui-monospace, Menlo, Monaco, 'Segoe UI', sans-serif`;
      x.fillText(item.char, S/2, S*0.52);
      return c;
    }
    // GEOMETRIC FORMS for the field, drawn straight to canvas for the same
    // reason glyphs are: nothing is rasterised through <img>, and alpha is
    // the shape — white on transparent, recoloured by uInk like every other
    // texture. PLACEHOLDER ART, meant to be replaced by real drawings.
    if (item.kind === 'shape') {
      const d = S * BAKE_FILL, o = (S - d) / 2, r = d / 2, cx = S / 2, cy = S / 2;
      x.fillStyle = '#fff'; x.strokeStyle = '#fff';
      x.lineWidth = Math.max(2, d * 0.11); x.lineJoin = 'miter';
      const poly = (n, rot) => {
        x.beginPath();
        for (let i = 0; i < n; i++) {
          const a = rot + i * 2 * Math.PI / n;
          x[i ? 'lineTo' : 'moveTo'](cx + r * Math.cos(a), cy + r * Math.sin(a));
        }
        x.closePath();
      };
      switch (item.form) {
        case 'disc':     x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); break;
        case 'ring':     x.beginPath(); x.arc(cx, cy, r - x.lineWidth / 2, 0, 7); x.stroke(); break;
        case 'square':   x.fillRect(o, o, d, d); break;
        case 'frame':    x.strokeRect(o + x.lineWidth / 2, o + x.lineWidth / 2, d - x.lineWidth, d - x.lineWidth); break;
        case 'triangle': poly(3, -Math.PI / 2); x.fill(); break;
        case 'hexagon':  poly(6, -Math.PI / 2); x.fill(); break;
        case 'hexframe': poly(6, -Math.PI / 2); x.stroke(); break;
        case 'diamond':  poly(4, -Math.PI / 2); x.fill(); break;
        case 'cross':    x.fillRect(cx - d * 0.16, o, d * 0.32, d);
                         x.fillRect(o, cy - d * 0.16, d, d * 0.32); break;
        case 'chevron':  x.beginPath(); x.moveTo(o, cy + r * 0.55);
                         x.lineTo(cx, cy - r * 0.55); x.lineTo(o + d, cy + r * 0.55);
                         x.stroke(); break;
        case 'half':     x.beginPath(); x.arc(cx, cy, r, Math.PI, 0); x.fill(); break;
        case 'quarter':  x.beginPath(); x.moveTo(o, o + d); x.arc(o, o + d, d, -Math.PI / 2, 0); x.fill(); break;
        case 'bars':     for (let i = 0; i < 3; i++) x.fillRect(o, o + i * d / 2.5, d, d * 0.18); break;
        // reserved for the needle — compound, so it is unmistakable among the
        // simple forms at the moment the whole field resolves
        case 'target':   x.beginPath(); x.arc(cx, cy, r - x.lineWidth / 2, 0, 7); x.stroke();
                         x.beginPath(); x.arc(cx, cy, r * 0.34, 0, 7); x.fill(); break;
        default:         x.fillRect(o, o, d, d);
      }
      return c;
    }

    const img = await loadImage(item.src);             // svg or png file
    const target = S * BAKE_FILL, sc = Math.min(target/img.width, target/img.height);
    const w = img.width * sc, h = img.height * sc;
    x.drawImage(img, (S - w)/2, (S - h)/2, w, h);       // centred, with margin to warp into
    return c;
  }

  // ------------------------------------------------------- layout (state)
  // Set by resize()/relayout(); read by frame() and iconAtPointer().
  let icons = [];       // what frame() draws: the menu row, or the field's cells
  let allIcons = [];    // the menu set — every section, one flat row. `icons`
                        // points at it, except in the field (see savedIcons)
  let footW = 0, footH = 0;       // per-icon quad size, clip units
  let cellPxCss = 0;              // icon cell size, CSS px (hit-test)
  let canvasCssW = 0, canvasCssH = 0;
  let marginPxCss = 24;           // pitch * MARGIN_RATIO — feeds --nl-m
  let gridTopCss = 0;             // resting grid's top cell edge, canvas CSS px
  let kbFrozen = false;           // layout freeze while a form field owns the keyboard
  const gridEl    = document.getElementById('nl-grid');
  const stageEl   = document.getElementById('nl-stage');
  // rootEl is declared up at the webgl block — the GL failure path needs it
  // before this point.
  // the footer reserve and the resting height are both written pre-boot,
  // above — see placeSeam(). Nothing to redo here.

  // ------------------------------------------------------ menu row (state)
  // THE ROW IS A RING. It has no first icon and no last one: past the end of
  // ART comes BUILD again, and the wrap is the only thing that makes a footer
  // link honest on a WIDE screen — where the row is shorter than the viewport,
  // there is otherwise no scroll position that puts DESIGN at the left margin.
  // The taskbar rule is untouched: cells are the same fixed size and only the
  // count on screen changes. What went is the "it fits, so centre it and stop
  // scrolling" case — an endless row has nothing to fit inside.
  //   scrollX   offset in CSS px — 0 puts the first icon against the left margin
  //   rowCycle  one full turn: every cell plus the gap that separates the last
  //             from the first. Positions are taken modulo this; 0 disables the
  //             ring (the field, which lays its own cells out)
  //   scrollV   glide velocity, px/s, decaying after a flick
  //   rowTarget a settle destination (a category jump, or scroll-into-view)
  // scrollV and rowTarget are never both live: a target cancels the glide.
  let rowScrolls = false;
  let scrollX = 0, rowCycle = 0, scrollV = 0, rowTarget = null;
  let bootRoute = false;                 // the first route application: what it
                                         // moves is a starting position, not a
                                         // transition. NO BOUNCE ON LOAD.

  // Push the current scroll into the two things that read icon positions: the
  // icons' own centres (pointer hit-test AND shader) and the DOM twin.
  //
  // wrapCx is the position within one turn, in [0, rowCycle) — the draw and the
  // hit test both walk out from it in whole turns, so on a viewport wider than
  // a turn the same icon is genuinely on screen twice and BOTH copies are the
  // same icon to a tap. pxCx is the single copy nearest the viewport, which is
  // what the DOM twin follows.
  //
  // The twin used to ride ONE transform on its container, which the ring makes
  // impossible: each span wraps at a different moment. It is a transform per
  // span now — same count as the icons, still no layout read, and still nothing
  // for placeKeys() and this to agree about beyond baseCx.
  function applyScroll() {
    const cyc = rowCycle;
    for (const ic of icons) {
      let x = ic.baseCx - scrollX;
      if (cyc) {
        x -= Math.floor(x / cyc) * cyc;                // into [0, cyc)
        ic.wrapCx = x;
        // off the right edge by more than it would be off the left: take the
        // copy one turn back instead
        ic.pxCx = (x - canvasCssW > cyc - x) ? x - cyc : x;
      } else {
        ic.wrapCx = ic.pxCx = x;
      }
      ic.cx = ic.pxCx / canvasCssW * 2 - 1;
    }
    if (!gl) return;
    for (let i = 0; i < keyEls.length && i < icons.length; i++) {
      keyEls[i].style.transform =
        'translateX(' + (icons[i].pxCx - icons[i].baseCx).toFixed(1) + 'px)';
    }
  }

  // Is any copy of this icon on screen? pxCx is already the copy nearest the
  // viewport, so if that one is off, they all are.
  function onScreen(ic) {
    const half = cellPxCss / 2;
    return !!ic && ic.pxCx + half > 0 && ic.pxCx - half < canvasCssW;
  }

  // SCROLLING CLEAR OF A SECTION RETURNS TO ALL. The band is a place, not a
  // mode: once none of its icons is on screen the row has stopped showing that
  // section, and saying otherwise in the footer would be a lie. Falls back to
  // the state the page loads in, everything ink.
  //
  // Only at REST, and only under a HAND. With a project or a fixture holding
  // the window the band is that thing's address and is not the scroll's to
  // take; and a footer jump travels through the rest of the row on its way, so
  // the check would fire in the middle of the very move that set the band —
  // which is why it is called from the drag, the wheel and the coast, and
  // never from the settle.
  function bandCheck() {
    if (activeSection === null || selected !== null || fixture !== null) return;
    const r = bandRange();
    for (let i = r[0]; i < r[1]; i++) if (onScreen(icons[i])) return;
    setBand(null, true);          // REPLACE: a scroll is not a click and has no
                                  // business pushing a history entry
  }

  // Keep scrollX inside one turn while the row is idle. Positions are taken
  // modulo the cycle regardless, so this changes nothing you can see — it just
  // stops the number climbing for as long as the page stays open.
  function normaliseScroll() {
    if (!rowCycle || rowTarget !== null) return;
    scrollX -= Math.floor(scrollX / rowCycle) * rowCycle;
  }

  // Place every icon: ONE ENDLESS row, square cells, uniform gaps, FIXED pitch.
  // The row always starts at the left margin and always scrolls — there is no
  // "it fits" case any more, because a ring is never finished. The pitch is
  // untouched by any of it (see the taskbar rule at CELL_PX).
  function relayout() {
    const N = icons.length;
    if (!N || !canvasCssW || !canvasCssH) return;

    const g = GAP_RATIO, m = MARGIN_RATIO;

    // The pitch is the fixed base pitch. The ONLY thing that may shrink it is
    // GRID_MAX_FRAC having shortened the canvas — a viewport too short for one
    // row plus the footer reserve. That is the same last-resort uniform shrink
    // the old multi-row layout had, and it is the one case where icons give up
    // their fixed size rather than evict the content half.
    const pitch  = Math.min(CELL_PX / (1 - g), canvasCssH / (1 - g + 2 * m));
    const cellPx = pitch * (1 - g);
    const gapPx  = pitch * g;
    cellPxCss = cellPx;
    marginPxCss = pitch * m;             // ONE margin value for grid AND window
    footW = 2 * cellPx / canvasCssW;     // CSS px -> clip-space quad size
    footH = 2 * cellPx / canvasCssH;

    // ONE TURN of the ring: every cell plus the gap that separates the last
    // icon from the first. Including that trailing gap is what keeps the seam
    // invisible — leave it out and the wrap butts WEST OF THE SIERRAS straight
    // against THE MET with no space between them, which is the one place in the
    // row you would see the join.
    rowCycle = N * (cellPx + gapPx);
    rowScrolls = N > 1;
    rowFadePx = pitch;                   // one pitch — see the note at its
                                         // declaration for why not less

    // BOTH EDGES DISSOLVE, ALWAYS, at full width. The fade used to say "this
    // much travel is left this way" and ramp out as you reached an end. On a
    // ring that reading is simply true in both directions at every moment, so
    // it stops being a per-frame calculation and becomes a fact of the layout.
    canvas.style.setProperty('--fade-l', rowFadePx.toFixed(1) + 'px');
    canvas.style.setProperty('--fade-r', rowFadePx.toFixed(1) + 'px');
    keysEl.style.transform = '';         // the twin rides per-span transforms
                                         // now; clear the old container one
