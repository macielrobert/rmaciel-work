<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- theme follows the DEVICE system setting; "light dark" keeps the UA's
     default canvas on-scheme before the stylesheet parses (no flash) -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<!-- GENERATED — build.js replaces this whole tag with site_title from
     content/site.json. Do not hand-edit: the CMS is the source of truth
     and the next build overwrites it. Deliberately not the real name, so
     that a build which failed to run is obvious rather than plausible.
     (Runtime titles are separate — updateDocTitle() sets document.title
     from CONTENT.siteTitle once boot() runs; this tag is first paint.) -->
<title>PLACEHOLDER — set from content/site.json at build</title>
<style>
  /* =======================================================================
     TYPEFACE — PP Neue Montreal, three static cuts, served as files.

     NOT INLINED AS BASE64, and that is a deliberate reversal of the
     one-request rule everywhere else in this project. Three cuts are ~90 KB;
     base64 inflates a binary by about a third, so inlining would have put
     ~120 KB inside the HTML document itself — and the document must arrive
     in full before anything paints. This site is built the other way round:
     a black shell paints immediately and boot() runs after. Inlining the
     typeface would have undone the one behaviour the whole boot sequence
     exists to protect.

     As separate files with font-display: swap they load in parallel, off the
     critical path, and cache independently across visits. The cost is three
     extra requests. That was raised and accepted rather than assumed.

     NOT A VARIABLE FONT. These files carry no fvar/gvar/STAT table — they are
     five separate static instances, of which three ship. So weight and slant
     come from the FILES, and font-variation-settings has nothing to act on.
     Asking for a weight these files do not contain gets a synthesised one:
     a smeared fake-bold, not the real cut. Only 400 and 700 exist here.

     WHY THESE THREE. Book is the body. Bold and Italic exist for the text
     formatting work. BoldItalic (+31 KB) is omitted until something actually
     needs bold and italic at once — until then a browser synthesises it, and
     the combination may never appear. Light shipped once the text-formatting
     work gave it something to do — before that it was 29 KB of nothing.
     BoldItalic remains in the repository history if that changes too.

     THREE REAL WEIGHTS: 300, 400, 700. Nothing between them exists. Asking
     for 500 gets a synthesised weight — the browser smearing the 400 — which
     is why the size and weight controls offer named steps and not a number.
     ======================================================================= */
  @font-face {
    font-family: 'PP Neue Montreal';
    src: url('/fonts/PPNeueMontreal-Light.woff2') format('woff2');
    font-weight: 300; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'PP Neue Montreal';
    src: url('/fonts/PPNeueMontreal-Book.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'PP Neue Montreal';
    src: url('/fonts/PPNeueMontreal-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'PP Neue Montreal';
    src: url('/fonts/PPNeueMontreal-Italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: swap;
  }

  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  /* WebKit inflates text on rotation to landscape unless told not to —
     this pins every size to its authored px value in both orientations */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  @media (prefers-color-scheme: light) {
    html, body { background: #fff; }
  }

  #noiselab {
    /* the whole theme is these two values — .light swaps them */
    --bg:  #000;
    --ink: #fff;
    /* l-grid cell width. Fixed like the icon cell — only the column COUNT
       responds to width. min(...,100%) is the one concession: below ~250px
       of window there is no room for a 200px cell, so it gives way. */
    --g-cell: 200px;
    /* below this viewport width a 200px cell no longer fits even once, so the
       grid pins to 2 flexible columns instead of dropping to 1 (see l-grid).
       479 = two 200px cells + gap need inner 410px -> viewport 479. */
    /* collapsed height of a long body in l-grid — 4 lines at 11px / 1.9.
       Past this the copy clamps and the caret appears. */
    --body-clamp: 84px;
    /* widest a HERO image may draw. Unlike the wordmark's conservative cap,
       a lead image is content and earns room — but it still stops growing
       so a 27in monitor gains surrounding space, not a bigger picture. */
    --hero-max: 720px;
    /* THE TASKBAR RULE, APPLIED TO TYPE. The icon cell stops at 50px, the
       wordmark at 320, the hero at 720, the l-grid cell at 200 — body copy
       was the last element still growing with the viewport. It stops too
       now, and the extra room becomes space rather than longer lines.

       WAS 66ch, AND `ch` NO LONGER MEANS WHAT IT MEANT. In a monospace face
       `ch` IS the character advance, so 66ch was EXACTLY 66 characters. In a
       proportional face `ch` is only the width of the digit zero, which is
       one of the WIDER glyphs — keeping 66ch here would have held roughly 80
       characters per line and quietly pushed the measure past the comfortable
       range while still reading as "66" in the source. Worse than wrong: wrong
       and self-documenting as right.

       So the unit changes with the typeface. Average Latin lowercase runs
       ~0.5em per character, so 66 characters is ~33em. This is an ESTIMATE
       where the old value was a guarantee — that is the real cost of leaving
       monospace, and it is worth saying plainly rather than pretending the
       number is still exact.

       `em` keeps the one property that mattered: it resolves against the
       window's 11px text, so a later type-size change widens the column on its
       own and the character count holds. Still a CAP, not a breakpoint — a
       phone in portrait never reaches it. 66 characters is the middle of the
       comfortable 45-75 range.

       TUNE THIS against the real face once it is in: set copy at this width,
       count the characters on a full line, and adjust if it lands outside
       55-70. */
    --measure: 33em;
    /* THE SAME IDEA, DIFFERENT JOB. --measure is a fact about READING: a line
       of prose stops being comfortable past ~75 characters. A form is not
       prose — its fields are targets to hit, not lines to follow — so the
       reading measure only makes them needlessly small. The form gets its own,
       wider cap.
       Still a CAP, still absolute: the taskbar rule holds, only the number
       changes. It lands at roughly the left half of a laptop window and stops
       there, so a 27" monitor gains space around the form rather than a wider
       one.

       WAS 96ch. Converted with the same reasoning as --measure above, but on
       a different basis: this value was never a character count, so what is
       preserved is its RATIO to the reading measure — it was 1.45x, and 33em
       x 1.45 is 48em. A form that stops being comfortably wider than the prose
       column has lost the only thing this variable exists to say. */
    --measure-form: 48em;
    width: 100vw;
    height: 100vh;
    height: 100dvh;                           /* mobile address-bar aware */
    background: var(--bg);
    color: var(--ink);
    font-family: 'PP Neue Montreal', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    /* Orientation is now FIXED: contact top, menu bottom, all screens.
       (Was menu-top on desktop; the contact brief pins the top half.) */
    flex-direction: column-reverse;
    overflow: hidden;
    position: relative;                       /* anchors #nl-window */
  }
  #noiselab.light { --bg: #fff; --ink: #000; }
  /* pre-boot correctness on light-scheme devices (JS re-applies at boot).
     Must come AFTER the base #noiselab rule or the dark defaults win. */
  @media (prefers-color-scheme: light) {
    #noiselab { --bg: #fff; --ink: #000; }
  }
  #noiselab * { box-sizing: border-box; margin: 0; padding: 0; }

  /* the two halves — no longer a fixed 50/50: the GRID half is sized by JS to
     exactly (canvas height + footer reserve), so the seam FOLLOWS the grid;
     the content half takes whatever remains */
  #nl-grid, #nl-content {
    min-height: 0;                            /* let flex children hold their box, not content height */
    min-width: 0;
    overflow: hidden;
    position: relative;
  }
  #nl-content { flex: 1 1 auto; }
  #nl-grid    { flex: 0 0 auto; height: 50%; /* pre-boot fallback; JS overwrites */ }

  /* menu half — the icon grid (canvas sized in JS) */
  /* the hairline is the seam between the halves — accent grey holds on both themes */
  #nl-grid  { display: flex; align-items: center; justify-content: center;
              border-top: 1px solid rgba(143,143,153,0.5); }
  /* canvas anchors to the BOTTOM of the half: it sits flush against the
     footer reserve (padding-bottom, set in boot), i.e. on top of the footer.
     position: relative so the keyboard layer can be placed onto the canvas. */
  #nl-stage { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center;
              position: relative; }
  #nl-gl    { display: block; cursor: pointer; background: var(--bg); }
  /* THE SCROLLING ROW. Horizontal drags are OURS (read manually, with
     momentum); vertical panning and pinch-zoom stay the browser's, so the page
     can still be zoomed. Without this a horizontal drag on iOS is a
     back-navigation gesture and the row never moves. The class is present only
     while the row actually overflows — when every icon fits there is nothing
     to scroll and the canvas keeps its default behaviour.

     THE FADED EDGE IS THE AFFORDANCE. A row that ends flush at the viewport
     edge looks finished; one that dissolves into the background is visibly
     cut off, and that is true on a phone and a desktop alike — one mechanism,
     no device-conditional furniture, nothing added to the layout. The two
     widths are written by applyScroll and RAMP with distance from each end,
     so the mark is not just "there is more" but "there is more, and this is
     roughly where you are". At rest only the right edge fades; at the far end
     only the left.

     It is a mask on an OPAQUE canvas, so what shows through the faded part is
     the page behind it — the same --bg the canvas is painted with. The icons
     dissolve into the background rather than into a grey band, which is the
     same vocabulary the shader already speaks. */
  #nl-gl.scroll-row {
    touch-action: pan-y pinch-zoom;
    --fade-l: 0px; --fade-r: 0px;
    -webkit-mask-image: linear-gradient(90deg,
      transparent 0, #000 var(--fade-l),
      #000 calc(100% - var(--fade-r)), transparent 100%);
            mask-image: linear-gradient(90deg,
      transparent 0, #000 var(--fade-l),
      #000 calc(100% - var(--fade-r)), transparent 100%);
  }
  /* the cursor confirms the drag WHILE it happens. Deliberately not `grab` at
     rest: the icons are the navigation, and `pointer` says so. Saying `grab`
     instead would trade a true signal for a hint. */
  #nl-gl.scroll-row.dragging { cursor: grabbing; }

  /* ------------------------------------- keyboard / screen-reader grid layer
     The canvas is PIXELS: it cannot be tabbed into, and a screen reader meets
     one image where there are thirteen projects. This layer is the answer —
     one empty focusable span per icon, laid onto that icon's RESTING cell box
     and carrying the project title as its accessible name. The spans read the
     same pxCx / pxCy / cellPxCss that the pointer hit-test reads, so pointer
     and keyboard targets cannot drift apart, and they re-place on resize for
     free.

     `pointer-events: none` is LOAD-BEARING. The spans must never intercept a
     tap: the canvas keeps the entire pointer path it already had, untouched,
     and this layer is reached by keyboard only. An element with pointer events
     off can still take keyboard focus, which is exactly the asymmetry wanted. */
  #nl-keys { position: absolute; pointer-events: none; }
  /* the twin scrolls with the row, so its spans now run past both canvas
     edges: clip it, or a focus mark on an off-screen icon paints over the
     window. clip-path and NOT overflow:hidden — overflow would make this a
     scroll container, which the browser scrolls behind our back when focus
     lands inside it, fighting the transform. */
  #nl-keys.scroll-row { clip-path: inset(0); }
  #nl-keys [data-key] { position: absolute; display: block; outline: none; }
  /* THE FOCUS MARK — a DOM hairline on the cell, drawn in the structural
     accent, the same stroke as the seam. :focus-visible, so it appears for
     keyboard use and never behind a tap. It is a CONTROL, so by the standing
     rule it stays resolved: it does not churn with the art underneath it. */
  #nl-keys [data-key]:focus-visible {
    outline: 1px solid rgba(143,143,153,0.9);
    outline-offset: 2px;
  }

  /* ------------------------------------------------------- no-WebGL fallback
     WebGL2 can be missing for reasons that have nothing to do with the
     visitor: an old Android build, hardware acceleration switched off, a GPU
     on a driver blocklist, a locked-down managed browser. A couple of percent
     of people. That used to take the WHOLE SITE with it — the context failed,
     boot() returned, and nothing else was ever wired: no footer, no ABOUT, no
     CONTACT, no way to read a single word. The worst kind of failure, too,
     because those visitors leave without ever appearing in an analytics
     number you would think to look at.

     So the shader is an ENHANCEMENT now, and this is the site without it.
     The fallback is not a second page or a second navigation — it is the KEY
     LAYER, the DOM twin that already existed for the keyboard and screen
     readers, made visible and allowed to flow as a wrapped list of titles.
     One menu, two renderings; the accessibility work paid for this for free.

     The coherence rule survives the translation: the selected project is INK
     and the rest stay grey. That is what the frozen icon means, said in type
     instead of pixels. */
  #noiselab.nogl #nl-gl    { display: none; }
  #noiselab.nogl #nl-stage { align-items: center; }
  #noiselab.nogl #nl-keys {
    position: static;                          /* placeKeys() never runs here */
    pointer-events: auto;                      /* now the real menu, so it
                                                  takes taps itself — there is
                                                  no canvas beneath to take them */
    display: flex; flex-wrap: wrap;
    align-content: center; justify-content: center;
    width: 100%; max-height: 100%;
    overflow-y: auto;
    /* the site's one spacing value, same as every other margin. The half is
       sized to this list's measured height, so any padding here is real space
       that the seam then accounts for — nothing is left over. */
    padding: 0 var(--nl-m, 12px);
    scrollbar-width: none;
  }
  #noiselab.nogl #nl-keys::-webkit-scrollbar { display: none; }
  #noiselab.nogl #nl-keys [data-key] {
    position: static;
    width: auto; height: auto;
    /* tight: the tap target comes from the padding, and the padding IS the
       separation between titles — the same trick the footer nav uses instead
       of commas. Anything looser reads as the list being adrift. */
    padding: 4px 8px;
    font-size: 11px; line-height: 1.5; letter-spacing: 0.05em;
    color: rgba(143,143,153,0.9);
    cursor: pointer;
  }
  /* the coherent one, in text */
  #noiselab.nogl #nl-keys [data-key][aria-selected="true"] { color: var(--ink); }
  @media (hover: hover) {
    #noiselab.nogl #nl-keys [data-key]:hover { color: var(--ink); }
  }

  /* ------------------------------------------------ contact: inactive (about) */
  /* Centered in the contact half. Empty at rest (slot kept for future copy);
     non-interactive. */
  #nl-about {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 11px; line-height: 1.8; letter-spacing: 0.05em;
    pointer-events: none;
    padding: 0 24px;
  }
  #nl-about .in { max-width: 36ch; }

  /* ------------------------------------------------ contact: active (window) */
  /* Absolutely positioned in #noiselab so it can span past the 50% seam.
     Borderless — the text floats on the black field. All four offsets come
     from ONE value derived from the grid itself: --nl-m = pitch * MARGIN_RATIO
     (set in resize()). Bottom is computed so the gap between the window and
     the RESTING grid's top cell edge is also --nl-m. */
  #nl-window {
    position: absolute;
    top:    var(--nl-m, 24px);
    left:   var(--nl-m, 24px);
    right:  var(--nl-m, 24px);
    bottom: var(--nl-win-bottom, 55%);
    padding: 20px 22px;
    font-size: 11px; line-height: 1.9; letter-spacing: 0.05em;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden;
    /* two fixed regions: text above (constant height, scrolls on overflow,
       empty space when short), carousel pinned below — same place always */
    display: flex;
    flex-direction: column;
  }
  /* the flexing region: text below, expand layer above it when open */
  #nl-main {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }
  #nl-window-text {
    height: 100%;
    /* THE MEASURE. One cap, every layout, both orientations — the window
       keeps growing with the viewport, the line length does not. */
    max-width: var(--measure);
    overflow-y: auto;
    pointer-events: auto;            /* vertical scroll needs it; exits are
                                        the ×, the frozen icon, gaps, Esc */
    scrollbar-width: none;
  }
  #nl-window-text::-webkit-scrollbar { display: none; }
  /* WHERE the capped column sits: FLUSH LEFT, in every layout and both
     orientations. There is deliberately no rule here — left is what a block
     of text does on its own, and the point is that it does the same thing
     everywhere. Cap the width, never move the left edge.
     The reason it is the LEFT edge specifically: in a left-to-right reading
     that is where every line begins, so it is the edge the eye returns to.
     Pinning it to a margin keeps that return point FIXED — the copy starts in
     the same place whatever the window is doing. The slack the cap gives back
     always falls on the right, as space. Same logic as the fixed icon cell:
     hold the thing still, let the room around it grow. */

  /* ------------------------------------------------ expanded image layer */
  /* IN-FLOW, not an overlay: expanding display-swaps the text region for
     this view (same hard cut as before). Interaction props live on the
     CHILDREN because landscape uses display:contents on this element. */
  #nl-expand {
    display: none;
    height: 100%;
    flex-direction: column;
  }
  #nl-window.x #nl-expand { display: flex; }
  #nl-window.x #nl-window-text { display: none; }
  #nl-exp-top, #nl-exp-stage, #nl-exp-cap {
    pointer-events: auto;
    user-select: none; -webkit-user-select: none;
  }
  #nl-exp-stage { touch-action: none; }        /* swipes are read manually */

  /* LANDSCAPE: the window is ALWAYS two-column inside the margins, expanded
     or not, so the two states share one geometry.
     UNEXPANDED: project info text fills the RIGHT half (wrapping, scrolling
     on overflow — the same slot the image takes when expanded); the
     carousel sits bottom-LEFT at half width. Rows above it stay open.
     EXPANDED: overrides below — breadcrumb + caption stack in the left
     column, the image takes the right at full height. */
  @media (orientation: landscape) {
    #nl-window {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) var(--car-h, 25%);
      column-gap: var(--nl-m, 24px);
      row-gap: 10px;
    }
    #nl-main { display: contents; }
    #nl-window-text { grid-column: 2; grid-row: 1 / span 2;
      /* STRETCH, then let max-width do the stopping. A grid item told to
         `start` sizes to FIT-CONTENT, which is the wrong question to ask: the
         width should come from the measure, not from the copy.

         The difference is invisible for prose — a paragraph's natural width is
         enormous, so it hits the cap either way — and catastrophic for anything
         short. The contact form is the clear case: its labels are single words
         and its `width: 100%` inputs contribute almost nothing to intrinsic
         width, so under `start` the whole form collapsed to about the size of
         one default input and never reached its cap at all.

         Stretched, the item fills its column, max-width clamps it at the
         measure, and — because it then CANNOT stretch — alignment falls back
         to start on its own. So the left edge still sits on the gutter and
         still holds still as the screen grows; that behaviour was never what
         `start` was buying. */
      justify-self: stretch; }
    #nl-car         { grid-column: 1; grid-row: 2; margin: 0; }
    /* LAYOUTS 'text' and 'form': no image strip, so the copy takes both
       columns. What each does with that width differs — see l-form below. */
    #nl-window.l-text #nl-window-text,
    #nl-window.l-form #nl-window-text { grid-column: 1 / span 2; }

    /* LAYOUT 'grid' is stacked, not columnar: undo the grid container so the
       portrait arrangement (text above, images below) holds on wide screens
       too. The image grid wants full width more than the text wants a column. */
    #nl-window.l-grid            { display: flex; flex-direction: column; }
    #nl-window.l-grid #nl-main   { display: block; position: relative; }
    #nl-window.l-grid.x #nl-expand { display: flex; }
    #nl-window.l-grid.x #nl-exp-stage { margin-top: 10px; }

    /* expanded overrides */
    #nl-window.x { grid-template-rows: auto minmax(0, 1fr) var(--car-h, 25%); }
    #nl-window.x #nl-expand { display: contents; }
    #nl-window.x #nl-exp-top   { grid-column: 1; grid-row: 1; }
    #nl-window.x #nl-exp-cap   { grid-column: 1; grid-row: 2; align-self: start; max-height: none; }
    #nl-window.x #nl-exp-stage { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; }
    #nl-window.x #nl-car       { grid-row: 3; }
  }
  #nl-exp-top { display: flex; align-items: center; gap: 8px; }
  /* the LOCAL exit — up one layer (image -> project overview). Mirrors the ×
     spatially; the × stays the GLOBAL eject. Only exists in the image view,
     so the two marks document the layer structure. Static, like the ×. */
  #nl-back {
    padding: 6px 10px 6px 0;                   /* fat tap target */
    font-size: 13px; line-height: 1;
    color: rgba(143,143,153,0.9);
    cursor: pointer;
    user-select: none;
  }
  #nl-back:focus-visible { color: var(--ink); }   /* :focus-visible: a tapped control keeps focus and would stay ink */
  @media (hover: hover) { #nl-back:hover { color: var(--ink); } }
  #nl-exp-hd { color: rgba(143,143,153,0.9); }
  #nl-exp-stage {
    flex: 1 1 auto; min-height: 0;
    margin-top: 10px;
    display: flex; flex-direction: column;
  }
  #nl-exp-fit {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* the WHOLE image is always visible, scaled UP until its larger fit meets
     the closest boundary — never cropped. width/height 100% is load-bearing:
     without an explicit layout box, object-fit has nothing to fill and the
     img sits at its intrinsic size (the old square rendered at a tiny
     120x120 for exactly this reason). */
  #nl-exp-img { width: 100%; height: 100%; object-fit: contain; }
  /* caption: a bare grey line — no bar, no border — RESERVED below the image
     area. STATIC: always visible when the image has caption content, no
     show/hide interaction. Wraps to multiple lines (the image area yields);
     past ~4 lines it scrolls rather than eating the image. */
  #nl-exp-cap {
    flex: 0 0 auto;
    min-height: 21px;
    max-height: 84px;
    /* a caption is copy, so it takes the same measure as the body */
    max-width: var(--measure);
    overflow-y: auto;
    scrollbar-width: none;
    padding-top: 6px;
    color: rgba(143,143,153,0.9);
    visibility: hidden;
  }
  #nl-exp-cap::-webkit-scrollbar { display: none; }
  #nl-window .hd { color: rgba(143,143,153,0.9); }

  /* ---------------------------------------------------------- LAYOUTS
     Each window entry carries a LAYOUT name from the CMS; the window wears it
     as an `l-<name>` class and the rules below restructure accordingly. Two
     exist today (both were hardcoded conditions before they were named):

       l-standard  the default — carousel strip pinned at the foot, text above
                   (portrait) or in the right column (landscape), wordmark
                   centered in the open left area.
       l-text      no imagery. Copy takes the full window width. Used by ABOUT
                   and by any entry with no images.
       l-form      the contact form. Structurally identical to l-text — it was
                   borrowing that name until the two needed to differ — but it
                   takes the WIDER --measure-form instead of the reading
                   measure, because a field is not a line of prose.
       l-grid      image GRID instead of the strip: the icon grid's rule
                   applied to pictures — fixed 16:9 cells (--g-cell, 200px
                   wide), column count adapting to whatever width exists,
                   never the cell size. Stacked in BOTH orientations: text
                   above, grid filling the rest and scrolling vertically.
                   Cells crop to fill (cover), so the grid stays uniform
                   regardless of what shape the source images are.

     A new layout is: one name in LAYOUTS, one block of rules here, and the
     name typed into a project's `layout` field. Nothing else changes — the
     expand view, churn swap, and carousel machinery are layout-agnostic.
     `.x` (image expanded) composes ON TOP of any layout. */

  /* --------------------------------------------------- layout: l-grid */
  /* Stacked in both orientations, so the landscape two-column rules further
     down are explicitly undone for this layout. Text keeps its natural
     height at the top; the grid takes everything left and scrolls. */
  #nl-window.l-grid #nl-main       { flex: 0 0 auto; }
  #nl-window.l-grid #nl-window-text{ height: auto; overflow: visible; }
  #nl-window.l-grid #nl-car {
    flex: 1 1 auto;
    height: auto; min-height: 0;
    margin-top: 14px;
  }
  #nl-window.l-grid .car {
    display: grid;
    /* DEFAULT: fixed cells, adaptive count — the icon grid's rule, in the DOM.
       Below --g-2up the phone can't fit even one 200px cell (inner width is
       ~321px in portrait), so it would drop to a single column that reads too
       close to the standard mobile layout. The override below pins portrait
       phones to exactly TWO flexible columns instead — the one place the grid
       guarantees a COUNT rather than a SIZE. */
    grid-template-columns: repeat(auto-fill, min(var(--g-cell), 100%));
    justify-content: center;
    align-content: start;
    gap: 10px;
    height: 100%;
    overflow-x: hidden; overflow-y: auto;
    scroll-snap-type: none;
  }
  /* PORTRAIT PHONE: force 2 columns, cells flex to fit (each ~155px at 390px).
     Gated on width so a wider portrait tablet keeps the fixed-cell default. */
  @media (max-width: 479px) {
    #nl-window.l-grid .car { grid-template-columns: repeat(2, 1fr); }
  }
  #nl-window.l-grid .car .ph {
    width: 100%; height: auto;
    flex: none;
    scroll-snap-align: none;
  }
  /* not expandable -> not a control: no pointer, no focus affordance */
  #nl-window.l-grid .car .ph.static { cursor: default; }

  /* LONG COPY inside l-grid. A project here may run to several paragraphs,
     but the grid needs the room — so the body clamps to --body-clamp and a
     caret opens it. Opening lets the text take the whole content area and the
     grid steps aside, the same trade the expanded image makes. Only l-grid
     needs this: the standard layout's text region already scrolls in place.
     The caret is a CONTROL, not content — it never churns (it lives outside
     the entry, so spanify never reaches it), exactly like the x and the back
     mark. */
  #nl-window.l-grid .body      { max-height: var(--body-clamp, 84px); overflow: hidden; }
  #nl-window.l-grid.more .body { max-height: none; overflow: visible; }

  /* =======================================================================
     TEXT FORMATTING — the marks build.js emits from the CMS copy.

     These are the ONLY elements that appear inside body copy. build.js
     escapes the author's text first and then emits this fixed set, so the
     CMS cannot introduce any other tag: what is styled here is the whole
     vocabulary, not a starting point.

     WHY NAMED STEPS AND NOT NUMBERS. Three weights exist as files — 300,
     400, 700 — and nothing between them. A free numeric control would let
     the author pick 500 and get a synthesised smear that looks like a bad
     render rather than a choice. Same for size: free values fight the 33em
     reading measure and overflow the column. Both are therefore closed sets.

     em, NOT px, on the sizes: they resolve against the 11px body text, so a
     later type-size change carries them along instead of stranding them.

     THESE STILL CHURN. spanify() walks into child elements, so characters
     inside a <strong> or a size span resolve out of noise like any other
     text. Formatting does not opt copy out of the transition. */
  #nl-window-text strong, #nl-about-text strong { font-weight: 700; }
  #nl-window-text em,     #nl-about-text em     { font-style: italic; }
  #nl-window-text u,      #nl-about-text u {
    text-decoration: underline;
    /* the default underline sits on the baseline and cuts descenders; at
       11px that reads as a strikethrough on g, p and y */
    text-underline-offset: 0.18em;
    text-decoration-thickness: 1px;
  }
  /* weight: light. Bold is <strong>; there is no third weight class. */
  #nl-window-text .w-l, #nl-about-text .w-l { font-weight: 300; }
  /* size: small and large. Normal needs no class — it is the absence of one. */
  #nl-window-text .t-s, #nl-about-text .t-s { font-size: 0.85em; }
  #nl-window-text .t-l, #nl-about-text .t-l { font-size: 1.27em; }

  /* ---- BLOCK STRUCTURE from the rich-text editor -----------------------
     Markdoc emits real elements now, where the old marker layer emitted a
     string joined with <br><br>. Every element below corresponds to a button
     in the editor; the two lists are one decision (see keystatic.config.tsx).
     Anything NOT here has no button, and a button with no rule here would
     render nothing — which is why neither list may grow alone. */

  /* paragraphs replace the old double-break convention. The last one carries
     no trailing space, so a body never pushes the layout below it. */
  #nl-window-text .body p, #nl-about-text p { margin: 0 0 1em; }
  #nl-window-text .body p:last-child, #nl-about-text p:last-child { margin-bottom: 0; }

  /* LISTS sit inside the reading measure rather than outdenting past it: the
     text column starts at a left margin everywhere else on the site, and a
     bullet hanging into that margin would be the only thing breaking it. */
  #nl-window-text .body ul, #nl-window-text .body ol,
  #nl-about-text ul, #nl-about-text ol { margin: 0 0 1em; padding-left: 1.4em; }
  #nl-window-text .body li, #nl-about-text li { margin: 0 0 0.25em; }

  /* QUOTE — marked by a rule in the margin, not by italics or quotation
     marks, both of which already mean something else here. */
  #nl-window-text .body blockquote, #nl-about-text blockquote {
    margin: 0 0 1em; padding-left: 1em;
    border-left: 1px solid rgba(143,143,153,0.5);
  }
  #nl-window-text .body blockquote p:last-child,
  #nl-about-text blockquote p:last-child { margin-bottom: 0; }

  /* DIVIDER — a hairline at the same accent grey as the seam between the two
     halves of the page, so the one horizontal rule in the copy matches the
     one horizontal rule in the layout. */
  #nl-window-text .body hr, #nl-about-text hr {
    border: 0; height: 1px; margin: 1.6em 0;
    background: rgba(143,143,153,0.5);
  }

  /* LINK — underlined, offset to clear descenders like the underline mark,
     and inheriting ink rather than introducing a colour. This site has two
     colours; a link is not the place to add a third. */
  #nl-window-text .body a, #nl-about-text a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 0.18em;
    text-decoration-thickness: 1px;
    transition: color 0.18s ease;
  }
  /* Hover DIMS rather than brightens: everywhere else on this site the
     accent grey is the resting state and ink is the active one — the footer,
     the caret, the close mark all go grey -> ink on hover. A link starts at
     ink because it is content, so it has to travel the other way to say the
     same thing. Focus matches, for the keyboard. */
  #nl-window-text .body a:focus, #nl-about-text a:focus { color: rgba(143,143,153,0.9); }
  @media (hover: hover) {
    #nl-window-text .body a:hover, #nl-about-text a:hover { color: rgba(143,143,153,0.9); }
  }

  /* STRIKETHROUGH */
  #nl-window-text .body s, #nl-about-text s { text-decoration: line-through; }

  /* INLINE CODE has no button — it is off in the editor. This rule exists
     because Markdoc still honours backticks typed by hand, and unstyled
     <code> would inherit a proportional face and look like a mistake rather
     than a choice. The site ships no monospace, so this borrows the system's
     and accepts that it is the one place a fifth typeface appears. */
  #nl-window-text .body code, #nl-about-text code {
    font-family: ui-monospace, Menlo, Monaco, monospace;
    font-size: 0.92em;
  }
  #nl-window.l-grid.more #nl-main        { flex: 1 1 auto; min-height: 0; }
  #nl-window.l-grid.more #nl-window-text { height: 100%; overflow-y: auto; }
  #nl-window.l-grid.more #nl-car         { display: none; }   /* copy covers the grid */

  /* THE CARET IS DRAWN, NOT TYPED.
     It used to be two characters swapped by JS — U+2304 down, U+2303 up.
     Neither is in PP Neue Montreal, so BOTH fell through to the fallback
     stack, and a fallback stack resolves each codepoint independently: the
     two halves of one control could arrive from two different installed
     fonts, at different weights and different optical sizes. The open and
     closed states visibly disagreed, and which fonts you had decided how
     badly.

     Two borders on a rotated box has no such dependency. The closed and open
     states are the SAME shape 180 degrees apart, so they are exact mirrors by
     construction rather than by hoping two glyphs were designed as a pair.
     It also finally matches the other controls: x and <- ARE in the typeface,
     and a fallback caret sitting beside them never could.

     currentColor keeps the existing colour, focus and hover rules working
     untouched; sizing in em keeps it tracking the type. */
  #nl-more {
    display: none;
    flex: 0 0 auto; align-self: flex-start;
    margin-top: 2px;
    padding: 4px 12px 4px 0;                   /* fat tap target */
    font-size: 13px; line-height: 1;
    color: rgba(143,143,153,0.9);
    pointer-events: auto; cursor: pointer;
    user-select: none;
  }
  #nl-more::before {
    content: '';
    display: block;
    width: 0.46em; height: 0.46em;
    border-right:  1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    /* 45deg puts the open corner at the bottom: a chevron pointing DOWN */
    transform: rotate(45deg);
    /* the drawn mark sits high in its box once rotated; nudge it back onto
       the optical centre. Identical in both states, so it cannot desync. */
    margin: -0.12em 0 0.12em 0;
  }
  /* OPEN: the same shape, half a turn. Not a second glyph — the same one. */
  #nl-window.l-grid.more #nl-more::before { transform: rotate(225deg); }
  /* shown only when the copy actually overflows its clamp */
  #nl-window.l-grid #nl-more.on   { display: block; }
  #nl-window.l-grid.x #nl-more    { display: none; }
  #nl-more:focus-visible { color: var(--ink); }   /* :focus-visible: a tapped control keeps focus and would stay ink */
  @media (hover: hover) { #nl-more:hover { color: var(--ink); } }

  /* EXPANDED inside l-grid. The grid steps aside and the view becomes the
     standard expanded one: image filling the content area inside the margins,
     and the strip returns as the FILMSTRIP at the foot so the rest of the set
     stays reachable — a grid of forty pieces is exactly where you need to keep
     moving without going back out.
     #nl-main must flex here: outside the expanded state l-grid pins it to its
     natural height (text sits on top of the grid), but with no height to fill,
     the image view collapses instead of filling. */
  #nl-window.l-grid.x #nl-main   { flex: 1 1 auto; min-height: 0; }
  #nl-window.l-grid.x #nl-expand { display: flex; flex-direction: column; }
  #nl-window.l-grid.x #nl-car {
    display: block;
    flex: 0 0 var(--car-h, 25%);
    height: var(--car-h, 25%);
    margin: 12px 0 0;
  }
  /* the cells stop being a grid and become a horizontal strip again: height
     drives the box and the inline 16:9 aspect ratio gives the width */
  #nl-window.l-grid.x .car {
    display: flex;
    gap: 10px;
    height: 100%;
    justify-content: flex-start;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
  }
  #nl-window.l-grid.x .car .ph {
    width: auto; height: 100%;
    flex: 0 0 auto;
    scroll-snap-align: start;
  }

  /* --------------------------------------------------- layout: l-form */
  /* One rule, and it is the whole reason this layout has its own name: the
     form takes the FORM measure, not the reading one. Everything else about
     it is l-text, which is why it borrowed that name until now. */
  #nl-window.l-form #nl-window-text { max-width: var(--measure-form); }

  /* ------------------------------------------------ content-area wordmark */
  /* The brand's FULL mark, centered in the open area above the carousel —
     the left column's empty row in landscape. Its counterpart in the grid
     below is the compact lettermark/icon; this is the spelled-out version.
     LANDSCAPE ONLY: portrait has no such void (text and carousel already
     fill the single column), so the element stays display:none there.
     ALPHA IS THE SHAPE: the art is used as a MASK filled with var(--ink) —
     the DOM analog of the shader's `uInk * alpha`. One file serves both
     themes, and brand colors resolve to ink exactly like the grid icons.
     Authoring constraint follows from that: transparent-background art,
     real counterforms, no white knockouts. */
  #nl-mark {
    display: none;
    background-color: var(--ink);
    -webkit-mask-repeat: no-repeat;   mask-repeat: no-repeat;
    -webkit-mask-position: center;    mask-position: center;
    -webkit-mask-size: contain;       mask-size: contain;
    pointer-events: none;             /* purely presentational */
  }
  /* HERO FALLBACK: no wordmark supplied, so the project's FIRST image takes
     the same slot. It is NOT masked — a photograph has to read as itself, so
     the ink fill and the mask are both switched off and the picture is drawn
     directly, CONTAINED so nothing is cropped. Same slot, two treatments:
     a mark becomes ink, an image stays an image. */
  #nl-mark.hero {
    background-color: transparent;
    -webkit-mask-image: none;         mask-image: none;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }
  @media (orientation: landscape) {
    /* not shown while an image is expanded (that cell becomes the
       breadcrumb) or on carless entries (ABOUT / the form span both
       columns — there is no left column to sit in) */
    #nl-window:not(.x):not(.l-text):not(.l-form):not(.l-grid) #nl-mark {
      display: block;
      grid-column: 1; grid-row: 1;
      justify-self: center; align-self: center;
      /* ABSOLUTE caps, the taskbar rule applied to imagery: the mark stops
         growing once the window passes laptop width, so a 27" monitor gets
         more surrounding space, not a bigger logo. Percentages keep it
         proportionate on short landscape phones. Deliberately conservative —
         a little too small beats a little too big. */
      width:  min(50%, 320px);
      height: min(40%, 110px);
    }
    /* a hero earns more of the open area than a wordmark does */
    #nl-window:not(.x):not(.l-text):not(.l-form):not(.l-grid) #nl-mark.hero {
      width:  min(100%, var(--hero-max, 720px));
      height: 100%;
    }
  }

  /* ------------------------------------------------ image carousels (static) */
  /* #nl-car is the HOST: it owns the pinned footprint at the window's foot —
     ~25% of the window (--car-h from resize()), same place for every
     selection. Inside it, ONE strip PER ENTRY (unique images per project),
     display-swapped with the text. STATIC for now — scroll/snap only, no
     modal or expansion. Pointer events on so swiping never closes the window. */
  #nl-car {
    flex: 0 0 var(--car-h, 25%);
    height: var(--car-h, 25%);
    margin: 12px 0 0;
  }
  #nl-car .car {
    height: 100%;
    display: flex; gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    pointer-events: auto;
    scrollbar-width: none;
  }
  #nl-car .car::-webkit-scrollbar { display: none; }
  #nl-car .ph {
    flex: 0 0 auto;
    height: 100%;
    /* aspect-ratio is set PER THUMB inline: from the image record's stored
       ratio, or measured on decode when the record omits it */
    background: #808080;                       /* 50% grey base — shows while the image loads */
    background-size: cover;                    /* thumbs render the image itself (background-image
                                                  set inline from the entry's image src) */
    background-position: center;
    scroll-snap-align: start;
    cursor: pointer;
  }
  /* while expanded, the strip doubles as the filmstrip: the active thumb
     holds full presence, the rest degrade — coherent vs. degraded, in image
     terms */
  #nl-car .car.expanded .ph { opacity: 0.4; }
  #nl-car .car.expanded .ph.on { opacity: 1; }

  /* the visible exit: one × for every entry, pinned to the window's corner.
     It does NOT churn — it's a global control, not content: it appears and
     disappears with the window but is always resolved and always in the same
     place. Alongside it: the frozen icon, grid gaps, and Esc. */
  #nl-close {
    position: absolute;
    top: 8px; right: 10px;
    z-index: 1;                                /* stays above the expand layer */
    padding: 8px 10px;                         /* fat tap target */
    font-size: 13px; line-height: 1;
    color: rgba(143,143,153,0.9);
    pointer-events: auto; cursor: pointer;
    user-select: none;
  }
  #nl-close:focus-visible { color: var(--ink); }   /* :focus-visible: a tapped control keeps focus and would stay ink */
  @media (hover: hover) { #nl-close:hover { color: var(--ink); } }

  /* ------------------------------------------------ contact form (last icon) */
  /* Fields are bare — no boxes, just the accent underline, ink on focus.
     (Pointer events come from #nl-window-text; no per-entry rule needed.) */
  #nl-window label {
    display: block; margin: 8px 0 0;
    color: rgba(143,143,153,0.9); letter-spacing: 0.05em;
  }
  #nl-window input, #nl-window textarea {
    display: block; width: 100%;
    background: transparent; color: var(--ink);
    border: 0; border-bottom: 1px solid rgba(143,143,153,0.5);
    border-radius: 0; outline: none;
    font: inherit; letter-spacing: inherit;
    padding: 4px 0 5px; margin-top: 1px;
  }
  #nl-window textarea { resize: none; }
  #nl-window input:focus, #nl-window textarea:focus { border-bottom-color: var(--ink); }
  #nl-window .send {
    display: inline-block; margin-top: 14px;
    color: rgba(143,143,153,0.9); cursor: pointer; letter-spacing: 0.15em;
  }
  #nl-window .send:focus-visible { color: var(--ink); }   /* :focus-visible: a tapped control keeps focus and would stay ink */
  @media (hover: hover) { #nl-window .send:hover { color: var(--ink); } }

  /* ------------------------------------------------ copyright (right margin)
     The horizontal footer strip is spent on navigation, so the second footer
     line turns 90° and stands in the RIGHT MARGIN instead — the one piece of
     page furniture in the site that runs vertically.

     It occupies the same --nl-m strip every other margin uses, centered across
     it, and sits one margin above the SEAM between grid and content. So its
     three placement values are all the single spacing value: the strip it
     lives in, the centering across it, and the gap above the line.

     Reads BOTTOM-TO-TOP, so it rises off the seam rather than running down
     into it. writing-mode rather than a bare rotate() because it gives the
     element a genuinely tall, narrow LAYOUT box — it can then be positioned
     and centered like anything else, instead of being nudged into place after
     the fact. The 180° flip is what turns vertical-rl's downward reading
     upward; delete that one line to run it the other way.

     Non-churn, like the footer and the marks: page furniture, not content.
     (It sits outside every element spanify touches, so this is automatic.) */
  #nl-copy {
    position: absolute;
    right: 0;
    bottom: var(--nl-m, 24px);
    width:  var(--nl-m, 24px);                 /* the margin strip itself */
    display: flex;
    justify-content: center;                   /* centered ACROSS the strip */
    color: rgba(143,143,153,0.5);              /* the footer's grey */
    pointer-events: none;
    user-select: none;
  }
  #nl-copy span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);                 /* bottom-to-top */
    font-size: 11px;
    line-height: 1;                            /* LOAD-BEARING: in vertical text
                                                  the line box becomes the WIDTH,
                                                  so this is what fits 11px of
                                                  type inside the 12.5px strip.
                                                  At the default ~1.2 it would be
                                                  13px and overhang both edges. */
    letter-spacing: 0.15em;                    /* the footer's tracking */
    white-space: nowrap;
  }

  /* ------------------------------------------------ footer line (site nav) */
  /* The footer is the site's PRIMARY NAVIGATION. Three sections (BUILD /
     DESIGN / ART) each load their own icon set into the grid; CONTACT and
     ABOUT are fixtures that take the window without a grid icon — both moved
     here OUT of the icon grid, so the grid holds work and nothing else.
     Separators are spacing, not commas: five labels at the old 0.25em with
     commas measured 358px and overflowed narrow phones. At 0.15em with 8px
     side padding the row is 295px — it clears a 320px viewport. */
  #nl-fns {
    position: absolute; left: 0; right: 0;
    bottom: 20px;
    bottom: max(20px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 11px; letter-spacing: 0.15em;
    color: rgba(143,143,153,0.5);              /* project accent — legible on both fields */
    pointer-events: none;                      /* only the words are live */
    user-select: none;
  }
  #nl-fns [data-nav] {
    color: inherit;
    pointer-events: auto; cursor: pointer;
    padding: 6px 8px;                          /* tap target AND the separation
                                                  that the commas used to give */
  }
  /* :focus-visible, NOT :focus. A tabindex span KEEPS focus after a tap, so
     with plain :focus the label you last clicked stayed ink alongside the
     .on label — two coherent labels at once, which the footer is not
     allowed to show. :focus-visible only paints the keyboard ring. */
  #nl-fns [data-nav]:focus-visible { color: var(--ink); }
  @media (hover: hover) { #nl-fns [data-nav]:hover { color: var(--ink); } }

  /* --------------------------------------------------- the field's one control
     Hidden by default and shown only where the mode can actually be had: a
     real pointer, a wide screen, and (via .can-field, set in JS) a shader and
     no reduced-motion preference. CSS handles what CSS knows; JS handles the
     rest. It never churns — it is a control, and controls stay resolved. */
  #nl-field { display: none; color: inherit; pointer-events: auto; cursor: pointer; padding: 6px 8px; }
  @media (hover: hover) and (pointer: fine) and (min-width: 900px) {
    #noiselab.can-field #nl-field { display: inline; }
  }
  #nl-field:focus-visible { color: var(--ink); }
  @media (hover: hover) { #nl-field:hover { color: var(--ink); } }
  /* in the field the section links are gone — they are not what this mode is
     for — and the one control left is the way out, lit so it can be found */
  #noiselab.field #nl-fns [data-nav] { display: none; }
  #noiselab.field #nl-field { color: var(--ink); }
  /* the window half has nothing in it here, and must not take pointer events
     from a field that now covers the screen */
  #noiselab.field #nl-content { visibility: hidden; }
  /* the seam's travel, in both directions. Added around the move only — left
     on permanently it would animate every ordinary window resize. */
  #noiselab.field-tx #nl-grid { transition: height 900ms cubic-bezier(0.4, 0, 0.2, 1); }
  @media (prefers-reduced-motion: reduce) {
    #noiselab.field-tx #nl-grid { transition: none; }
  }
  /* the active section reads as the coherent one — ink against the grey row.
     (applied by JS once section switching is wired) */
  #nl-fns [data-nav].on { color: var(--ink); }

</style>
</head>
<body>

<div id="noiselab">
  <div id="nl-grid">
    <div id="nl-stage">
      <!-- the canvas is the DRAWING only; its semantics live in #nl-keys
           below, which is the same grid in focusable, labelled DOM -->
      <canvas id="nl-gl" aria-hidden="true"></canvas>
      <!-- one empty focusable span per icon, positioned onto the canvas in
           placeKeys(). Exactly one thing is selected at a time, which is what
           a listbox means — the coherence rule, stated in ARIA. -->
      <div id="nl-keys" role="listbox" aria-label="Projects"></div>
    </div>
  </div>
  <div id="nl-content">
    <div id="nl-about">
      <div class="in" id="nl-about-text"><!-- empty at rest; kept for future copy --></div>
    </div>
    <!-- copyright: the second footer line, turned into the right margin
         because the horizontal strip is spent on navigation. Text set in
         boot() from CONTENT.copyright. -->
    <div id="nl-copy"><span></span></div>
  </div>

  <div id="nl-window">
    <span id="nl-close" role="button" tabindex="0" aria-label="Close">&#x00D7;</span>
    <div id="nl-main">
      <!-- content-area wordmark: centered in the open left column on wide
           screens; hidden in portrait, while expanded, and on carless
           entries. Non-churn material, like the images and the marks. -->
      <div id="nl-mark" role="img"></div>
      <div id="nl-window-text"><!-- per-entry TEXT built in boot() from CONTENT via the adapter --></div>
      <!-- expanded-image view: display-swaps with the text region ('x' class).
           Swipe = prev/next; captions are static content below the image. -->
      <div id="nl-expand">
        <div id="nl-exp-top">
          <span id="nl-back" role="button" tabindex="0" aria-label="Back to project">&#x2190;</span>
          <span class="hd" id="nl-exp-hd"></span>
        </div>
        <div id="nl-exp-stage">
          <div id="nl-exp-fit">
            <img id="nl-exp-img" alt="" draggable="false">
          </div>
        </div>
        <div id="nl-exp-cap"></div>
      </div>
    </div>
    <!-- 'read more' caret: opens a clamped body to full height in l-grid.
         Sits between the text region and the images because that is exactly
         where it acts. Non-churn: it is a control, not copy. -->
    <span id="nl-more" role="button" tabindex="0" aria-expanded="false" aria-label="Read more"></span>
    <!-- carousel HOST, pinned to the window's foot — the POSITION is shared,
         the carousels are not: one strip per entry is built in boot() from
         each entry's images and display-swapped in sync with the text. The
         contact form has none (the host collapses and the form takes the
         full height). -->
    <div id="nl-car"></div>
  </div>

  <!-- primary navigation. BUILD / DESIGN / ART switch the grid's icon set;
       CONTACT / ABOUT open the window without a grid selection. Behaviour is
       NOT wired yet — see the stub handlers in the script. -->
  <div id="nl-fns"><span role="button" tabindex="0" data-nav="build">BUILD</span><span role="button" tabindex="0" data-nav="design">DESIGN</span><span role="button" tabindex="0" data-nav="art">ART</span><span role="button" tabindex="0" data-nav="contact">CONTACT</span><span role="button" tabindex="0" data-nav="about">ABOUT</span><span role="button" tabindex="0" id="nl-field" aria-pressed="false" aria-label="Enter the field">&#x25C7;</span></div>
</div>

<script>
/* -------------------------------------------------------------------------
   SVG Noise Lab — architecture map (mobile-first; desktop pass in progress)

   - EDITABLE CONTENT: all copy lives in ONE labelled block, CONTENT, near the
     top of the IIFE — about / contact / sections, in plain-language fields
     (title, details, summary, images, wordmark, layout, expand). A thin
     ADAPTER (buildData) turns that authoring shape into the internal shape the
     rest of the code runs on. That adapter is the seam a CMS plugs into: same
     authoring shape in, no change to anything downstream.
   - SECTIONS: the work is three lists — BUILD / DESIGN / ART — each with its
     own icon set. The footer switches between them; switching churns the whole
     grid over and exchanges the set at the midpoint, so all sections are baked
     up front. ABOUT and CONTACT are FIXTURES: footer entries that take the
     window with no grid icon behind them. Window entries are one flat list
     ([...sections, ABOUT, form]) so switching is always a display swap.
   - STATE is three values: activeSection (which icon set), selected (which
     project is frozen), fixture (ABOUT/CONTACT holding the window). They feed
     one winTarget() so grid taps and footer taps share the same machinery.
     Exactly one thing is coherent at any moment — with a fixture open that
     thing is the footer label, and the whole grid churns.
   - WebGL grid: entry icons baked to textures; simplex-warp shader; selection
     = coherence (selected icon freezes, all others churn). Icon size is FIXED
     in CSS px (the taskbar rule: CELL_PX) and the menu is ONE ROW at every
     width. Too many icons for the viewport is solved by SCROLLING that row —
     swipe it, with momentum — never by wrapping it or shrinking the icons.
   - GRID KEYBOARD / SCREEN READER: the canvas is pixels, so a parallel DOM
     layer (#nl-keys) carries the semantics — one empty focusable span per
     icon, laid onto that icon's resting cell box, labelled with its title.
     A listbox with a roving tabindex: one tab stop, arrows move focus, Enter
     commits. Focus is deliberately NOT selection.
   - NO-WEBGL FALLBACK: the shader is an ENHANCEMENT. If the context, the
     shader compile, or the bake fails, `gl` goes null, #noiselab gains .nogl,
     and that same key layer becomes the VISIBLE menu — a wrapped list of
     titles, selected one in ink. Everything else (window, layouts, churn,
     footer, form, theme) is untouched and runs identically. boot() never
     returns early any more.
   - THE MEASURE: the same rule applied to TYPE. Body copy caps at --measure
     (66ch) rather than tracking the window, so a wide screen gains space and
     not longer lines. CSS only — see the token at the top of the stylesheet.
   - WINDOW LAYOUTS, named and chosen per project by the `layout` field; the
     window wears the name as an `l-<name>` class and CSS restructures:
       standard  carousel strip at the foot; wordmark (or, absent one, the
                 first image as a hero) centred in the open landscape column
       grid      fixed 16:9 cells, column count adapting; text above, images
                 below. Long copy clamps with a caret that opens it over the
                 grid. Portrait phones pin to 2 columns (count, not size).
       text      copy only, full width — ABOUT and the contact form
     `.x` (image expanded) composes on top of any layout.
   - Image expand: in-flow display swap ('x' class); swipe = prev/next;
     captions static below the image; the strip becomes the filmstrip.
     Per-entry `expand` decides whether images open at all.
   - IMAGES: one upload each; the strip loads a host-resized version via
     IMAGE_TRANSFORM (the deploy seam), the expanded view loads the original.
     Records carry `ratio` so the page never downloads an image to measure it.
   - ROUTING: state has an ADDRESS. #section/slug/image mirrors the three
     state values; applyRoute() drives the same setters the pointer does, so
     there is one code path per transition, not two. Slugs come from titles
     (survive reordering). Deeper = push, sibling = replace, so back pops a
     LEVEL: image -> project -> rest, the same ladder as Escape.
   - Theme: system prefers-color-scheme -> CSS vars + GL clear / uInk.
   - COPYRIGHT: the second footer line, rotated 90° into the right margin,
     reading bottom-to-top, one margin above the seam. The horizontal strip
     was already spent on navigation. Text lives in CONTENT.copyright.
   - Coherence swap: one churn mechanism drives window open/close/switch and
     the section change — text dissolves to noise, hard-cuts at the midpoint,
     re-forms. Controls (x, back, caret, thumbs) never churn.

   All tunable knobs live in the config block at the top of the IIFE.
------------------------------------------------------------------------- */
(function () {
  // ---------------------------------------------------------------- config
  // The grid is ONE ROW at every width, so COLS is simply the icon count. It
  // survives because the keyboard layer reads it: Arrow Up/Down step by a
  // column count, which in one row means "jump to the end".
  let COLS = 4;                 // set to the icon count in resize()
  const BAKE_PX = 320;          // per-icon bake resolution (crispness vs size)

  // Render resolution (supersampling). The canvas backing store is sized at this
  // multiple of CSS px. Low-DPI screens (most desktops, dpr 1) otherwise render
  // the warp soft; flooring at 2 keeps icons crisp there. High-DPI phones are
  // capped at 2 for lightness — they already looked sharp.
  const RENDER_SCALE_MIN = 2;   // floor — supersamples 1x (desktop) displays
  const RENDER_SCALE_MAX = 2;   // ceiling — caps cost on 2x/3x phones

  // transition timing (asymmetric: snap on, ease off)
  const ON_TIME  = 0.12;        // seconds, off -> on
  const OFF_TIME = 0.80;        // seconds, on  -> off

  // the contact text settles slower than the grid: its close (window -> about)
  // runs at 2x the icon OFF_TIME. Opening still shares ON_TIME.
  const CONTACT_OFF_TIME = OFF_TIME * 2;   // 1.60s

  // GRID REORGANISATION (see NOTES-GRID-MOTION.md). A section switch displaces
  // every icon while it is churned, so the grid ARRIVES SOMEWHERE rather than
  // exchanging contents inside a fixed lattice. Position rides the same
  // asymmetric clock as the churn: out on ON_TIME, back on OFF_TIME.
  //
  // Amplitude is in CELL WIDTHS, not pixels. That is what makes a resize
  // mid-flight harmless — the offset rescales with the cell instead of being
  // a stale pixel count (hazard 2 in the note).
  //
  // THE CEILING ON MOVE_AMP IS DERIVED, NOT TASTE. The canvas hugs the grid
  // with exactly ONE margin outside it, and that margin is MARGIN_RATIO of a
  // pitch while a cell is (1 - GAP_RATIO) of a pitch. So the headroom before an
  // icon runs off the canvas edge is:
  //
  //     MARGIN_RATIO / (1 - GAP_RATIO)  =  0.20 / 0.80  =  0.25 cells
  //
  // in EVERY direction and at EVERY size — when the GRID_MAX_FRAC cap shrinks
  // the canvas it scales pitch, cell and margin together, so the ratio is
  // invariant. That is the second reason amplitude is in cell widths rather
  // than pixels: the limit travels with it.
  //
  // Measured: at 0.55 the icons clipped hard against the canvas edge at the
  // peak of the churn. 0.22 sits just inside the headroom. Going meaningfully
  // further needs either a per-icon clamp or a canvas with room to breathe —
  // a real input to the arrangement design, recorded in NOTES-GRID-MOTION.md.
  //
  // Motion changes WHERE, never HOW BIG — the taskbar rule is untouched.
  const MOVE_AMP     = 0.22;    // peak displacement, in cell widths (max 0.25)
  const MOVE_STAGGER = 0.22;    // seconds — total spread of the RETURN only
  const MOVE_JITTER  = 0.9;     // radians of scatter off the radial direction

  // OFF BY DEFAULT — add ?motion to the URL to enable it, the same testing
  // idiom as ?nogl. The mechanism is finished and the hazards are handled,
  // but the ARRANGEMENT is not designed: every icon currently returns to the
  // cell it left, so this is motion, not reorganisation.
  //
  // Judged in the preview and it made the site worse, which is the correct
  // outcome for a placeholder rather than a surprise. Two reasons, and the
  // first is the one that was actually felt:
  //
  //   1. Motion forces the input lock, and the lock is the real cost — the
  //      grid stops accepting taps for ~0.92s after a section switch instead
  //      of 0.12s. Paying that for a transition that gains nothing is a
  //      straight regression.
  //   2. Wiggling outward and returning home is not a weak version of a
  //      rearrangement, it is a DIFFERENT motion. Icons arriving at different
  //      cells is the thing; no amount of tuning this gets there.
  //
  // One flag switches off the displacement AND the lock, because the lock
  // only ever arms from armGridMotion(). Turn it on when step 4 exists.
  const GRID_MOTION = /[?&#]motion\b/.test(location.search + location.hash);

  // ------------------------------------------------------------- the field
  // The desktop-only interaction that is NOT a container for portfolio
  // content. See NOTES-ICON-FIELD.md. The seam rises off the top, the icons
  // follow it up and multiply into a field of churning shapes that are no
  // longer links, and a click resolves one into a geometric form.
  //
  // PROPORTIONS ARE HELD, COUNT IS DERIVED — the taskbar rule, unchanged.
  // Same fixed pitch as the menu; COLS *and* ROWS both come from the viewport
  // rather than from the icon count. That inversion is the whole layout
  // difference: the menu asks "how do N icons fit?", the field asks "how many
  // cells fit on this screen?" (~300 on a 14in laptop, ~840 at 2560 wide).
  const FIELD_RISE   = 900;     // ms for the seam to travel off the top
  const FIELD_MIN_W  = 900;     // px — below this the field is not offered
  const FIELD_SWAP   = 0.14;    // seconds — icons are fully churned by here,
                                // so the cell set is exchanged noise-to-noise,
                                // the same invisible cut used everywhere else

  // THE EXERCISE. Without a limit the field has no stakes: ~300 cells, free
  // clicks, and you simply resolve all of them. The budget is what makes it
  // an exercise rather than a toy — and it does not break the site's central
  // rule, it GENERALISES it. The portfolio says exactly ONE thing is coherent
  // at a time; the field says exactly twelve. Same grammar, different number.
  //
  // The consequence is the good part: the field is larger than the window of
  // attention you are allowed, so it forgets behind you as you move across
  // it, and searching it becomes a real activity.
  const FIELD_BUDGET = 12;      // cells that may be coherent at once

  // THE NEEDLE. One cell churns slightly calmer than the rest — lower
  // amplitude, slower evolution. It is findable BY LOOKING, which is the
  // whole point: the site's thesis is that noise resolves into form under
  // attention, so its one interactive piece should reward attention rather
  // than exhaustive clicking. Resolve it and it is exempt from the budget
  // and never dissolves — the single permanent mark on a surface that
  // forgets everything else.
  //
  // Both knobs are deliberately subtle. Raise them if it proves too hard to
  // spot; the failure mode to avoid is a cell that announces itself.
  const FIELD_CALM_AMP = 0.30;  // fraction of churn amplitude removed
  const FIELD_CALM_SPD = 0.50;  // fraction of churn speed removed
  const FIELD_REVEAL   = 2.6;   // seconds the whole field stays resolved

  // the one effect, parameterised. off = breathe, on = degrade.
  // amp is in UV units (fraction of an icon). these are the knobs to taste.
  // AMP_OFF is 0: THE RESTING GRID DOES NOT MOVE. It used to breathe at 0.018,
  // which read as a page that had not finished loading rather than as a page at
  // rest. Only SPEED_OFF stays non-zero — amplitude 0 makes it invisible, but
  // it keeps each icon's phase clock running, so churn starts from a spread of
  // phases instead of every icon flinching in unison.
  const AMP_OFF  = 0.0,   AMP_ON  = 0.38;   // displacement magnitude
  const FREQ_OFF = 1.6,   FREQ_ON = 5.5;    // noise frequency across the icon
  const SPEED_OFF= 0.18,  SPEED_ON= 0.95;   // noise evolution (per second)

  // --------------------------------------------------------- layout knobs
  // Expressed relative to the cell PITCH (cell + gap), not to the canvas, so
  // cells stay square and gaps stay uniform in BOTH orientations.
  const GAP_RATIO    = 0.20;      // gap as a fraction of one pitch
  const MARGIN_RATIO = GAP_RATIO; // outer padding EQUALS the icon gap — one
                                  // spacing value everywhere (also feeds --nl-m)

  // THE TASKBAR RULE. The icon cell is a FIXED size in CSS px — like an OS
  // taskbar, it does not grow because the window or monitor did, and it does
  // not shrink to make a long list fit either.
  //
  // THE MENU IS ONE ROW, AT EVERY WIDTH. Overflow is solved by SCROLLING the
  // row, not by wrapping it. Narrow viewports used to gain rows instead (390px
  // portrait was 6 x 3), and that was wrong twice over: three rows of icons ate
  // a third of a phone screen for navigation, and the seam — which follows the
  // menu — jumped every time the row count changed. Wrapping also reads badly
  // at this size, because rows two and three look like a second, lesser menu
  // when they are the same menu. So the row keeps its size and gains a swipe.
  // 50 reproduces the reference phone layout exactly.
  // Accessibility comes free: CSS px track browser zoom and OS display
  // scaling, so user-level size preferences scale the icons; raw window
  // real estate never does.
  const CELL_PX = 50;

  // Strip reserved below the grid for the single-line footer (FN slots now,
  // copyright later). The canvas sits flush on top of it.
  const FOOTER_RESERVE = 52;      // px

  // LAST-RESORT cap: the grid half (canvas + footer reserve) may take at most
  // this fraction of the page, so the contact half always keeps working room.
  // With fixed cells this should rarely bite (very short viewports, or a much
  // longer project list); when it does, the canvas shrinks uniformly — the
  // one case where icons give up their fixed size rather than evict the
  // content half.
  const GRID_MAX_FRAC = 0.60;

  // ------------------------------------------------------- menu row feel
  // Knobs for the swipeable menu row (armed only while it overflows — see
  // relayout). Every rate is per SECOND and integrated against real dt, so the
  // gesture feels identical on a 60Hz phone and a 120Hz one.
  //
  // NAMING: this file already had a "carousel" — the image strip pinned at
  // the foot of the window (#nl-car, --car-h). That one is unrelated. This is
  // the MENU ROW, and everything belonging to it is ROW_ / row.
  // THE GLIDE IS A BEARING, NOT A BRAKE. Friction is the e-folds per second of
  // the coast: bigger stops sooner. iOS UIScrollView decelerates at about
  // 2.0/s (its "normal" rate is 0.998 per millisecond, and ln(0.998) * 1000 is
  // -2.0), so this is a little freer than the platform the phone came with.
  // It started at 4.6 and that read as drag, not as a bearing — a flick died
  // in under a second. At 1.6 a firm flick coasts ~1250px, which on a phone is
  // the whole row plus slack, so most flicks now arrive at an end. That is the
  // point, and it is why the ends bounce (ROW_EDGE_* below) instead of
  // stopping dead — a bearing that hits a hard stop reads as a broken one.
  const ROW_FRICTION = 1.6;     // glide decay: velocity e-folds this often /s
  const ROW_STOP_V   = 14;      // px/s — below this the glide is over. Low, so
                                // the coast ends by running out rather than by
                                // being switched off
  const ROW_MAX_V    = 5000;    // px/s — a flick cannot throw harder than this
  const ROW_TAP_SLOP = 8;       // px of travel still counted as a TAP, not a drag
  const ROW_STALE_MS = 90;      // finger held still this long before lifting
                                // means place, not throw: no momentum
  const ROW_RUBBER   = 0.35;    // resistance while dragging past either end
  const ROW_SPRING   = 12;      // settle rate /s for scroll-into-view (focus,
                                // routing) — a move the row makes on its own
  // Past either end the row meets a spring, not a wall: it carries a little
  // way out, is pulled back, and settles without ringing. Overshoot is
  // v0 / (sqrt(K) * e) — about 40px arriving at 2500px/s. Damping sits just
  // above critical (2 * sqrt(K) = 35.8), so it returns once and stops.
  const ROW_EDGE_K    = 320;    // spring rate back toward the end, /s^2
  const ROW_EDGE_DAMP = 36;     // damping on that spring, /s
  const ROW_OVER_MAX  = 60;     // px — cap on wheel overscroll. A finger is
                                // limited by the screen; a trackpad's momentum
                                // stream is not, and would drag the row into
                                // the middle of nowhere
  // The dissolve at a scrollable edge is ONE PITCH wide, and that is a
  // guarantee, not a taste. A mask can only dissolve ink that is actually
  // under it, and this row is mostly empty: between the ink of one icon and
  // the ink of the next lies a gap plus both icons' transparent margins —
  // 12.5 + 9 + 9 = 30.5px of nothing at CELL_PX 50. A 32px ramp, which is what
  // this was, can therefore land almost entirely in that void: at a 396px
  // viewport it covered 2px of one icon's trailing edge at 6% alpha and the
  // fade was invisible. Whether the affordance appeared at all depended on
  // where the window edge happened to fall.
  //
  // One pitch cannot land in the void, because the void is shorter than a
  // pitch: any pitch-wide window contains one whole cell's worth of art. Worst
  // case — the void sitting at the very edge — the nearest icon still ramps
  // from 0 to about 50% across its own width, so it reads as dissolving rather
  // than as ending. It is derived in relayout() from the pitch actually in use,
  // so it follows the cells if GRID_MAX_FRAC ever shrinks them.
  let rowFadePx = 0;            // px — set in relayout()

  // Baked content fill: source art occupies this fraction of its tile,
  // leaving a transparent ring for the warp to spill into.
  const BAKE_FILL = 0.64;       // bumped from 0.55 — larger, sharper icons per cell

  // ------------------------------------------------------- dynamic shrink
  // As noise activates, each icon scales down using the SAME eased value
  // that drives the warp (so it shrinks at the same time and rate). At
  // SCALE_ON === BAKE_FILL, a fully-warped icon — whose content can reach
  // its quad edge — lands no further out than the calm icon's silhouette
  // did. i.e. the gap you see in the OFF state is the gap you keep in the
  // ON state. Nudge SCALE_ON up toward ~0.65 to let a little warp peek past.
  const SCALE_OFF = 1.0;        // footprint-filling at rest
  const SCALE_ON  = BAKE_FILL;  // tracks BAKE_FILL — the buffer-preserving value

  // ------------------------------------------------------- placeholder art
  // Test icon sources — each is referenced by ONE entry below; swapping an
  // entry's icon for a client mark is a data edit. The bake step makes the
  // source kind irrelevant to everything downstream.
  const svgURL = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  const SVG_CIRCLE = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff"/></svg>`;
  const SVG_TRI    = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><polygon points="50,8 92,86 8,86" fill="#fff"/></svg>`;
  const SVG_RING   = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="12"/></svg>`;
  const SVG_SQUARE = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect x="16" y="16" width="68" height="68" fill="#fff"/></svg>`;
  const SVG_DIAMOND= `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><polygon points="50,6 94,50 50,94 6,50" fill="#fff"/></svg>`;

  function makeTestPNG(kind) {           // genuine image/png, decoded via <img>
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'); x.clearRect(0, 0, S, S);
    x.fillStyle = '#fff'; x.strokeStyle = '#fff';
    if (kind === 'blob') {
      const g = x.createRadialGradient(S/2, S/2, 3, S/2, S/2, S*0.5);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(S/2, S/2, S*0.5, 0, 7); x.fill();
    } else if (kind === 'squares') {
      x.lineWidth = 8;
      for (let r = S*0.46; r > 6; r -= 18) x.strokeRect(S/2 - r, S/2 - r, 2*r, 2*r);
    } else if (kind === 'rings') {
      x.lineWidth = 7;
      for (let r = S*0.42; r > 8; r -= 16) { x.beginPath(); x.arc(S/2, S/2, r, 0, 7); x.stroke(); }
    } else if (kind === 'bars') {
      const n = 5, bw = S*0.1, gp = (S - n*bw)/(n+1);
      for (let i = 0; i < n; i++) x.fillRect(gp + i*(bw+gp), S*0.18, bw, S*0.64);
    } else { // dots
      const n = 6, gap = S/(n+1), rad = gap*0.28;
      for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
        x.beginPath(); x.arc(i*gap, j*gap, rad, 0, 7); x.fill();
      }
    }
    return c.toDataURL('image/png');
  }

  // ratio-true grey placeholder image — stands in for real project imagery
  // in both the thumbs and the expanded view (one src, two uses)
  const PH = (r) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${r[0] * 120}" height="${r[1] * 120}"><rect width="100%" height="100%" fill="#808080"/></svg>`);

  // Placeholder image records for one entry: 4 DISTINCT aspect ratios from a
  // shuffle SEEDED by the entry index (mulberry32) — every entry gets its own
  // mix, identical across loads. Filler captions on images 1-3; the last
  // stays captionless to demonstrate the empty state. Real records replace
  // these wholesale: { src, caption, alt, ratio:[w,h] } — ratio optional
  // (stored = stable layout; omitted = measured on decode, settles once).
  const RATIOS = [[4,3],[3,4],[16,9],[2,3],[3,2],[1,1],[9,16]];
  const seededRnd = (seed) => () => {           // mulberry32 — tiny seeded PRNG
    seed = (seed + 0x6D2B79F5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
  // Placeholder wordmark: abstract letterform blocks at roughly 4:1, seeded
  // by entry index so each project reads as a different mark and is identical
  // across loads. White on transparent — the mask only reads alpha. Drawn as
  // shapes, never SVG <text>: rasterising text-in-SVG is the known-bad path
  // in this codebase (same reason the icon bake draws glyphs to canvas).
  function placeholderWordmark(i, title) {
    const rnd = seededRnd(i * 7919 + 13);
    const W = 400, H = 100;
    let bars = '', x = 14;
    while (x < W - 30) {
      const w = 18 + Math.round(rnd() * 44);
      if (x + w > W - 14) break;
      const h = 34 + Math.round(rnd() * 30);
      bars += `<rect x="${x}" y="${((H - h) / 2).toFixed(1)}" width="${w}" height="${h}" rx="3" fill="#fff"/>`;
      x += w + 11;
    }
    return {
      src: svgURL(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg>`),
      alt: title + ' — placeholder wordmark',
    };
  }

  function placeholderImages(i, hd, count) {
    const rnd = seededRnd(i * 1013 + 7);
    const pool = RATIOS.slice();                // per-entry deterministic shuffle
    for (let j = pool.length - 1; j > 0; j--) {
      const q = (rnd() * (j + 1)) | 0;
      [pool[j], pool[q]] = [pool[q], pool[j]];
    }
    const n = count || 4;
    while (pool.length < n) pool.push(RATIOS[(rnd() * RATIOS.length) | 0]);
    return pool.slice(0, n).map((r, k) => ({
      src: PH(r),
      ratio: r,                                 // always present -> no probe, no measuring fetch
      caption: k < 3 ? `${hd} — detail 0${k + 1}, placeholder caption.` : '',   // last ones bare: the empty state
      alt: `${hd} — placeholder image ${k + 1}`,
    }));
  }

  /* =======================================================================
     EDITABLE CONTENT  —  edit the text between the quotes; leave the rest.
     =======================================================================
     WHERE THIS LIVES, AND WHY (inline, not a separate content file):
