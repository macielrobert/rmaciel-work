# Decap CMS — rmaciel.work
# Lives at /admin/config.yml in the repo.
#
# WHY JSON AND NOT MARKDOWN OR YAML (format: json below):
#   The build script that folds this content back into index.html has to READ
#   these files. JSON.parse is built into Node — nothing to install. Markdown
#   and YAML both need a parser from npm, which would put a dependency in the
#   build for no gain. The CMS form looks identical either way; only the file
#   on disk differs.
#
# WHAT IS DELIBERATELY NOT A FORM FIELD:
#   ratio — [width, height] of each image. Required by the site (without it
#   the page downloads every image at load just to measure it). Decap's image
#   widget does not report dimensions, so the BUILD SCRIPT reads it out of the
#   uploaded file's header and writes it. Never typed by hand.

backend:
  name: github
  repo: macielrobert/rmaciel-work   # verify — owner/repo exactly
  branch: main

# Uploads land here and are committed to the repo like any other file.
media_folder: "images"
public_folder: "/images"

# Every save opens a pull request instead of committing to main.
# This preserves the deploy-preview loop you already have: edit, preview,
# then publish. Turn it off later if the extra click stops earning itself.
publish_mode: editorial_workflow

collections:

  # ---------------------------------------------------------------------
  # PROJECTS — one file per project. This is the "add project" form.
  # ---------------------------------------------------------------------
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    extension: json
    format: json
    slug: "{{fields.slug}}"
    summary: "{{order}} · {{section}} · {{title}}"
    sortable_fields: [order, section, title]
    fields:

      - name: title
        label: Title
        widget: string
        hint: Shown as the window header. Also the fallback URL slug.

      - name: slug
        label: URL slug
        widget: string
        pattern: ['^[a-z0-9-]+$', 'lowercase letters, numbers and hyphens only']
        hint: >
          Frozen permanent address, e.g. vessel-series. Set it once and never
          change it — a sent link breaks if this changes. Retitling is safe;
          re-slugging is not.

      - name: section
        label: Section
        widget: select
        options:
          - { label: BUILD,  value: build }
          - { label: DESIGN, value: design }
          - { label: ART,    value: art }

      - name: order
        label: Position in grid
        widget: number
        value_type: int
        default: 10
        hint: >
          Low numbers first. Use 10, 20, 30 so you can slot something between
          two without renumbering everything.

      - name: draft
        label: Hold back (do not publish)
        widget: boolean
        default: false
        hint: On = written but absent from the live site.

      - name: details
        label: Detail lines
        widget: list
        field: { name: line, label: Line, widget: string }
        hint: The short lines under the title — material, edition, year. Usually three.

      - name: summary
        label: Description
        widget: text
        required: false
        hint: >
          Blank line between paragraphs. In the grid layout a long body is
          clamped and opened by the caret; elsewhere it runs on.

      - name: layout
        label: Layout
        widget: select
        default: standard
        options:
          - { label: "Standard — carousel strip + hero/wordmark", value: standard }
          - { label: "Grid — fixed 16:9 cells",                   value: grid }
          - { label: "Text — full-width copy, no images",         value: text }
        hint: Grid needs a viewport of at least 500px; below that it falls back to standard.

      - name: expand
        label: Allow image expand
        widget: boolean
        default: true
        hint: Off = images display but cannot be opened full-view or swiped.

      # -- Marks -----------------------------------------------------------
      # Two DIFFERENT assets. The icon is the grid tile; the wordmark is the
      # large mark inside the open window. Do not upload the same file to both.

      - name: icon_type
        label: Grid icon — kind
        widget: select
        default: glyph
        options:
          - { label: "Typed character (glyph)", value: glyph }
          - { label: "Uploaded mark",           value: image }

      - name: icon_glyph
        label: Grid icon — character
        widget: string
        required: false
        hint: One character. Rendered in the system font — platform variation is intended.

      - name: icon_image
        label: Grid icon — file
        widget: image
        required: false
        hint: >
          TRANSPARENT PNG or SVG with real counterforms. Alpha is the shape —
          an opaque PNG or any JPG becomes a solid block. Request the mark,
          not the lockup.

      - name: wordmark
        label: Wordmark / hero mark
        widget: image
        required: false
        hint: >
          Optional. Same transparency rule. Leave empty and the first strip
          image is used as the hero instead.

      # -- Images ----------------------------------------------------------

      - name: images
        label: Images
        widget: list
        required: false
        summary: "{{fields.src}}"
        fields:
          - { name: src,     label: File,    widget: image }
          - { name: alt,     label: Alt text, widget: string,
              hint: "Describes the image for screen readers. Not the caption." }
          - { name: caption, label: Caption, widget: string, required: false,
              hint: "Optional. Shown under the expanded image." }

      # -- Share ------------------------------------------------------------

      - name: share_description
        label: Share description
        widget: text
        required: false
        hint: >
          One or two sentences used in link previews and search results for
          this project. Falls back to the first paragraph of the description.

  # ---------------------------------------------------------------------
  # FIXTURES — not projects. Never appear in the icon grid, never reordered.
  # ---------------------------------------------------------------------
  - name: fixtures
    label: Fixtures
    editor: { preview: false }
    files:

      - name: about
        label: ABOUT
        file: content/about.json
        fields:
          - { name: title,   label: Title,        widget: string }
          - name: details
            label: Detail lines
            widget: list
            field: { name: line, label: Line, widget: string }
          - { name: summary, label: Description,  widget: text,
              hint: "Blank line between paragraphs." }

      - name: contact
        label: CONTACT
        file: content/contact.json
        fields:
          - { name: email,   label: Email address, widget: string }
          - { name: intro,   label: Intro copy,    widget: text, required: false }

      - name: site
        label: Site settings
        file: content/site.json
        fields:
          - { name: site_title,  label: Browser tab title, widget: string,
              hint: "Appears in the tab, bookmarks and search results." }
          - { name: description, label: Site description,  widget: text,
              hint: "The line under your name in a Google result and a pasted link." }
          - { name: share_image, label: Default share image, widget: image, required: false,
              hint: "1200×630. What a pasted link shows when the page has no image of its own." }
          - { name: copyright,   label: Copyright line, widget: string,
              hint: "Set vertically in the right margin." }
