<body>
  <!-- ============================================================
       PINNED ON PURPOSE. Do not loosen this back to a range.

       This was `decap-cms@^3.0.0` — "any 3.x" — so unpkg served whatever the
       newest 3.x happened to be on the day the page was opened. The editor
       could change, or break, between one visit and the next, with no change
       on our side and nothing in the repository to explain it. Everything
       else here is fixed; this was the one moving part.

       It matters more than it looks. This page is the ONLY way the site's
       content gets edited. A CMS that silently updates itself is a CMS that
       can silently stop working, and the first sign of it would be being
       unable to publish.

       TO UPDATE: read the current version from
       https://unpkg.com/decap-cms@latest/package.json, change the number
       below, and check /admin on a deploy preview BEFORE merging — a bad
       version here is only visible by loading the page.
       ============================================================ -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
</body>
</html>
